<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paket Tryout - SAHWAHITA</title>
<style>
  :root{
    --bg:#f4f7f9; --card:#ffffff; --ink:#0d2233; --muted:#5f7184;
    --navy:#0b1a3d; --line:#e3e9ef;
    --free-bg:#d9f3e6; --free-tx:#0f6b3f;
    --prem-bg:#fdecd2; --prem-tx:#9a5a08;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:56px 16px}
  h2{font-size:32px;margin:0 0 6px;font-weight:800}
  .sub{color:var(--muted);margin:0 0 28px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
        padding:24px;box-shadow:0 2px 10px rgba(13,34,51,.05)}
  .badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.4px;
         padding:5px 10px;border-radius:99px;text-transform:uppercase}
  .badge.gratis{background:var(--free-bg);color:var(--free-tx)}
  .badge.premium{background:var(--prem-bg);color:var(--prem-tx)}
  .card h3{font-size:22px;margin:14px 0 14px;font-weight:800}
  .kat{color:var(--muted);margin:0 0 4px}
  .info{color:var(--muted);margin:0 0 16px;font-size:15px}
  .btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;
       padding:11px 16px;border-radius:12px;font-size:15px;font-weight:600}
  .btn:hover{filter:brightness(1.2)}
  .btn:focus-visible{outline:3px solid #2a6df4;outline-offset:2px}
  .kosong{color:var(--muted)}
</style>
</head>
<body>
<section class="wrap" id="paket-tryout">
  <h2>Paket Tryout</h2>
  <p class="sub">Latihan yang bisa langsung Anda kerjakan</p>
  <div class="grid" id="daftarPaket"></div>
</section>

<script>
/* ===== DAFTAR PAKET (semua 8 paket, tanpa batas tampil) =====
   Untuk menambah paket baru: salin satu baris, ubah isinya.
   tipe : "gratis" atau "premium"
   url  : alamat halaman paket (ubah sesuai file/halaman Anda)
*/
const PAKET = [
  { judul:"TWK SENIN 19-10-2026",  kategori:"TWK",        soal:30,  menit:30,  tipe:"gratis",  url:"twk-senin-19-10-2026.html" },
  { judul:"TKP RABU 21-10-2026",   kategori:"TKP",        soal:45,  menit:45,  tipe:"premium", url:"tkp-rabu-21-10-2026.html" },
  { judul:"TO SKD PART 8",         kategori:"TRY OUT SKD",soal:110, menit:120, tipe:"premium", url:"to-skd-part-8.html" },
  { judul:"TIU SELASA 20-10-2026", kategori:"TIU",        soal:35,  menit:45,  tipe:"premium", url:"tiu-selasa-20-10-2026.html" },
  { judul:"TO SKD PART 1",         kategori:"TRY OUT SKD",soal:110, menit:120, tipe:"gratis",  url:"to-skd-part-1.html" },
  { judul:"TO SKD PART 2",         kategori:"TRY OUT SKD",soal:110, menit:120, tipe:"gratis",  url:"to-skd-part-2.html" },
  { judul:"TO SKD PART 3",         kategori:"TRY OUT SKD",soal:110, menit:120, tipe:"gratis",  url:"to-skd-part-3.html" },
  { judul:"TO SKD PART 4",         kategori:"TRY OUT SKD",soal:110, menit:120, tipe:"gratis",  url:"to-skd-part-4.html" }
];

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const el = document.getElementById('daftarPaket');
el.innerHTML = PAKET.length
  ? PAKET.map(p => `
    <article class="card">
      <span class="badge ${p.tipe}">${p.tipe === 'gratis' ? 'Gratis' : 'Premium'}</span>
      <h3>${esc(p.judul)}</h3>
      <p class="kat">${esc(p.kategori)}</p>
      <p class="info">${p.soal} soal · ${p.menit} menit</p>
      <a class="btn" href="${esc(p.url)}">Lihat paket</a>
    </article>`).join('')
  : '<p class="kosong">Belum ada paket tryout.</p>';
</script>
</body>
</html>
