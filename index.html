<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paket Tryout - SAHWAHITA</title>
<style>
  :root{
    --bg:#f4f7f9; --card:#fff; --ink:#0d2233; --muted:#5f7184;
    --navy:#0b1a3d; --line:#e3e9ef;
    --free-bg:#d9f3e6; --free-tx:#0f6b3f;
    --prem-bg:#fdecd2; --prem-tx:#9a5a08;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  a{color:inherit}
  header{background:#fff;border-bottom:1px solid var(--line)}
  .nav{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;
       align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;
         font-weight:800;font-size:22px;letter-spacing:1.5px;color:var(--navy)}
  .logo{width:48px;height:48px;border-radius:50%;object-fit:cover;display:block}
  nav ul{list-style:none;margin:0;padding:0;display:flex;gap:26px;flex-wrap:wrap}
  nav a{text-decoration:none;font-weight:600}
  nav a:hover{color:#2a6df4}

  .wrap{max-width:1100px;margin:0 auto;padding:56px 16px 80px}
  h1{font-size:34px;margin:0 0 6px;font-weight:800}
  .sub{color:var(--muted);margin:0 0 24px}

  .tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
  .tools input{flex:1 1 240px;max-width:360px;padding:11px 14px;border:1px solid var(--line);
               border-radius:12px;font:inherit;background:#fff}
  .tools input:focus{outline:3px solid #2a6df433;border-color:#2a6df4}
  .chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 16px;
        font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
  .jumlah{color:var(--muted);font-size:14px;margin-left:auto}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
        padding:24px;box-shadow:0 2px 10px rgba(13,34,51,.05)}
  .badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.4px;
         padding:5px 10px;border-radius:99px;text-transform:uppercase}
  .badge.gratis{background:var(--free-bg);color:var(--free-tx)}
  .badge.premium{background:var(--prem-bg);color:var(--prem-tx)}
  .card h3{font-size:22px;margin:14px 0 14px;font-weight:800}
  .kat{color:var(--muted);margin:0 0 4px}
  .info{color:var(--muted);margin:0 0 16px;font-size:15px}
  .btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;
       padding:11px 16px;border-radius:12px;font-size:15px;font-weight:600;border:0;cursor:pointer;font-family:inherit}
  .btn:hover{filter:brightness(1.25)}
  .btn:focus-visible,.chip:focus-visible,nav a:focus-visible{outline:3px solid #2a6df4;outline-offset:2px}
  .more{text-align:center;margin-top:30px}
  .pesan{color:var(--muted);padding:24px 0}
</style>
</head>

<main class="wrap">
  <h1>Paket Tryout</h1>
  <p class="sub">Latihan yang bisa langsung Anda kerjakan</p>

  <div class="tools">
    <input type="search" id="cari" placeholder="Cari paket..." aria-label="Cari paket">
    <button class="chip" data-f="semua" aria-pressed="true">Semua</button>
    <button class="chip" data-f="gratis" aria-pressed="false">Gratis</button>
    <button class="chip" data-f="premium" aria-pressed="false">Premium</button>
    <span class="jumlah" id="jumlah"></span>
  </div>

  <div class="grid" id="daftarPaket"></div>
  <p class="pesan" id="pesan" hidden></p>
  <div class="more"><button class="btn" id="btnMore" hidden>Tampilkan lebih banyak</button></div>
</main>

<script>
/* ================= PENGATURAN ================= */
const PER_HALAMAN = 12;          // jumlah kartu per tampilan, tombol "Tampilkan lebih banyak" memuat sisanya (tanpa batas total)

/* Opsional: ambil daftar dari Supabase. Isi nama tabel jika sudah tahu, kosongkan untuk memakai daftar manual di bawah.
   Nama kolom di tabel disesuaikan lewat objek KOLOM. */
const SUPABASE_URL   = "https://mzrblchaoezhrawbmkdk.supabase.co";
const SUPABASE_KEY   = "sb_publishable_do1eWtuMBu6t8WmYql4hkg_or2Tmuo1";
const SUPABASE_TABEL = "";       // contoh: "paket_soal"  (kosong = pakai daftar manual)
const KOLOM = { judul:"judul", kategori:"kategori", soal:"soal", menit:"menit", tipe:"tipe", url:"url", urutan:"urutan" };

/* ================= DAFTAR MANUAL (tanpa batas jumlah) =================
   Tambah paket baru = salin satu baris. Boleh sampai 100 atau lebih.
   tipe: "gratis" / "premium"   url: halaman paket */
let PAKET = [
  { judul:"TWK SENIN 19-10-2026",  kategori:"TWK",         soal:30,  menit:30,  tipe:"gratis",  url:"twk-senin-19-10-2026.html" },
  { judul:"TKP RABU 21-10-2026",   kategori:"TKP",         soal:45,  menit:45,  tipe:"premium", url:"tkp-rabu-21-10-2026.html" },
  { judul:"TO SKD PART 8",         kategori:"TRY OUT SKD", soal:110, menit:120, tipe:"premium", url:"to-skd-part-8.html" },
  { judul:"TIU SELASA 20-10-2026", kategori:"TIU",         soal:35,  menit:45,  tipe:"premium", url:"tiu-selasa-20-10-2026.html" },
  { judul:"TO SKD PART 1",         kategori:"TRY OUT SKD", soal:110, menit:120, tipe:"gratis",  url:"to-skd-part-1.html" },
  { judul:"TO SKD PART 2",         kategori:"TRY OUT SKD", soal:110, menit:120, tipe:"gratis",  url:"to-skd-part-2.html" },
  { judul:"TO SKD PART 3",         kategori:"TRY OUT SKD", soal:110, menit:120, tipe:"gratis",  url:"to-skd-part-3.html" },
  { judul:"TO SKD PART 4",         kategori:"TRY OUT SKD", soal:110, menit:120, tipe:"gratis",  url:"to-skd-part-4.html" }
];

/* ================= LOGIKA ================= */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
let filter = 'semua', kata = '', tampil = PER_HALAMAN;

function terfilter(){
  return PAKET.filter(p =>
    (filter === 'semua' || p.tipe === filter) &&
    (!kata || (p.judul + ' ' + p.kategori).toLowerCase().includes(kata))
  );
}

function gambar(){
  const hasil = terfilter();
  const bagian = hasil.slice(0, tampil);
  $('daftarPaket').innerHTML = bagian.map(p => `
    <article class="card">
      <span class="badge ${p.tipe}">${p.tipe === 'gratis' ? 'Gratis' : 'Premium'}</span>
      <h3>${esc(p.judul)}</h3>
      <p class="kat">${esc(p.kategori)}</p>
      <p class="info">${esc(p.soal)} soal · ${esc(p.menit)} menit</p>
      <a class="btn" href="${esc(p.url)}">Lihat paket</a>
    </article>`).join('');
  $('jumlah').textContent = hasil.length + ' paket';
  $('btnMore').hidden = hasil.length <= tampil;
  const pesan = $('pesan');
  pesan.hidden = hasil.length > 0;
  if (!hasil.length) pesan.textContent = PAKET.length ? 'Tidak ada paket yang cocok.' : 'Belum ada paket tryout.';
}

document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
  filter = b.dataset.f; tampil = PER_HALAMAN;
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
  gambar();
}));
$('cari').addEventListener('input', e => { kata = e.target.value.trim().toLowerCase(); tampil = PER_HALAMAN; gambar(); });
$('btnMore').addEventListener('click', () => { tampil += PER_HALAMAN; gambar(); });

/* Ambil dari Supabase bila SUPABASE_TABEL diisi. Tanpa .limit(), jadi semua baris terbaca
   (Supabase membatasi 1000 baris per permintaan, lebih dari cukup untuk 100 paket). */
async function muatSupabase(){
  if (!SUPABASE_TABEL) return;
  try {
    const url = `${SUPABASE_URL}/rest/v1/${encodeURIComponent(SUPABASE_TABEL)}?select=*&order=${encodeURIComponent(KOLOM.urutan)}.asc`;
    const r = await fetch(url, { headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer ' + SUPABASE_KEY }});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    if (Array.isArray(data) && data.length) {
      PAKET = data.map(d => ({
        judul: d[KOLOM.judul], kategori: d[KOLOM.kategori], soal: d[KOLOM.soal], menit: d[KOLOM.menit],
        tipe: String(d[KOLOM.tipe] || 'gratis').toLowerCase().includes('prem') ? 'premium' : 'gratis',
        url: d[KOLOM.url] || '#'
      }));
    }
  } catch (e) { console.warn('Supabase gagal, memakai daftar manual:', e.message); }
}

gambar();                    // tampil langsung dari daftar manual
muatSupabase().then(gambar); // lalu perbarui jika data Supabase tersedia
</script>
