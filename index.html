<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SAHWAHITA - CAT Try Out CPNS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    
    <!-- 1. SKRIP SUPABASE LENGKAP - JANGAN DIUBAH ATAU DIHAPUS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root{--bg:#0b1424;--bg2:#121d33;--card:#16233d;--tx:#e8eefc;--mut:#8fa0c0;--g:#2AF598;--y:#FFF176;--r:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
        *,*:before,*:after{box-sizing:inherit}
        html{scroll-padding-top:env(safe-area-inset-top,0px)}
        body{margin:0;background:var(--bg);color:var(--tx);font-family:Poppins,system-ui,sans-serif;font-weight:300;min-height:100vh}
        h1,h2,h3{font-weight:800;margin:0}
        .wrap{max-width:1150px;margin:auto;padding:20px}
        .btn{background:var(--g);color:#05261a;border:0;border-radius:10px;padding:11px 22px;font:600 14px Poppins;cursor:pointer;box-shadow:0 0 18px #2af59855}
        .btn:hover{filter:brightness(1.1)}.btn.o{background:transparent;color:var(--g);border:1px solid var(--g);box-shadow:none}.btn.d{background:var(--r);color:#fff;box-shadow:none}.btn.s{padding:6px 12px;font-size:12px}
        input,select{width:100%;background:var(--bg2);border:1px solid #2a3b5e;color:var(--tx);border-radius:10px;padding:11px 14px;font:400 14px Poppins;margin:6px 0 12px}
        input:focus,select:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 3px #2af59833}
        label{font-size:12px;color:var(--mut)}
        .card{background:var(--card);border:1px solid #23355a;border-radius:16px;padding:22px}
        .login-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg); }
        .login-card { background: var(--card); border: 1px solid #23355a; padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 0 30px rgba(42,245,152,0.05); }
        .login-card h2 { color: var(--g); margin-bottom: 24px; text-align: center; }
        .form-group { margin-bottom: 16px; }
    </style>
</head>
<body>

    <div id="app"></div>

<script>
    // 2. KONEKSI KE DATABASE ANDA
    const SUPABASE_URL = "https://supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_do1eWtuMBu6t8WmYql4hkg_or2Tmuo1"; 
    
    // Inisialisasi aman
    const databaseSupa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const app = document.getElementById('app');

    function inisialisasiAplikasi() {
        const session = localStorage.getItem('session_sahwahita');
        if (session) {
            jalankanWebsiteTryoutAsli();
        } else {
            tampilkanFormLogin();
        }
    }

    function tampilkanFormLogin() {
        app.innerHTML = `
            <div class="login-screen">
                <div class="login-card">
                    <h2>SAHWAHITA CAT</h2>
                    <div class="form-group">
                        <label>EMAIL PESERTA</label>
                        <input type="email" id="emailPeserta" placeholder="contoh: peserta1@gmail.com">
                    </div>
                    <div class="form-group">
                        <label>PASSWORD</label>
                        <input type="password" id="passPeserta" placeholder="••••••••">
                    </div>
                    <button class="btn" style="width:100%; margin-top:10px;" onclick="prosesLoginPeserta()">Masuk Sesi Tryout</button>
                </div>
            </div>
        `;
    }

    async function prosesLoginPeserta() {
        const email = document.getElementById('emailPeserta').value;
        const password = document.getElementById('passPeserta').value;
        const tombol = document.querySelector('.login-card .btn');

        if(!email || !password) {
            alert('Harap isi email dan password dengan benar!');
            return;
        }

        tombol.innerText = "Memeriksa Akun...";
        tombol.disabled = true;

        const { data, error } = await databaseSupa.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            alert("Gagal Masuk: " + error.message);
            tombol.innerText = "Masuk Sesi Tryout";
            tombol.disabled = false;
        } else {
            localStorage.setItem('session_sahwahita', JSON.stringify(data.session));
            alert("Login Berhasil! Selamat mengerjakan.");
            inisialisasiAplikasi();
        }
    }

    function jalankanWebsiteTryoutAsli() {
        app.innerHTML = `
            <div class="wrap">
                <nav><span class="t a">Dashboard Tryout Peserta</span> <button class="btn s d" onclick="logoutPeserta()">LOGOUT SYSTEM</button></nav>
                <div class="card" style="margin-top: 20px;">
                    <h3>Selamat Datang di Sistem Ujian Online SAHWAHITA</h3>
                    <p>Akun Anda terverifikasi secara resmi. Silakan hubungi admin pengawas untuk mengaktifkan paket soal ujian Anda.</p>
                </div>
            </div>
        `;
    }

    function logoutPeserta() {
        localStorage.removeItem('session_sahwahita');
        inisialisasiAplikasi();
    }

    inisialisasiAplikasi();
</script>
</body>
</html>
