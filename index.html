njelaskan keterbatasan angka sebelum digunakan dalam pengambilan keputusan.","D":"Menggunakan angka periode sebelumnya agar perbandingan tetap konsisten, kemudian menyampaikan hasil pembaruan dasbor pada laporan berikutnya.","E":"Meminta pegawai yang memperbaiki rumus menjelaskan perubahan tersebut secara lisan kepada pimpinan tanpa melakukan pemeriksaan data lebih lanjut."},"kunci":"C","poin":{"A":2,"B":3,"C":5,"D":4,"E":1},"pembahasan":"A (2 poin): Menggunakan sistem resmi, tetapi status resmi tidak menjamin bahwa perubahan rumus telah tervalidasi.\nB (3 poin): Menghindari penyampaian data yang salah, tetapi audit menyeluruh mungkin tidak diperlukan jika validasi terfokus dapat dilakukan.\nC (5 poin): Memastikan integritas data, keterbandingan indikator, dan transparansi sebelum hasil digunakan.\nD (4 poin): Menjaga konsistensi sementara, tetapi mengabaikan kemungkinan bahwa angka terbaru sebenarnya lebih akurat.\nE (1 poin): Mengandalkan penjelasan pembuat perubahan tanpa verifikasi independen."},{"bagian":"TKP","no":29,"soal":"Anda diminta menyusun laporan kinerja bersama beberapa unit melalui dokumen berbasis awan. Ketika tenggat semakin dekat, beberapa pegawai mengunduh salinan masing-masing dan melakukan penyuntingan secara terpisah. Akibatnya, muncul beberapa versi dokumen dengan angka dan kesimpulan yang berbeda. Sebagian anggota mengusulkan agar koordinator memilih versi yang paling lengkap, sementara yang lain ingin menggabungkan semuanya secara manual. Apa solusi terbaik?","opsi":{"A":"Memilih versi yang paling lengkap berdasarkan jumlah bagian yang sudah diisi agar laporan dapat segera diserahkan kepada pimpinan.","B":"Menggabungkan seluruh versi secara manual dan meminta anggota meninjau hasilnya setelah laporan diserahkan agar tenggat tidak terlewat.","C":"Menetapkan satu dokumen utama mulai sekarang, tetapi tidak melakukan pemeriksaan terhadap perbedaan yang sudah muncul dalam versi sebelumnya.","D":"Menentukan dokumen utama, menetapkan pengendalian versi dan hak penyuntingan, lalu merekonsiliasi perbedaan dengan pemilik data sebelum finalisasi.","E":"Meminta setiap unit mengirimkan versi final masing-masing dan menjadikan seluruh dokumen tersebut sebagai lampiran agar tidak ada kontribusi yang hilang."},"kunci":"D","poin":{"A":2,"B":3,"C":4,"D":5,"E":1},"pembahasan":"A (2 poin): Mempercepat pemilihan, tetapi kelengkapan tidak menjamin kebenaran dan konsistensi.\nB (3 poin): Menggabungkan informasi, tetapi pemeriksaan setelah penyerahan terlalu berisiko.\nC (4 poin): Mencegah perbedaan baru, tetapi belum menyelesaikan ketidaksesuaian yang telah ada.\nD (5 poin): Menetapkan sumber kebenaran, menjaga kendali perubahan, dan memvalidasi data sebelum laporan disahkan.\nE (1 poin): Mempertahankan seluruh kontribusi, tetapi tidak menghasilkan satu laporan utama yang konsisten."},{"bagian":"TKP","no":30,"soal":"Anda menemukan bahwa pegawai di unit Anda sering menggunakan aplikasi penerjemah dan alat bantu berbasis kecerdasan buatan untuk mempercepat penyusunan surat, ringkasan, dan laporan. Penggunaan tersebut menghemat waktu, tetapi beberapa dokumen mengandung informasi yang belum terverifikasi dan ada pegawai yang memasukkan data internal ke layanan daring tanpa memeriksa ketentuan penggunaannya. Pimpinan meminta Anda memberikan rekomendasi kebijakan pemanfaatan teknologi. Rekomendasi terbaik adalah ....","opsi":{"A":"Melarang penggunaan seluruh alat bantu berbasis kecerdasan buatan sampai tersedia aplikasi khusus instansi yang dapat menjamin keamanan dan akurasi hasil.","B":"Membolehkan penggunaan alat bantu tersebut untuk semua jenis dokumen selama pegawai bertanggung jawab memeriksa hasil sebelum mengirimkannya.","C":"Memusatkan penggunaan alat bantu pada pegawai yang memiliki keterampilan digital tinggi agar risiko kesalahan dapat dikendalikan melalui kemampuan pengguna.","D":"Mengizinkan penggunaan untuk dokumen internal yang tidak terlalu penting, tetapi menyerahkan penentuan jenis data yang boleh dimasukkan kepada masing-masing pegawai.","E":"Menetapkan penggunaan berdasarkan risiko, melarang pemasukan data sensitif ke layanan yang tidak disetujui, dan mewajibkan verifikasi manusia serta pelatihan pengguna."},"kunci":"E","poin":{"A":3,"B":4,"C":2,"D":1,"E":5},"pembahasan":"A (3 poin): Mengurangi risiko, tetapi larangan total dapat menghilangkan manfaat penggunaan yang aman dan proporsional.\nB (4 poin): Menekankan verifikasi manusia, tetapi belum cukup mengendalikan kerahasiaan data dan perbedaan tingkat risiko.\nC (2 poin): Memanfaatkan pegawai terampil, tetapi keterampilan digital tidak menggantikan kebijakan keamanan dan pengawasan.\nD (1 poin): Memberikan fleksibilitas, tetapi standar penentuan data terlalu subjektif.\nE (5 poin): Menyeimbangkan manfaat teknologi, keamanan informasi, akuntabilitas, dan peningkatan kompetensi."},{"bagian":"TKP","no":31,"soal":"Anda mendapat tugas menyusun laporan evaluasi program yang harus diserahkan dalam tiga hari. Pada saat yang sama, atasan meminta bantuan mendadak untuk menyiapkan bahan rapat, sementara rekan satu tim sedang tidak masuk kerja. Setelah memeriksa pekerjaan, Anda menyadari bahwa kedua tugas memiliki kepentingan tinggi, tetapi tidak mungkin diselesaikan secara optimal oleh satu orang tanpa penyesuaian. Anda ingin menjaga kualitas pekerjaan dan kepercayaan pimpinan. Apa tindakan terbaik?","opsi":{"A":"Memetakan tenggat dan dampak kedua tugas, mengomunikasikan kapasitas secara terbuka, serta menyepakati prioritas atau pembagian bantuan sebelum menetapkan jadwal penyelesaian.","B":"Menyelesaikan tugas mendadak dari atasan terlebih dahulu karena instruksi terbaru harus selalu diutamakan dibandingkan pekerjaan yang telah direncanakan.","C":"Tetap mengerjakan kedua tugas secara bersamaan dan memperpanjang jam kerja sampai selesai agar tidak perlu meminta penyesuaian kepada pimpinan.","D":"Meminta rekan dari unit lain mengambil alih laporan evaluasi tanpa membahas perubahan tanggung jawab dengan atasan atau pemilik program.","E":"Menyerahkan laporan evaluasi tepat waktu meskipun beberapa analisis belum selesai, kemudian memperbaiki laporan setelah seluruh bahan rapat diserahkan."},"kunci":"A","poin":{"A":5,"B":3,"C":2,"D":1,"E":4},"pembahasan":"A (5 poin): Menunjukkan manajemen prioritas, komunikasi profesional, transparansi kapasitas, dan tanggung jawab atas mutu hasil.\nB (3 poin): Menghormati instruksi atasan, tetapi belum mempertimbangkan tenggat dan dampak tugas yang sudah berjalan.\nC (2 poin): Menunjukkan dedikasi, tetapi berisiko menurunkan kualitas dan tidak menyelesaikan masalah kapasitas secara berkelanjutan.\nD (1 poin): Mencari bantuan, tetapi mengalihkan tanggung jawab tanpa koordinasi.\nE (4 poin): Menjaga tenggat, tetapi menyerahkan hasil yang belum lengkap tanpa kesepakatan kualitas dan tindak lanjut yang jelas."},{"bagian":"TKP","no":32,"soal":"Dalam pemeriksaan laporan keuangan kegiatan, Anda menemukan perbedaan kecil antara bukti transaksi dan angka yang tercantum dalam rekapitulasi. Selisih tersebut tidak mengubah kesimpulan utama laporan, tetapi dapat memengaruhi ketepatan pertanggungjawaban. Rekan yang menyusun laporan meminta Anda mengabaikannya karena tenggat pengumpulan sudah dekat dan nilai selisih dianggap tidak signifikan. Anda tidak ingin memperlambat pekerjaan, tetapi juga tidak ingin mengesahkan informasi yang belum akurat. Apa tindakan terbaik?","opsi":{"A":"Memperbaiki angka berdasarkan perkiraan yang paling masuk akal dan meminta rekan mengesahkannya agar laporan tetap dapat dikumpulkan tepat waktu.","B":"Menelusuri bukti transaksi, mengonfirmasi sumber selisih, mendokumentasikan koreksi, dan menyampaikan laporan setelah angka yang relevan dapat dipertanggungjawabkan.","C":"Mencatat selisih sebagai catatan kecil dalam laporan tanpa mengubah rekapitulasi agar proses pengumpulan tidak tertunda.","D":"Meminta atasan menentukan apakah selisih tersebut perlu diperbaiki karena nilai perbedaannya tidak memengaruhi kesimpulan program.","E":"Menunda seluruh laporan sampai pemeriksaan tambahan selesai, meskipun sebagian besar bagian laporan sudah benar dan dapat diproses."},"kunci":"B","poin":{"A":2,"B":5,"C":3,"D":4,"E":1},"pembahasan":"A (2 poin): Mempercepat pekerjaan, tetapi koreksi berdasarkan perkiraan bukan praktik pertanggungjawaban yang baik.\nB (5 poin): Menjaga akurasi, transparansi, dokumentasi, dan integritas laporan.\nC (3 poin): Mengakui adanya selisih, tetapi membiarkan rekapitulasi tetap tidak akurat.\nD (4 poin): Melibatkan atasan secara tepat, tetapi pemeriksaan awal masih dapat dilakukan oleh penyusun laporan.\nE (1 poin): Berhati-hati, tetapi penundaan seluruh pekerjaan tidak proporsional jika pemeriksaan dapat dilakukan secara terfokus."},{"bagian":"TKP","no":33,"soal":"Anda telah bekerja dengan prosedur administrasi yang sama selama beberapa tahun. Ketika instansi memperbarui standar pelayanan, Anda merasa prosedur baru lebih rumit karena memerlukan pencatatan tambahan dan pemeriksaan digital. Beberapa rekan memilih mempertahankan kebiasaan lama karena selama ini pekerjaan tetap selesai. Namun, standar baru ditetapkan untuk meningkatkan keterlacakan dan mengurangi kesalahan. Apa tindakan paling profesional?","opsi":{"A":"Tetap menggunakan cara lama untuk pekerjaan rutin dan hanya menerapkan prosedur baru pada kasus yang dianggap berisiko tinggi.","B":"Meminta pimpinan memberikan pengecualian bagi pegawai berpengalaman karena mereka telah memahami risiko dari prosedur sebelumnya.","C":"Mempelajari ketentuan baru, menyesuaikan alur kerja, dan menyampaikan kendala beserta usulan perbaikan berdasarkan pengalaman penerapan yang nyata.","D":"Mengikuti prosedur baru sebatas persyaratan yang diperiksa atasan agar beban administrasi tidak bertambah terlalu besar.","E":"Menunggu hingga seluruh rekan menguasai prosedur baru sebelum mengubah kebiasaan kerja supaya tidak terjadi perbedaan cara pelaksanaan."},"kunci":"C","poin":{"A":2,"B":1,"C":5,"D":4,"E":3},"pembahasan":"A (2 poin): Mengutamakan efisiensi, tetapi memilih prosedur berdasarkan penilaian pribadi dapat melanggar standar.\nB (1 poin): Mengandalkan pengalaman untuk meminta pengecualian tanpa dasar yang sah.\nC (5 poin): Menunjukkan adaptasi, kepatuhan, pembelajaran berkelanjutan, dan perbaikan berbasis pengalaman.\nD (4 poin): Berusaha menyesuaikan diri, tetapi penerapan seharusnya mengikuti seluruh ketentuan yang relevan, bukan hanya bagian yang diperiksa.\nE (3 poin): Menghindari perbedaan pelaksanaan, tetapi menunda adaptasi yang seharusnya dapat dimulai segera."},{"bagian":"TKP","no":34,"soal":"Anda diminta memeriksa hasil pekerjaan seorang rekan yang akan digunakan sebagai dasar keputusan penting. Rekan tersebut dikenal memiliki kinerja baik dan meminta Anda mempercepat pemeriksaan karena hasilnya dibutuhkan hari itu juga. Saat memeriksa dokumen, Anda menemukan beberapa asumsi yang belum didukung data, meskipun format dan penyajiannya terlihat sangat profesional. Jika dikembalikan untuk diperbaiki, keputusan pimpinan mungkin tertunda. Apa tindakan terbaik?","opsi":{"A":"Mengesahkan dokumen karena reputasi rekan dan kualitas penyajian menunjukkan bahwa pekerjaan kemungkinan telah dilakukan dengan cermat.","B":"Meminta rekan menambahkan penjelasan umum mengenai asumsi yang digunakan tanpa mengharuskan pemeriksaan terhadap data pendukung.","C":"Menyampaikan keberatan secara informal dan menyerahkan keputusan akhir kepada pimpinan tanpa memberikan catatan pemeriksaan tertulis.","D":"Memeriksa bagian yang memengaruhi keputusan, meminta bukti pendukung untuk asumsi kritis, dan menyampaikan batasan penggunaan dokumen secara jelas.","E":"Menolak seluruh dokumen dan meminta penyusunan ulang dari awal agar tidak ada kemungkinan asumsi yang tidak tepat terbawa ke keputusan."},"kunci":"D","poin":{"A":2,"B":3,"C":4,"D":5,"E":1},"pembahasan":"A (2 poin): Mempercayai rekan dapat membantu hubungan kerja, tetapi reputasi tidak menggantikan pemeriksaan bukti.\nB (3 poin): Memperjelas asumsi, tetapi penjelasan tanpa bukti belum cukup untuk mendukung keputusan penting.\nC (4 poin): Menjaga komunikasi dan melibatkan pimpinan, tetapi catatan pemeriksaan perlu cukup jelas untuk mendukung tindak lanjut.\nD (5 poin): Menyeimbangkan ketelitian, efisiensi, akuntabilitas, dan kejelasan risiko keputusan.\nE (1 poin): Berhati-hati, tetapi penolakan total tidak proporsional apabila kekurangan dapat diperbaiki secara terfokus."},{"bagian":"TKP","no":35,"soal":"Pimpinan meminta Anda menyusun laporan capaian yang akan digunakan dalam evaluasi organisasi. Data menunjukkan bahwa sebagian target tercapai, sedangkan beberapa target lain belum tercapai karena perubahan kondisi lapangan. Seorang rekan menyarankan agar laporan lebih menonjolkan keberhasilan dan tidak terlalu membahas kekurangan supaya citra unit tetap baik. Anda mengetahui bahwa laporan tersebut juga akan menjadi dasar penyusunan anggaran dan perbaikan program berikutnya. Bagaimana Anda sebaiknya bertindak?","opsi":{"A":"Menyusun laporan yang menonjolkan keberhasilan dan menyampaikan kekurangan hanya jika pimpinan secara khusus meminta penjelasan tambahan.","B":"Menuliskan semua kekurangan secara rinci tanpa membedakan dampak, penyebab, dan langkah perbaikan agar laporan benar-benar transparan.","C":"Mengikuti format laporan tahun sebelumnya dan menyesuaikan angka capaian agar penyajian konsisten serta tidak menimbulkan pertanyaan baru.","D":"Menyerahkan penilaian terhadap target yang belum tercapai kepada atasan karena interpretasi kinerja bukan tanggung jawab penyusun data.","E":"Menyajikan capaian dan kekurangan secara seimbang, menjelaskan penyebab berdasarkan bukti, serta mengusulkan tindak lanjut yang dapat diukur."},"kunci":"E","poin":{"A":2,"B":4,"C":1,"D":3,"E":5},"pembahasan":"A (2 poin): Menjaga citra unit, tetapi berisiko menyembunyikan informasi yang penting untuk pengambilan keputusan.\nB (4 poin): Transparan, tetapi laporan perlu menghubungkan kekurangan dengan penyebab dan tindak lanjut agar bermanfaat.\nC (1 poin): Mempertahankan konsistensi tampilan tidak membenarkan penyesuaian angka yang tidak akurat.\nD (3 poin): Menghormati peran atasan, tetapi penyusun tetap bertanggung jawab menyajikan data dan analisis yang benar.\nE (5 poin): Mengutamakan integritas, bukti, pembelajaran organisasi, dan perbaikan kinerja."},{"bagian":"TKP","no":36,"soal":"Anda mendapat kesempatan mengikuti pelatihan kompetensi yang relevan dengan jabatan. Pada saat yang sama, unit Anda sedang menghadapi peningkatan pekerjaan dan atasan khawatir ketidakhadiran Anda akan menghambat penyelesaian tugas. Anda mengetahui bahwa pelatihan tersebut dapat meningkatkan kualitas kerja jangka panjang, tetapi manfaatnya akan berkurang jika hasil pelatihan tidak diterapkan dan dibagikan kepada tim. Tindakan paling tepat adalah ....","opsi":{"A":"Menjelaskan manfaat pelatihan, menyusun rencana penyelesaian tugas selama Anda mengikuti pelatihan, dan merancang penerapan serta berbagi pengetahuan setelahnya.","B":"Mengutamakan pekerjaan rutin dan menolak pelatihan sampai beban kerja kembali normal agar target unit tidak terganggu.","C":"Mengikuti pelatihan tanpa membahas pengaturan tugas dengan atasan karena pengembangan kompetensi merupakan bagian dari tanggung jawab pegawai.","D":"Meminta rekan mengambil alih seluruh tugas Anda selama pelatihan dan berjanji membantu pekerjaannya setelah kembali bertugas.","E":"Mengikuti pelatihan dengan syarat seluruh materi dapat langsung digunakan dalam pekerjaan, sehingga waktu pengembangan kompetensi benar-benar memberikan hasil cepat."},"kunci":"A","poin":{"A":5,"B":3,"C":2,"D":4,"E":1},"pembahasan":"A (5 poin): Menyeimbangkan pengembangan diri, keberlangsungan layanan, penerapan hasil belajar, dan kontribusi terhadap tim.\nB (3 poin): Menjaga pekerjaan saat ini, tetapi menunda pengembangan kompetensi tanpa rencana yang jelas.\nC (2 poin): Mengutamakan pengembangan diri, tetapi mengabaikan koordinasi dan kesinambungan pekerjaan.\nD (4 poin): Mencari solusi pembagian tugas, tetapi perlu kesepakatan beban kerja yang adil dan realistis.\nE (1 poin): Berorientasi pada hasil, tetapi menetapkan syarat yang terlalu sempit terhadap manfaat pelatihan."},{"bagian":"TKP","no":37,"soal":"Dalam pelaksanaan program, Anda menemukan bahwa target waktu yang ditetapkan ternyata tidak realistis karena salah satu tahapan memerlukan verifikasi tambahan. Jika tetap dipaksakan, tim mungkin menyelesaikan pekerjaan tepat waktu tetapi kualitas pemeriksaan menurun. Jika tenggat diubah tanpa dasar yang jelas, unit lain dapat kehilangan kepercayaan terhadap perencanaan Anda. Anda diminta memberikan rekomendasi yang menunjukkan profesionalisme dan tanggung jawab. Apa tindakan terbaik?","opsi":{"A":"Mempertahankan tenggat awal dan meminta tim meningkatkan kecepatan kerja agar keterlambatan tidak menjadi preseden buruk bagi program berikutnya.","B":"Menyampaikan risiko berdasarkan data, mengusulkan penyesuaian jadwal atau sumber daya, dan menyepakati pengendalian mutu serta pelaporan kemajuan.","C":"Mengurangi tahapan verifikasi yang dianggap tidak terlalu penting agar target waktu tetap tercapai dan laporan dapat diserahkan sesuai jadwal.","D":"Menunggu sampai tenggat terlewati sebelum meminta perpanjangan agar keputusan perubahan jadwal didasarkan pada keterlambatan yang nyata.","E":"Menyerahkan penentuan jadwal kepada unit lain karena mereka lebih memahami kebutuhan verifikasi dan dampaknya terhadap proses berikutnya."},"kunci":"B","poin":{"A":3,"B":5,"C":2,"D":1,"E":4},"pembahasan":"A (3 poin): Menunjukkan komitmen terhadap target, tetapi belum mempertimbangkan risiko penurunan kualitas secara realistis.\nB (5 poin): Menggunakan bukti, mengelola ekspektasi, menjaga mutu, dan melibatkan pihak terkait dalam keputusan.\nC (2 poin): Mempertahankan tenggat, tetapi mengorbankan kontrol yang mungkin penting.\nD (1 poin): Menunggu masalah terjadi sebelum bertindak sehingga ruang mitigasi menjadi lebih sempit.\nE (4 poin): Menghargai keahlian unit lain, tetapi tanggung jawab perencanaan tetap perlu dikelola bersama."},{"bagian":"TKP","no":38,"soal":"Anda menjadi anggota tim komunikasi instansi yang memantau informasi publik terkait pelayanan pemerintah. Dalam sebuah grup percakapan, beredar pesan yang mengajak masyarakat menolak seluruh kebijakan pemerintah karena dianggap bertentangan dengan kepentingan kelompok tertentu. Pesan tersebut menggunakan potongan dokumen resmi, tetapi menghilangkan konteks penting dan menyertakan ajakan untuk memusuhi warga yang memiliki pandangan berbeda. Beberapa rekan ingin segera membagikan bantahan dengan bahasa keras. Anda perlu menjaga nilai kebangsaan, ketepatan informasi, dan suasana masyarakat. Apa tindakan terbaik?","opsi":{"A":"Membagikan bantahan yang tegas kepada seluruh grup dan menyebut penyebar pesan sebagai pihak yang tidak memahami kepentingan bangsa.","B":"Mengabaikan pesan tersebut karena masyarakat memiliki kebebasan berpendapat dan setiap orang bertanggung jawab menilai informasi secara mandiri.","C":"Memeriksa sumber dan konteks dokumen, menyampaikan klarifikasi berbasis fakta melalui saluran yang tepat, serta menolak ajakan permusuhan tanpa menggeneralisasi pihak tertentu.","D":"Meminta administrator menghapus semua pesan yang mengkritik kebijakan pemerintah agar diskusi tidak berkembang menjadi perdebatan yang memecah masyarakat.","E":"Menghubungi pengirim secara pribadi dan meminta agar pesan dihapus, tanpa memeriksa kebenaran isi atau menyampaikan klarifikasi kepada pihak yang telah menerimanya."},"kunci":"C","poin":{"A":3,"B":2,"C":5,"D":4,"E":1},"pembahasan":"A (3 poin): Berusaha meluruskan informasi, tetapi penggunaan label yang merendahkan dapat memperbesar konflik dan polarisasi.\nB (2 poin): Menghormati kebebasan berpendapat, tetapi mengabaikan penyebaran informasi menyesatkan dan ajakan permusuhan.\nC (5 poin): Mengutamakan verifikasi, klarifikasi berbasis bukti, penghormatan terhadap perbedaan, dan penolakan terhadap permusuhan.\nD (4 poin): Pengendalian konten dapat diperlukan jika melanggar aturan, tetapi kritik yang sah tidak boleh disamakan dengan ajakan kebencian.\nE (1 poin): Mengupayakan penyelesaian langsung, tetapi tidak memastikan kebenaran informasi atau memperbaiki dampak penyebarannya."},{"bagian":"TKP","no":39,"soal":"Dalam sebuah kegiatan diskusi kebangsaan, seorang peserta menyampaikan pandangan bahwa hanya kelompoknya yang layak menentukan arah kehidupan masyarakat, sedangkan kelompok lain seharusnya tidak diberi ruang berpartisipasi. Peserta tersebut mengutip sejumlah nilai budaya dan keyakinan untuk memperkuat pendapatnya. Sebagian peserta merasa tersinggung dan ingin membalas dengan pernyataan yang sama kerasnya. Sebagai fasilitator, Anda harus menjaga kebebasan menyampaikan pendapat sekaligus mencegah diskriminasi. Apa tindakan paling tepat?","opsi":{"A":"Menghentikan diskusi secara permanen karena pernyataan yang kontroversial dapat mengganggu kerukunan dan merusak tujuan kegiatan kebangsaan.","B":"Membiarkan peserta menyampaikan seluruh pendapatnya tanpa intervensi karena pembatasan terhadap pandangan apa pun dapat dianggap mengurangi kebebasan berekspresi.","C":"Memberikan kesempatan kepada peserta lain untuk membantah secara langsung agar perbedaan pandangan dapat diselesaikan melalui adu argumentasi.","D":"Menegaskan aturan diskusi yang menghormati kesetaraan warga, mengarahkan pembahasan pada argumen dan fakta, serta menghentikan ujaran diskriminatif sesuai tata tertib.","E":"Meminta peserta yang menyampaikan pandangan tersebut meninggalkan ruangan tanpa memberikan kesempatan untuk menjelaskan atau mengoreksi pernyataannya."},"kunci":"D","poin":{"A":3,"B":2,"C":4,"D":5,"E":1},"pembahasan":"A (3 poin): Mencegah eskalasi, tetapi penghentian permanen tidak selalu diperlukan jika diskusi masih dapat dikendalikan.\nB (2 poin): Menghormati kebebasan berekspresi, tetapi mengabaikan kewajiban menjaga kesetaraan dan ketertiban forum.\nC (4 poin): Membuka ruang bantahan, tetapi tanpa aturan fasilitasi dapat memperbesar konflik.\nD (5 poin): Menjaga kebebasan berpendapat dalam batas yang menghormati hak orang lain dan prinsip nondiskriminasi.\nE (1 poin): Mengambil tindakan tegas, tetapi tidak proporsional jika belum mempertimbangkan tingkat pelanggaran dan prosedur forum."},{"bagian":"TKP","no":40,"soal":"Anda menemukan akun media sosial yang menggunakan simbol kebangsaan dan potongan pidato tokoh publik untuk menyebarkan narasi bahwa warga yang berbeda pandangan politik merupakan musuh bangsa. Unggahan tersebut mendapat banyak tanggapan dan beberapa rekan meminta Anda ikut menyebarkannya sebagai peringatan. Anda belum mengetahui siapa pengelola akun tersebut maupun apakah seluruh kontennya benar. Dalam posisi sebagai pegawai pemerintah, Anda ingin bertindak bijak dan tidak memperluas informasi yang berpotensi menyesatkan. Tindakan terbaik adalah ....","opsi":{"A":"Membagikan unggahan dengan tambahan komentar yang mengecam isinya agar lebih banyak orang mengetahui potensi ancaman terhadap persatuan.","B":"Menyimpan seluruh unggahan dan meminta rekan kerja melakukan penyelidikan sendiri sebelum informasi tersebut diteruskan kepada pimpinan.","C":"Memblokir akun dan menghindari semua pembahasan mengenai isu tersebut agar tidak terseret ke dalam konflik politik di media sosial.","D":"Membalas setiap komentar dengan penjelasan mengenai persatuan nasional supaya masyarakat yang membaca diskusi memperoleh pandangan yang lebih seimbang.","E":"Memeriksa konteks dan sumber informasi, tidak menyebarkan konten yang belum terverifikasi, serta melaporkan indikasi pelanggaran melalui mekanisme yang sesuai."},"kunci":"E","poin":{"A":2,"B":4,"C":3,"D":1,"E":5},"pembahasan":"A (2 poin): Berniat memperingatkan masyarakat, tetapi membagikan ulang dapat memperluas jangkauan konten yang belum terverifikasi.\nB (4 poin): Menjaga bukti dan mencari klarifikasi, tetapi penyelidikan perlu dilakukan oleh pihak yang berwenang, bukan secara informal oleh semua rekan.\nC (3 poin): Menghindari keterlibatan dalam konflik, tetapi belum menangani kemungkinan pelanggaran yang perlu dilaporkan.\nD (1 poin): Berniat memberikan edukasi, tetapi membalas setiap komentar dapat memperpanjang konflik dan menyebarkan konten lebih luas.\nE (5 poin): Mengutamakan verifikasi, kehati-hatian digital, dan penanganan melalui saluran resmi."},{"bagian":"TKP","no":41,"soal":"Anda ditugaskan membantu kegiatan orientasi pegawai baru yang membahas Pancasila, UUD 1945, Bhinneka Tunggal Ika, dan komitmen terhadap NKRI. Salah satu peserta menyampaikan kritik terhadap pelaksanaan suatu kebijakan pemerintah dan mempertanyakan apakah kebijakan tersebut telah mencerminkan keadilan. Peserta lain menuduhnya tidak nasionalis karena berani mengkritik kebijakan negara. Anda mengetahui bahwa diskusi semacam ini penting untuk membangun pemahaman kebangsaan yang matang. Apa tindakan paling tepat?","opsi":{"A":"Menjelaskan bahwa kritik terhadap kebijakan dapat disampaikan secara bertanggung jawab, lalu mengarahkan diskusi pada fakta, konstitusi, hak warga, dan kepentingan bersama.","B":"Meminta peserta menghindari kritik terhadap kebijakan pemerintah selama orientasi karena kegiatan tersebut berfokus pada pembentukan sikap nasionalisme.","C":"Meminta peserta yang mengkritik kebijakan membuktikan terlebih dahulu bahwa ia memiliki komitmen kebangsaan sebelum pandangannya dibahas lebih lanjut.","D":"Mengarahkan diskusi hanya pada sejarah perjuangan bangsa agar perbedaan pendapat mengenai kebijakan kontemporer tidak mengganggu tujuan kegiatan.","E":"Menyerahkan perdebatan kepada peserta lain dan membiarkan mereka menentukan sendiri apakah kritik tersebut sesuai dengan nilai nasionalisme."},"kunci":"A","poin":{"A":5,"B":2,"C":1,"D":3,"E":4},"pembahasan":"A (5 poin): Membedakan kritik kebijakan yang sah dari penolakan terhadap nilai kebangsaan serta mendorong diskusi konstitusional.\nB (2 poin): Menjaga fokus kegiatan, tetapi membatasi pembelajaran kritis dan partisipasi yang bertanggung jawab.\nC (1 poin): Memberikan beban pembuktian yang tidak relevan dan dapat menciptakan stigma terhadap pengkritik.\nD (3 poin): Menguatkan pemahaman sejarah, tetapi menghindari persoalan penting yang sedang dibahas peserta.\nE (4 poin): Memberi ruang dialog, tetapi fasilitator tetap bertanggung jawab menjaga ketepatan konsep dan suasana diskusi."},{"bagian":"TKP","no":42,"soal":"Dalam grup komunikasi lingkungan, beredar ajakan untuk tidak berinteraksi dengan warga yang memiliki keyakinan berbeda karena mereka dianggap tidak dapat dipercaya. Pesan tersebut disampaikan dengan bahasa yang tampak santun dan disertai cerita pengalaman pribadi yang belum dapat diverifikasi. Beberapa anggota grup mulai mendukung ajakan tersebut, sementara warga yang menjadi sasaran belum mengetahui percakapan itu. Anda ingin mencegah diskriminasi tanpa memperbesar pertentangan antarwarga. Apa langkah paling tepat?","opsi":{"A":"Meminta administrator menghapus seluruh diskusi mengenai perbedaan keyakinan agar warga tidak memiliki kesempatan memperdebatkan persoalan sensitif.","B":"Menanggapi pesan dengan tenang, mengingatkan pentingnya menilai individu berdasarkan tindakan nyata, memeriksa klaim yang beredar, dan mendorong interaksi yang saling menghormati.","C":"Menyebarkan cerita tandingan tentang kelompok yang menjadi sasaran agar anggota grup memahami bahwa pengalaman buruk tidak dapat digeneralisasi.","D":"Menghubungi seluruh anggota grup secara pribadi dan meminta mereka berjanji tidak membahas keyakinan orang lain lagi di ruang digital.","E":"Membiarkan percakapan berkembang selama tidak terdapat ancaman langsung, karena warga perlu menyelesaikan perbedaan pendapat tanpa campur tangan pihak lain."},"kunci":"B","poin":{"A":3,"B":5,"C":4,"D":2,"E":1},"pembahasan":"A (3 poin): Mengurangi penyebaran pesan, tetapi penghapusan seluruh diskusi dapat membatasi dialog yang sebenarnya sah dan konstruktif.\nB (5 poin): Melawan generalisasi diskriminatif dengan cara faktual, tenang, dan mendorong hubungan sosial yang inklusif.\nC (4 poin): Menunjukkan bahwa generalisasi dapat keliru, tetapi cerita tandingan yang tidak terverifikasi berisiko mengulang masalah yang sama.\nD (2 poin): Mendorong kehati-hatian, tetapi larangan menyeluruh tidak menyelesaikan prasangka yang mendasari percakapan.\nE (1 poin): Menghormati kemandirian masyarakat, tetapi mengabaikan risiko normalisasi diskriminasi."},{"bagian":"TKP","no":43,"soal":"Anda mengikuti pelatihan literasi digital ketika seorang peserta membagikan video yang diklaim menunjukkan tindakan intoleransi oleh suatu kelompok masyarakat. Video tersebut disertai narasi yang mengajak penonton menyimpulkan bahwa seluruh anggota kelompok itu berbahaya. Beberapa peserta ingin segera menyampaikan video tersebut kepada jaringan masing-masing agar masyarakat waspada. Anda menyadari bahwa video bisa saja berasal dari peristiwa berbeda atau telah dipotong dari konteks aslinya. Apa tindakan terbaik?","opsi":{"A":"Menyebarkan video dengan peringatan agar masyarakat tidak mengambil kesimpulan sebelum memperoleh informasi lengkap.","B":"Menyimpan video dan meminta peserta yang membagikannya menjelaskan asal-usulnya, kemudian menerima penjelasan tersebut jika ia mengaku memperoleh dari sumber tepercaya.","C":"Memeriksa sumber asli, waktu, konteks, dan konfirmasi dari sumber tepercaya; menunda penyebaran serta meluruskan generalisasi yang tidak didukung bukti.","D":"Menghapus video dari perangkat dan melarang peserta membahas peristiwa tersebut sampai pihak berwenang mengeluarkan pernyataan resmi.","E":"Membandingkan video dengan komentar pengguna lain dan menyimpulkan kebenarannya berdasarkan kesesuaian pendapat mayoritas di media sosial."},"kunci":"C","poin":{"A":3,"B":4,"C":5,"D":2,"E":1},"pembahasan":"A (3 poin): Memberikan peringatan, tetapi penyebaran ulang tetap dapat memperluas dampak informasi yang belum terverifikasi.\nB (4 poin): Mencari sumber awal, tetapi pengakuan pengirim perlu diuji dengan pemeriksaan independen.\nC (5 poin): Menerapkan verifikasi berlapis dan mencegah kesimpulan diskriminatif berdasarkan informasi yang belum terbukti.\nD (2 poin): Mengurangi paparan, tetapi larangan diskusi total tidak selalu diperlukan dan dapat menghambat klarifikasi.\nE (1 poin): Mengandalkan popularitas pendapat, padahal jumlah orang yang setuju tidak membuktikan kebenaran informasi."},{"bagian":"TKP","no":44,"soal":"Dalam suatu kegiatan pelayanan, seorang warga menyampaikan bahwa ia tidak bersedia dilayani oleh petugas yang berasal dari kelompok sosial tertentu. Ia beralasan bahwa pengalaman buruk yang pernah dialaminya membuat ia tidak percaya kepada kelompok tersebut. Petugas yang ditolak merasa direndahkan dan ingin meninggalkan meja pelayanan. Anda menjadi koordinator yang harus menjaga martabat petugas, hak masyarakat, dan kelancaran layanan. Apa tindakan paling tepat?","opsi":{"A":"Memindahkan petugas ke meja lain untuk sementara agar pelayanan berjalan lancar, tanpa perlu membahas alasan penolakan warga tersebut.","B":"Meminta warga menandatangani pernyataan bahwa ia bersedia dilayani oleh siapa pun sebelum proses administrasi dilanjutkan.","C":"Menegur warga di depan antrean dan menjelaskan bahwa sikapnya tidak dapat diterima agar masyarakat lain memperoleh pelajaran mengenai toleransi.","D":"Menegaskan bahwa pelayanan diberikan secara setara tanpa diskriminasi, menjaga martabat petugas, dan menangani keluhan warga melalui mekanisme yang berlaku.","E":"Menawarkan agar warga menunggu petugas lain apabila antrean memungkinkan, kemudian mendiskusikan persoalan diskriminasi secara terpisah setelah pelayanan selesai."},"kunci":"D","poin":{"A":2,"B":4,"C":3,"D":5,"E":1},"pembahasan":"A (2 poin): Menjaga kelancaran layanan, tetapi dapat memberi kesan bahwa diskriminasi merupakan dasar yang dapat diterima untuk mengubah penugasan.\nB (4 poin): Menegaskan prinsip kesetaraan, tetapi kewajiban menandatangani pernyataan harus sesuai prosedur dan tidak boleh menjadi persyaratan tambahan tanpa dasar.\nC (3 poin): Menolak diskriminasi secara tegas, tetapi teguran di depan umum dapat memperbesar konflik dan mempermalukan pihak yang terlibat.\nD (5 poin): Menegakkan kesetaraan, menjaga martabat petugas, dan menangani keluhan secara profesional.\nE (1 poin): Menghindari konfrontasi sementara, tetapi berpotensi mengakomodasi diskriminasi sebagai dasar pelayanan."},{"bagian":"TKP","no":45,"soal":"Anda menjadi anggota tim yang menyusun program penguatan wawasan kebangsaan bagi masyarakat. Dalam rapat, muncul usulan agar kegiatan difokuskan pada kelompok yang dianggap paling rentan menerima informasi ekstrem, berdasarkan penilaian umum terhadap wilayah tempat tinggal dan latar belakang sosial mereka. Sejumlah anggota menilai pendekatan tersebut akan mempermudah penentuan sasaran, tetapi Anda khawatir cara itu menimbulkan stigma dan mengabaikan kebutuhan kelompok lain. Anggaran program terbatas sehingga sasaran harus dipilih secara rasional. Apa tindakan paling tepat?","opsi":{"A":"Menyetujui usulan tersebut karena program pencegahan perlu memusatkan sumber daya pada kelompok yang dianggap paling berisiko.","B":"Membagi anggaran sama rata ke seluruh wilayah tanpa melakukan pemetaan kebutuhan agar tidak ada kelompok yang merasa dicurigai.","C":"Mengutamakan wilayah yang pernah mengalami konflik sosial dan menggunakan riwayat tersebut sebagai indikator utama dalam menentukan seluruh kegiatan.","D":"Meminta tokoh masyarakat memilih kelompok sasaran berdasarkan pengalaman mereka, lalu mengikuti rekomendasi tersebut agar program mudah diterima warga.","E":"Menetapkan sasaran berdasarkan indikator kebutuhan yang objektif, melibatkan pemangku kepentingan, menghindari stigma identitas, dan mengevaluasi hasil program secara berkala."},"kunci":"E","poin":{"A":2,"B":3,"C":4,"D":1,"E":5},"pembahasan":"A (2 poin): Mengarahkan sumber daya pada pencegahan, tetapi penilaian umum dapat menimbulkan stigma dan salah sasaran.\nB (3 poin): Menghindari perlakuan diskriminatif, tetapi pembagian sama rata belum tentu sesuai dengan kebutuhan yang berbeda.\nC (4 poin): Mempertimbangkan pengalaman konflik yang relevan, tetapi riwayat konflik tidak seharusnya menjadi satu-satunya dasar penentuan sasaran.\nD (1 poin): Melibatkan tokoh masyarakat, tetapi penentuan sasaran tanpa kriteria objektif berisiko bias.\nE (5 poin): Menggunakan pendekatan berbasis bukti, inklusif, proporsional, dan berorientasi pada evaluasi dampak."}];

  if (!a) return 0;
  if (q.poin) return q.poin[a] || 0;               // TKP: poin 1-5 per opsi
  return a === q.kunci ? CFG.poinBenar : 0;        // TWK/TIU: benar = 5
}
function hitung() {
  const r = {};
  BAGIAN.forEach(b => {
    const qs = byBagian(b);
    r[b] = {
      nilai: qs.reduce((t, q) => t + skorSoal(q, S.jawab[q.id]), 0),
      maks: MAKS[b], pg: CFG.pg[b], jml: qs.length,
      terjawab: qs.filter(q => S.jawab[q.id]).length,
      benar: qs.filter(q => !q.poin && S.jawab[q.id] === q.kunci).length
    };
    r[b].lulus = r[b].nilai >= r[b].pg;
  });
  r.total = BAGIAN.reduce((t, b) => t + r[b].nilai, 0);
  r.totalMaks = BAGIAN.reduce((t, b) => t + r[b].maks, 0);
  r.lulus = BAGIAN.every(b => r[b].lulus);
  return r;
}

/* ======== LOGIN ======== */
function sudahLogin() { try { return !!localStorage.getItem('session_sahwahita'); } catch (e) { return false; } }
function formLogin() {
  app.innerHTML = `<div class="login-screen"><div class="login-card"><h2>SAHWAHITA CAT</h2>
    <label>EMAIL PESERTA</label><input type="email" id="emailPeserta" placeholder="peserta@email.com">
    <label>PASSWORD</label><input type="password" id="passPeserta" placeholder="••••••••">
    <button class="btn" id="btnLogin" style="width:100%;margin-top:10px" onclick="loginPeserta()">Masuk Sesi Tryout</button></div></div>`;
}
async function loginPeserta() {
  const email = document.getElementById('emailPeserta').value, password = document.getElementById('passPeserta').value;
  const tb = document.getElementById('btnLogin');
  if (!email || !password) return alert('Harap isi email dan password dengan benar!');
  if (!sb) return alert('Koneksi ke server login gagal dimuat. Periksa internet lalu muat ulang halaman.');
  tb.innerText = 'Memeriksa Akun...'; tb.disabled = true;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { alert('Gagal Masuk: ' + error.message); tb.innerText = 'Masuk Sesi Tryout'; tb.disabled = false; return; }
  try { localStorage.setItem('session_sahwahita', JSON.stringify(data.session)); } catch (e) {}
  mulaiApp();
}
function logout() {
  try { localStorage.removeItem('session_sahwahita'); } catch (e) {}
  if (sb) sb.auth.signOut().catch(() => {});
  mulaiApp();
}
const navTop = () => `<nav class="top"><span class="brand">SAHWAHITA</span><span class="row">${WAJIB_LOGIN ? '<button class="btn s d" onclick="logout()">LOGOUT</button>' : ''}</span></nav>`;

/* ======== BERANDA / PAKET ======== */
function viewHome() {
  const adaProgres = Object.keys(S.jawab).length > 0 && S.mulai && !S.selesai;
  app.innerHTML = `<div class="wrap">${navTop()}
  <h2 style="margin-bottom:6px">Paket Try Out</h2><p class="mut" style="margin-top:0">Pilih paket soal untuk mulai mengerjakan.</p>
  <div class="card"><div class="paket"><div><span class="chip g">SKD CPNS</span>
    <h2 style="margin:8px 0 4px">${esc(CFG.judul)}</h2>
    <span class="mut">${SOAL.length} soal · ${CFG.durasiMenit} menit · pilihan ganda A, B, C, D, E</span></div>
    <div class="row">
      ${S.selesai ? '<button class="btn o" onclick="go(\'result\')">Lihat Hasil</button>' : ''}
      ${adaProgres ? '<button class="btn" onclick="go(\'quiz\')">Lanjutkan</button><button class="btn o" onclick="ulang()">Mulai Ulang</button>' : `<button class="btn" onclick="mulaiTO()">${S.selesai ? 'Kerjakan Lagi' : 'Mulai Try Out'}</button>`}
    </div></div>
    <div class="grid3" style="margin-top:18px">${BAGIAN.map(b => `<div class="sub"><span class="mut">${b} · ${CFG.nama[b]}</span><b>${byBagian(b).length} soal</b>
      <span class="mut" style="font-size:12px">${b === 'TKP' ? 'Skor 1–5 per opsi' : 'Benar = 5 poin'} · maks ${MAKS[b]} · PG ${CFG.pg[b]}</span></div>`).join('')}</div>
  </div></div>`;
}
function mulaiTO() { S = { view: 'quiz', idx: 0, jawab: {}, ragu: {}, mulai: Date.now(), akhir: Date.now() + CFG.durasiMenit * 60000, filter: 'semua' }; simpan(); render(); }
function ulang() { if (confirm('Mulai ulang? Semua jawaban saat ini akan dihapus.')) mulaiTO(); }
function go(v) { S.view = v; simpan(); render(); window.scrollTo(0, 0); }

/* ======== KUIS ======== */
let tmr = null;
const fmt = ms => { const t = Math.max(0, Math.floor(ms / 1000)); const p = n => String(n).padStart(2, '0'); return p(Math.floor(t / 3600)) + ':' + p(Math.floor(t % 3600 / 60)) + ':' + p(t % 60); };
function tick() {
  const el = document.getElementById('timer'); if (!el) return;
  const sisa = S.akhir - Date.now();
  el.textContent = fmt(sisa); el.classList.toggle('low', sisa < 5 * 60000);
  if (sisa <= 0) { alert('Waktu habis! Jawaban Anda dikirim otomatis.'); selesai(true); }
}
function viewQuiz() {
  const q = SOAL[S.idx];
  const tabs = BAGIAN.map(b => `<button class="tab ${q.bagian === b ? 'on' : ''}" onclick="lompat(${SOAL.findIndex(x => x.bagian === b)})">${b} (${byBagian(b).filter(x => S.jawab[x.id]).length}/${byBagian(b).length})</button>`).join('');
  const opsi = Object.keys(q.opsi).map(k => `<button class="opt ${S.jawab[q.id] === k ? 'sel' : ''}" onclick="pilih('${k}')"><span class="l">${k}</span><span>${esc(q.opsi[k])}</span></button>`).join('');
  const nums = byBagian(q.bagian).map(x => `<button class="n ${S.jawab[x.id] ? 'a' : ''} ${S.ragu[x.id] ? 'rg' : ''} ${x.i === S.idx ? 'cur' : ''}" onclick="lompat(${x.i})">${x.no}</button>`).join('');
  app.innerHTML = `<div class="wrap">
  <div class="qhead"><div class="row" style="justify-content:space-between"><b>${esc(CFG.judul)}</b>
    <span class="row"><span class="timer" id="timer">--:--:--</span><button class="btn s" onclick="selesai(false)">Selesai</button></span></div>
    <div class="tabs">${tabs}</div></div>
  <div class="qlayout"><div class="card">
    <div class="row" style="justify-content:space-between"><span class="chip g">${q.bagian} · Soal ${q.no} dari ${byBagian(q.bagian).length}</span>
      <label style="cursor:pointer;display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto;margin:0" ${S.ragu[q.id] ? 'checked' : ''} onchange="ragu(this.checked)"> Ragu-ragu</label></div>
    <div class="soal">${esc(q.soal)}</div>${opsi}
    <div class="navbtns"><button class="btn o" ${S.idx === 0 ? 'disabled' : ''} onclick="lompat(${S.idx - 1})">← Sebelumnya</button>
      ${S.idx === SOAL.length - 1 ? '<button class="btn" onclick="selesai(false)">Selesai</button>' : `<button class="btn" onclick="lompat(${S.idx + 1})">Berikutnya →</button>`}</div>
  </div>
  <div class="card"><b>Nomor soal ${q.bagian}</b><div class="nums" style="margin-top:12px">${nums}</div>
    <div class="legend"><span><i style="background:#0f3a2d;border:1px solid var(--g)"></i>Terjawab</span><span><i style="background:#4a4217;border:1px solid var(--y)"></i>Ragu</span><span><i style="background:var(--bg2);border:1px solid var(--line)"></i>Belum</span></div></div>
  </div></div>`;
  clearInterval(tmr); tick(); tmr = setInterval(tick, 1000);
}
function pilih(k) { S.jawab[SOAL[S.idx].id] = k; simpan(); viewQuiz(); }
function ragu(v) { const id = SOAL[S.idx].id; if (v) S.ragu[id] = 1; else delete S.ragu[id]; simpan(); viewQuiz(); }
function lompat(i) { if (i < 0 || i >= SOAL.length) return; S.idx = i; simpan(); viewQuiz(); window.scrollTo(0, 0); }
function selesai(paksa) {
  if (!paksa) {
    const kosong = SOAL.length - Object.keys(S.jawab).length;
    if (!confirm(kosong ? `Masih ada ${kosong} soal belum dijawab. Yakin ingin menyelesaikan try out?` : 'Selesaikan try out dan lihat skor?')) return;
  }
  clearInterval(tmr); S.selesai = true; S.view = 'result'; S.selesaiPada = Date.now(); simpan(); render(); window.scrollTo(0, 0);
}

/* ======== HASIL ======== */
function viewResult() {
  const r = hitung();
  const gagal = BAGIAN.filter(b => !r[b].lulus);
  const kartu = BAGIAN.map(b => { const x = r[b], pct = Math.min(100, x.nilai / x.maks * 100), pgp = x.pg / x.maks * 100;
    return `<div class="card"><span class="mut">${b} · ${CFG.nama[b]}</span>
      <div class="big" style="color:${x.lulus ? 'var(--g)' : 'var(--r)'}">${x.nilai}<span class="mut" style="font-size:16px;font-weight:400"> / ${x.maks}</span></div>
      <div class="bar ${x.lulus ? '' : 'x'}"><span style="width:${pct}%"></span><em style="left:${pgp}%"></em></div>
      <div class="row" style="justify-content:space-between"><span class="mut" style="font-size:12px">Passing Grade (PG): <b>${x.pg}</b></span>
        <span class="chip ${x.lulus ? 'g' : 'r'}">${x.lulus ? 'Memenuhi PG' : 'Di bawah PG'}</span></div>
      <div class="mut" style="font-size:12px;margin-top:8px">${x.terjawab}/${x.jml} soal terjawab${b === 'TKP' ? '' : ' · ' + x.benar + ' benar'}</div></div>`; }).join('');
  app.innerHTML = `<div class="wrap">${navTop()}
  <div class="status ${r.lulus ? 'lulus' : 'gagal'}"><h2>${r.lulus ? 'LULUS' : 'BELUM LULUS'}</h2>
    <p style="margin:6px 0 0;font-size:16px;font-weight:600">${r.lulus ? 'Selamat Anda Lulus' : 'Silahkan dicoba lagi sampai lulus'}</p>
    ${r.lulus ? '' : `<p class="mut" style="margin:6px 0 0">Nilai di bawah passing grade: ${gagal.join(', ')}</p>`}
    <p style="margin:12px 0 0">Total skor: <b style="font-size:22px">${r.total}</b> <span class="mut">/ ${r.totalMaks}</span></p></div>
  <div class="grid3">${kartu}</div>
  <div class="row" style="margin-top:20px"><button class="btn" onclick="S.filter='semua';go('review')">Lihat Jawaban yang Benar &amp; Pembahasan</button>
    <button class="btn o" onclick="mulaiTO()">Kerjakan Lagi</button><button class="btn o" onclick="go('home')">Kembali ke Paket</button></div></div>`;
}

/* ======== PEMBAHASAN ======== */
function lolos(q, f) {
  const a = S.jawab[q.id];
  if (f === 'semua') return true;
  if (BAGIAN.includes(f)) return q.bagian === f;
  if (f === 'kosong') return !a;
  if (f === 'salah') return !!a && (q.poin ? q.poin[a] < Math.max(...Object.values(q.poin)) : a !== q.kunci);
  return true;
}
function setFilter(f) { S.filter = f; simpan(); viewReview(); }
function viewReview() {
  const fl = [['semua', 'Semua'], ['TWK', 'TWK'], ['TIU', 'TIU'], ['TKP', 'TKP'], ['salah', 'Jawaban kurang tepat'], ['kosong', 'Tidak dijawab']];
  const daftar = SOAL.filter(q => lolos(q, S.filter));
  const kartu = daftar.map(q => {
    const a = S.jawab[q.id], maksPoin = q.poin ? Math.max(...Object.values(q.poin)) : 0;
    const opsi = Object.keys(q.opsi).map(k => {
      const benar = q.poin ? q.poin[k] === maksPoin : k === q.kunci;
      const cls = benar ? 'ok' : (a === k ? 'bad' : '');
      const tanda = (a === k ? 'Jawaban Anda' : '') + (benar ? (a === k ? ' · ' : '') + 'Kunci' : '');
      return `<div class="opt ${cls}" style="cursor:default"><span class="l">${k}</span><span>${esc(q.opsi[k])}</span>
        <span class="pt">${q.poin ? '+' + q.poin[k] + ' poin' : ''}${q.poin && tanda ? ' · ' : ''}${esc(tanda)}</span></div>`; }).join('');
    const sk = skorSoal(q, a);
    return `<div class="card rv"><div class="row" style="justify-content:space-between"><span class="chip g">${q.bagian} · Soal ${q.no}</span>
      <span class="chip ${sk >= (q.poin ? maksPoin : CFG.poinBenar) ? 'g' : 'r'}">${a ? 'Poin Anda: ' + sk : 'Tidak dijawab'}</span></div>
      <div class="soal">${esc(q.soal)}</div>${opsi}
      <div class="mut" style="font-size:13px">${q.poin ? 'Kunci (poin tertinggi): <b>' + q.kunci + '</b>' : 'Kunci jawaban: <b>' + q.kunci + '</b>'}</div>
      <div class="bahas"><b>Pembahasan</b>\n${esc(q.pembahasan)}</div></div>`; }).join('');
  app.innerHTML = `<div class="wrap">${navTop()}
  <div class="row" style="justify-content:space-between;margin-bottom:14px"><h2>Jawaban &amp; Pembahasan</h2><button class="btn o" onclick="go('result')">← Kembali ke Skor</button></div>
  <div class="filters">${fl.map(([k, n]) => `<button class="tab ${S.filter === k ? 'on' : ''}" onclick="setFilter('${k}')">${n}</button>`).join('')}</div>
  ${kartu || '<div class="card mut">Tidak ada soal pada filter ini.</div>'}</div>`;
}

/* ======== ROUTER ======== */
function render() {
  clearInterval(tmr);
  if (S.view === 'quiz' && !S.mulai) S.view = 'home';
  if (S.view === 'quiz') return viewQuiz();
  if (S.view === 'result' && S.selesai) return viewResult();
  if (S.view === 'review' && S.selesai) return viewReview();
  S.view = 'home'; viewHome();
}
function mulaiApp() { if (WAJIB_LOGIN && !sudahLogin()) formLogin(); else { muat(); render(); } }
mulaiApp();
</script>
</body>
</html>
