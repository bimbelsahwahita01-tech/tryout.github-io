<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAHWAHITA - CAT Try Out CPNS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
<!-- Library Supabase (alamat sudah diperbaiki) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0b1424;--bg2:#121d33;--card:#16233d;--tx:#e8eefc;--mut:#8fa0c0;--g:#2AF598;--y:#FFF176;--r:#ff6b6b;--line:#23355a;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Poppins,system-ui,sans-serif;font-weight:300;min-height:100vh;line-height:1.55}
h1,h2,h3{font-weight:800;margin:0}
.wrap{max-width:1150px;margin:auto;padding:20px 16px}
.btn{background:var(--g);color:#05261a;border:0;border-radius:10px;padding:11px 22px;font:600 14px Poppins,system-ui,sans-serif;cursor:pointer;box-shadow:0 0 18px #2af59855}
.btn:hover{filter:brightness(1.1)}
.btn.o{background:transparent;color:var(--g);border:1px solid var(--g);box-shadow:none}
.btn.d{background:var(--r);color:#fff;box-shadow:none}
.btn.s{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input{width:100%;background:var(--bg2);border:1px solid #2a3b5e;color:var(--tx);border-radius:10px;padding:11px 14px;font:400 14px Poppins,system-ui,sans-serif;margin:6px 0 12px}
input:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 3px #2af59833}
label{font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.mut{color:var(--mut)}
nav.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
nav.top .brand{font-weight:800;color:var(--g);letter-spacing:.5px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:720px){.grid3{grid-template-columns:1fr}}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--mut)}
.chip.g{color:var(--g);border-color:var(--g)} .chip.r{color:var(--r);border-color:var(--r)}
.big{font-size:36px;font-weight:800;line-height:1.1}

/* login */
.login-screen{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
.login-card{background:var(--card);border:1px solid var(--line);padding:40px 32px;border-radius:16px;width:100%;max-width:400px;box-shadow:0 0 30px rgba(42,245,152,.05)}
.login-card h2{color:var(--g);margin-bottom:24px;text-align:center}

/* paket */
.paket{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:center}
.sub{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px}
.sub b{display:block;font-size:20px;color:var(--g)}

/* quiz */
.qhead{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.timer{font-weight:800;font-size:20px;color:var(--y);font-variant-numeric:tabular-nums}
.timer.low{color:var(--r)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tab{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:7px 14px;font:600 13px Poppins,system-ui,sans-serif;cursor:pointer}
.tab.on{background:var(--g);color:#05261a;border-color:var(--g)}
.qlayout{display:grid;grid-template-columns:1fr 290px;gap:18px;align-items:start}
@media(max-width:900px){.qlayout{grid-template-columns:1fr}}
.soal{font-size:15px;font-weight:400;white-space:pre-line;margin:10px 0 16px}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--bg2);border:1px solid #2a3b5e;color:var(--tx);border-radius:12px;padding:12px 14px;margin-bottom:10px;font:400 14px Poppins,system-ui,sans-serif;cursor:pointer}
.opt:hover{border-color:var(--g)}
.opt .l{flex:0 0 28px;height:28px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:13px}
.opt.sel{border-color:var(--g);background:#14324a}
.opt.sel .l{background:var(--g);color:#05261a;border-color:var(--g)}
.opt.ok{border-color:var(--g);background:#0f3a2d}
.opt.bad{border-color:var(--r);background:#3a1a24}
.opt .pt{margin-left:auto;flex:0 0 auto;font-size:12px;font-weight:600;color:var(--y);white-space:nowrap}
.navbtns{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.n{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 0;font:600 12px Poppins,system-ui,sans-serif;cursor:pointer}
.n.a{background:#0f3a2d;border-color:var(--g)} .n.rg{background:#4a4217;border-color:var(--y)}
.n.cur{outline:2px solid var(--tx)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* hasil */
.status{border-radius:16px;padding:22px;text-align:center;margin-bottom:18px;border:2px solid}
.status.lulus{border-color:var(--g);background:#0f3a2d} .status.gagal{border-color:var(--r);background:#3a1a24}
.status h2{font-size:26px}
.bar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:10px 0 6px;position:relative}
.bar>span{display:block;height:100%;background:var(--g)} .bar.x>span{background:var(--r)}
.bar>em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--y)}

/* review */
.rv{margin-bottom:16px}
.bahas{background:var(--bg2);border-left:3px solid var(--g);border-radius:8px;padding:12px 14px;margin-top:12px;font-size:13.5px;white-space:pre-line}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
</style>
</head>

<div id="app"></div>

<script>
/* ======== DATA SOAL (110 soal: TWK 30, TIU 35, TKP 45) ======== */
const SOAL = [{"bagian":"TWK","no":1,"soal":"Pemerintah daerah sedang menyusun kebijakan pengembangan kawasan wisata yang diproyeksikan mampu meningkatkan pendapatan asli daerah secara signifikan. Sebuah perusahaan asing menawarkan investasi besar dengan syarat pengelolaan kawasan sepenuhnya menggunakan tenaga ahli dari luar negeri, produk lokal tidak diwajibkan masuk ke rantai pasok, dan identitas budaya masyarakat setempat hanya boleh ditampilkan apabila mendukung strategi pemasaran perusahaan. Di sisi lain, pelaku usaha lokal memiliki keterbatasan modal dan pengalaman sehingga belum mampu memenuhi seluruh standar operasional perusahaan tersebut. Sebagai aparatur pemerintah yang terlibat dalam tim evaluasi investasi, Anda harus mengambil keputusan yang mengutamakan kepentingan nasional tanpa menutup diri terhadap kerja sama global. Kebijakan yang paling tepat adalah ....","opsi":{"A":"Menyetujui investasi karena pertumbuhan ekonomi dan peningkatan pendapatan daerah merupakan ukuran utama keberhasilan pembangunan, sedangkan keterlibatan tenaga kerja lokal dapat ditingkatkan secara bertahap setelah perusahaan memperoleh keuntungan yang stabil.","B":"Menolak seluruh investasi asing dan memusatkan pengembangan kawasan pada pelaku usaha lokal, meskipun kapasitas modal dan teknologi mereka belum memadai, sebab kemandirian nasional harus diwujudkan dengan menghindari ketergantungan terhadap pihak luar.","C":"Menerima investasi dengan memberikan keleluasaan operasional kepada perusahaan, kemudian meminta pemerintah daerah menyediakan program pelatihan bagi masyarakat agar pada masa mendatang mereka mampu bersaing tanpa harus mengubah persyaratan utama investasi yang telah disepakati.","D":"Mengevaluasi investasi berdasarkan manfaat ekonomi jangka panjang, menetapkan persyaratan kemitraan dengan usaha lokal, peningkatan kompetensi tenaga kerja Indonesia, pelindungan warisan budaya, serta mekanisme pengawasan yang memastikan keuntungan pembangunan dirasakan masyarakat.","E":"Menunda investasi sampai pelaku usaha lokal mampu menguasai teknologi, pemasaran, dan pengelolaan kawasan secara mandiri, kemudian membuka kembali proses penawaran ketika seluruh persyaratan operasional dapat dipenuhi tanpa bantuan perusahaan asing."},"kunci":"D","poin":null,"pembahasan":"Nasionalisme tidak berarti menolak kerja sama internasional, tetapi memastikan bahwa kerja sama tersebut memberikan manfaat bagi kepentingan nasional. Pilihan D paling tepat karena menggabungkan keterbukaan terhadap investasi dengan perlindungan kepentingan masyarakat, penguatan ekonomi lokal, peningkatan kualitas sumber daya manusia, dan pelestarian identitas budaya.\nPilihan A dan C terlalu mengutamakan kepentingan investor. Pilihan B dan E menunjukkan sikap tertutup yang berpotensi menghambat pembangunan. Nasionalisme yang matang diwujudkan melalui kemampuan menempatkan kepentingan bangsa sebagai dasar dalam mengambil keputusan strategis."},{"bagian":"TWK","no":2,"soal":"Dalam sebuah forum perencanaan pembangunan nasional, seorang pejabat mengusulkan agar seluruh daerah menggunakan satu model pembangunan ekonomi yang sama karena dianggap paling efisien dan mudah dievaluasi. Ia berpendapat bahwa perbedaan kondisi sosial, budaya, serta karakteristik ekonomi daerah justru memperlambat pencapaian target nasional. Beberapa daerah kepulauan menolak usulan tersebut karena kebutuhan transportasi dan pelayanan dasarnya berbeda dengan daerah perkotaan di Pulau Jawa. Anda sebagai anggota tim perumus kebijakan diminta memberikan rekomendasi yang mencerminkan nasionalisme sekaligus menjaga persatuan bangsa. Rekomendasi yang paling tepat adalah ....","opsi":{"A":"Menetapkan model pembangunan seragam untuk seluruh daerah agar pemerintah pusat dapat mengendalikan pelaksanaan program secara konsisten, sedangkan kebutuhan khusus daerah diselesaikan melalui bantuan tambahan setelah indikator nasional tercapai.","B":"Menyusun arah dan standar pelayanan nasional yang sama, tetapi memberikan ruang penyesuaian program berdasarkan kondisi geografis, sosial, budaya, dan potensi ekonomi daerah dengan tetap menjaga akuntabilitas terhadap tujuan pembangunan nasional.","C":"Memberikan kewenangan sepenuhnya kepada masing-masing daerah untuk menentukan model pembangunan tanpa standar nasional yang mengikat, sebab pemerintah daerah paling memahami kebutuhan masyarakat dan harus bebas menentukan prioritasnya sendiri.","D":"Memprioritaskan daerah yang memiliki kontribusi ekonomi terbesar terhadap pendapatan nasional agar hasil pembangunan lebih cepat terlihat, kemudian menggunakan peningkatan penerimaan negara untuk membiayai daerah yang tertinggal pada tahap berikutnya.","E":"Menyamakan seluruh alokasi anggaran dan bentuk program antardaerah tanpa mempertimbangkan perbedaan kebutuhan, karena perlakuan yang sama merupakan bentuk keadilan yang paling mudah diterapkan dan dapat mencegah munculnya kecemburuan sosial."},"kunci":"B","poin":null,"pembahasan":"Nasionalisme menuntut persatuan dalam tujuan, bukan penyeragaman seluruh kebijakan. Pilihan B mempertahankan standar dan arah pembangunan nasional sekaligus mengakomodasi keragaman kondisi daerah. Pendekatan ini sejalan dengan semangat persatuan Indonesia dan pembangunan yang berkeadilan.\nPilihan A dan E menyamakan perlakuan tanpa memperhitungkan kebutuhan. Pilihan C berisiko mengabaikan koordinasi nasional, sedangkan D dapat memperlebar kesenjangan antardaerah. Kebijakan yang baik harus memadukan kepentingan nasional dengan kebutuhan nyata masyarakat di berbagai wilayah."},{"bagian":"TWK","no":3,"soal":"Sebuah kementerian meluncurkan program penggunaan produk dalam negeri untuk memperkuat industri nasional. Dalam pelaksanaannya, sebuah instansi harus memilih peralatan teknologi informasi untuk mendukung pelayanan publik. Produk impor memiliki fitur lebih lengkap dan biaya awal lebih rendah, sedangkan produk dalam negeri telah memenuhi kebutuhan utama tetapi memerlukan peningkatan kapasitas tertentu. Penyedia produk lokal juga bersedia memberikan pelatihan kepada teknisi Indonesia. Sebagian anggota tim berpendapat bahwa memilih produk impor merupakan keputusan paling rasional karena efisiensi anggaran harus menjadi prioritas mutlak. Anggota lain menganggap produk lokal harus dipilih tanpa mempertimbangkan kualitas dan biaya. Sebagai ketua tim pengadaan, keputusan yang paling mencerminkan nasionalisme yang rasional adalah ....","opsi":{"A":"Membandingkan kebutuhan riil, kualitas, biaya sepanjang masa penggunaan, keamanan, dan dukungan teknis, kemudian mengutamakan produk dalam negeri yang memenuhi persyaratan serta menggunakan pengadaan sebagai sarana memperkuat kemampuan industri nasional.","B":"Memilih produk impor karena kelengkapan fitur dan biaya awal yang lebih rendah memberikan manfaat langsung bagi instansi, sedangkan pengembangan industri nasional sebaiknya sepenuhnya diserahkan kepada kementerian yang membidangi sektor perdagangan dan perindustrian.","C":"Menetapkan produk dalam negeri sebagai satu-satunya pilihan tanpa evaluasi tambahan, sebab keberpihakan terhadap industri nasional harus mengesampingkan pertimbangan teknis, risiko operasional, dan perbedaan kemampuan produk yang tersedia di pasar.","D":"Menunda pengadaan hingga produsen nasional mampu menyediakan perangkat dengan semua fitur produk impor, sehingga instansi tidak perlu mempertimbangkan pilihan yang belum sepenuhnya mendukung kemandirian teknologi dalam negeri.","E":"Membagi anggaran secara sama antara produk impor dan produk lokal tanpa mempertimbangkan kebutuhan masing-masing unit kerja, sehingga kebijakan tersebut dapat dianggap adil bagi seluruh penyedia dan menunjukkan keberpihakan kepada perekonomian nasional."},"kunci":"A","poin":null,"pembahasan":"Nasionalisme ekonomi diwujudkan dengan memperkuat kemampuan produksi dalam negeri tanpa mengabaikan mutu, efisiensi, keamanan, dan kebutuhan pelayanan publik. Pilihan A menggunakan pendekatan evaluasi objektif dan mengutamakan produk lokal yang memenuhi persyaratan.\nPilihan B terlalu berorientasi pada manfaat jangka pendek. Pilihan C mengabaikan profesionalitas pengadaan, sedangkan D dapat menghambat pelayanan. Pilihan E tidak didasarkan pada kebutuhan nyata. Keberpihakan nasional harus diwujudkan melalui keputusan yang bertanggung jawab dan dapat dipertanggungjawabkan."},{"bagian":"TWK","no":4,"soal":"Di sebuah kabupaten yang dihuni masyarakat dengan latar belakang budaya beragam, muncul perdebatan mengenai penyelenggaraan festival kebudayaan tahunan. Kelompok mayoritas mengusulkan agar festival hanya menampilkan tradisi mereka karena dianggap paling dikenal masyarakat luas dan paling berpotensi menarik wisatawan. Kelompok minoritas khawatir tradisi mereka akan semakin tidak dikenal apabila terus ditempatkan sebagai kegiatan tambahan. Sementara itu, pemerintah daerah memiliki keterbatasan anggaran dan harus memastikan festival tetap menarik serta tidak menimbulkan konflik sosial. Anda diminta menyusun kebijakan yang menunjukkan kecintaan terhadap bangsa tanpa menghapus identitas kelompok masyarakat. Kebijakan terbaik adalah ....","opsi":{"A":"Memberikan porsi utama kepada budaya mayoritas karena popularitas dan daya tarik wisata merupakan pertimbangan praktis yang penting, sementara budaya minoritas dapat diperkenalkan melalui kegiatan pendidikan terpisah yang tidak memengaruhi konsep utama festival.","B":"Membagi waktu pertunjukan secara sama persis kepada seluruh kelompok budaya tanpa mempertimbangkan karakteristik acara, kesiapan peserta, dan kebutuhan teknis, karena kesamaan durasi merupakan cara paling sederhana untuk membuktikan bahwa seluruh budaya memperoleh perlakuan setara.","C":"Mengganti seluruh pertunjukan budaya daerah dengan pertunjukan bertema nasional yang seragam agar tidak ada kelompok yang merasa lebih diutamakan, kemudian menampilkan keragaman budaya melalui dokumentasi tertulis yang dapat dibaca pengunjung.","D":"Menyerahkan penentuan isi festival kepada kelompok yang memiliki jumlah anggota terbesar, tetapi mewajibkan kelompok tersebut menyisipkan simbol budaya minoritas agar acara tetap menunjukkan bahwa kabupaten tersebut dihuni masyarakat yang beragam.","E":"Menyusun festival melalui musyawarah lintas kelompok, menetapkan kriteria partisipasi yang transparan, menampilkan keragaman tradisi secara bermakna, dan mengatur penggunaan anggaran berdasarkan kebutuhan serta manfaat kegiatan bagi seluruh masyarakat."},"kunci":"E","poin":null,"pembahasan":"Nasionalisme Indonesia berlandaskan persatuan dalam keberagaman. Pilihan E memberikan ruang partisipasi yang adil melalui musyawarah, transparansi, dan penghargaan terhadap seluruh identitas budaya.\nPilihan A dan D menempatkan kelompok mayoritas sebagai penentu utama. Pilihan B menyamakan durasi tanpa mempertimbangkan kebutuhan, sedangkan C justru menghilangkan ekspresi budaya daerah. Persatuan tidak mengharuskan masyarakat meninggalkan identitasnya, melainkan membangun kebersamaan dengan saling menghormati."},{"bagian":"TWK","no":5,"soal":"Dalam pelaksanaan program ketahanan pangan, pemerintah menemukan bahwa beberapa wilayah masih bergantung pada pasokan bahan pangan dari daerah lain. Sebuah perusahaan menawarkan teknologi pertanian modern yang dapat meningkatkan produktivitas, tetapi penerapannya memerlukan penyesuaian terhadap kondisi lahan, pengetahuan petani, dan ketersediaan air. Sebagian pejabat menganggap ketahanan pangan dapat dicapai dengan membeli pasokan dari luar negeri setiap kali produksi domestik menurun. Pihak lain mengusulkan penghentian seluruh impor pangan secepatnya meskipun sejumlah daerah belum mampu memenuhi kebutuhannya. Sebagai analis kebijakan, pendekatan yang paling tepat untuk memperkuat kepentingan nasional adalah ....","opsi":{"A":"Menghentikan impor pangan secara menyeluruh dan segera mengalihkan seluruh pembiayaan ke produksi domestik, meskipun perubahan tersebut berisiko mengganggu ketersediaan pangan sebelum kapasitas produksi nasional terbentuk.","B":"Mengandalkan impor sebagai mekanisme utama untuk menstabilkan pasokan dan harga, sementara peningkatan produktivitas petani domestik dilakukan apabila kondisi fiskal memungkinkan dan tidak mengganggu kelancaran perdagangan internasional.","C":"Memperkuat produksi dan distribusi domestik sesuai potensi wilayah, meningkatkan kompetensi petani, mengembangkan teknologi yang sesuai, serta menggunakan perdagangan internasional secara terukur untuk menjaga ketersediaan pangan ketika diperlukan.","D":"Memusatkan produksi pada wilayah yang memiliki lahan paling produktif dan menghentikan dukungan bagi wilayah yang hasil pertaniannya rendah, sehingga sumber daya nasional dapat digunakan secara lebih efisien untuk menghasilkan komoditas dalam jumlah besar.","E":"Memberikan bantuan keuangan dengan jumlah sama kepada seluruh petani tanpa memetakan kebutuhan dan kondisi lahan, kemudian membiarkan mekanisme pasar menentukan jenis komoditas yang diproduksi serta jalur distribusi yang paling menguntungkan."},"kunci":"C","poin":null,"pembahasan":"Ketahanan pangan merupakan bagian dari kepentingan nasional. Pilihan C menggabungkan penguatan produksi domestik, peningkatan kapasitas petani, pemanfaatan teknologi, dan perdagangan yang terukur. Pendekatan ini memperkuat kemandirian tanpa mengambil risiko kekurangan pasokan akibat kebijakan yang terlalu mendadak.\nPilihan A terlalu ekstrem karena mengabaikan kebutuhan jangka pendek. Pilihan B menciptakan ketergantungan, D mengabaikan pemerataan, dan E tidak mempertimbangkan kebutuhan spesifik wilayah."},{"bagian":"TWK","no":6,"soal":"Menjelang pemilihan kepala daerah, sebuah organisasi masyarakat menyebarkan narasi bahwa pembangunan hanya akan berhasil apabila jabatan strategis diberikan kepada orang-orang yang berasal dari kelompok etnis mayoritas di wilayah tersebut. Narasi itu memperoleh dukungan karena dianggap dapat memperkuat identitas daerah. Namun, beberapa tokoh masyarakat mengingatkan bahwa kebijakan tersebut berpotensi mengurangi kesempatan warga lain yang memiliki kompetensi dan integritas. Anda sebagai aparatur yang diminta menyampaikan edukasi kebangsaan harus merumuskan tanggapan yang tegas, tetapi tidak memperuncing perbedaan sosial. Sikap paling tepat adalah ....","opsi":{"A":"Menjelaskan bahwa kecintaan terhadap daerah dapat menjadi bagian dari kontribusi kepada bangsa, tetapi pengisian jabatan harus berdasarkan kompetensi, integritas, dan ketentuan yang berlaku tanpa diskriminasi identitas kelompok.","B":"Mendukung gagasan organisasi tersebut selama memperoleh dukungan mayoritas warga, sebab keputusan yang didukung oleh jumlah penduduk terbesar dapat dianggap sebagai representasi kepentingan bersama dalam pemerintahan daerah.","C":"Menghindari pembahasan mengenai isu etnisitas agar hubungan antarkelompok tetap tenang, kemudian menyerahkan penyelesaian masalah kepada pemimpin daerah tanpa memberikan penjelasan tentang prinsip kebangsaan.","D":"Mengusulkan pembagian jabatan secara proporsional berdasarkan jumlah penduduk masing-masing kelompok, sehingga seluruh kelompok memiliki keterwakilan yang seimbang tanpa perlu menilai perbedaan kompetensi setiap calon secara mendalam.","E":"Meminta seluruh kelompok menghentikan penggunaan identitas budaya dalam kehidupan publik, sebab perbedaan etnis berpotensi menimbulkan perselisihan dan dapat menghambat pembentukan identitas nasional yang sama."},"kunci":"A","poin":null,"pembahasan":"Nasionalisme menempatkan kepentingan bangsa dan prinsip kesetaraan warga negara di atas kepentingan kelompok. Pengisian jabatan publik harus dilakukan secara profesional dan tidak diskriminatif.\nPilihan B menyamakan kehendak mayoritas dengan keadilan, padahal hak warga negara tetap harus dilindungi. Pilihan C menghindari persoalan, D mengabaikan kompetensi, dan E meniadakan keberagaman. Nasionalisme yang sehat menyatukan masyarakat tanpa menghapus identitas budaya ataupun membenarkan diskriminasi."},{"bagian":"TWK","no":7,"soal":"Anda bertugas sebagai anggota tim verifikasi bantuan pemerintah. Pada akhir periode penyaluran, seorang rekan meminta Anda menyetujui laporan pertanggungjawaban yang mencantumkan seluruh bantuan telah diterima masyarakat. Ketika memeriksa dokumen pendukung, Anda menemukan beberapa penerima belum menerima bantuan karena kendala distribusi. Rekan tersebut menjelaskan bahwa bantuan pasti akan disalurkan beberapa hari kemudian dan laporan perlu segera diselesaikan agar instansi tidak terlambat menyampaikan administrasi. Ia juga mengingatkan bahwa keterlambatan laporan dapat memengaruhi penilaian kinerja seluruh tim. Tindakan yang paling mencerminkan integritas adalah ....","opsi":{"A":"Menyetujui laporan sementara berdasarkan penjelasan rekan karena kekurangan tersebut hanya bersifat administratif dan diperkirakan segera selesai, kemudian meminta bukti penyaluran dilengkapi setelah dokumen utama disampaikan kepada pimpinan.","B":"Menolak seluruh laporan pertanggungjawaban tanpa memeriksa bagian lain yang sudah benar, lalu meminta pimpinan mengganti seluruh anggota tim karena keberadaan satu ketidaksesuaian menunjukkan bahwa proses verifikasi tidak dapat dipercaya.","C":"Menyampaikan keberatan secara informal kepada rekan dan membiarkan rekan menentukan apakah laporan akan diperbaiki, sebab tanggung jawab utama atas distribusi bantuan berada pada petugas lapangan, bukan anggota tim verifikasi.","D":"Memastikan data dibandingkan dengan bukti penyaluran, meminta koreksi atas bagian yang belum sesuai, mendokumentasikan ketidaksesuaian, dan melaporkan kondisi sebenarnya melalui prosedur resmi tanpa mengubah fakta demi memenuhi target administrasi.","E":"Menyetujui laporan dengan menambahkan catatan internal mengenai penerima yang belum memperoleh bantuan, tetapi tidak mengubah pernyataan utama bahwa penyaluran telah selesai agar proses administrasi tidak terhambat."},"kunci":"D","poin":null,"pembahasan":"Integritas menuntut kesesuaian antara fakta, pernyataan, dan tindakan. Pilihan D menjaga keakuratan laporan, meminta perbaikan, dan menggunakan prosedur resmi. Kepentingan administrasi tidak membenarkan pencantuman informasi yang tidak benar.\nPilihan A dan E tetap mengesahkan laporan yang tidak sesuai fakta. Pilihan B terlalu berlebihan, sedangkan C menghindari tanggung jawab verifikasi. Integritas harus disertai ketelitian, keberanian moral, dan penyelesaian masalah secara profesional."},{"bagian":"TWK","no":8,"soal":"Dalam proses evaluasi penawaran pengadaan barang, Anda menemukan bahwa salah satu peserta memiliki hubungan keluarga dengan pejabat yang berwenang menentukan pemenang. Dokumen penawaran peserta tersebut secara administratif tampak lengkap, sedangkan peserta lainnya juga memenuhi persyaratan. Pejabat terkait menyatakan bahwa hubungan keluarga tidak perlu dibicarakan karena tidak terdapat bukti langsung bahwa proses evaluasi telah dimanipulasi. Anda diminta memberikan masukan kepada tim agar proses tetap adil dan dapat dipercaya. Tindakan yang paling tepat adalah ....","opsi":{"A":"Langsung menggugurkan peserta yang memiliki hubungan keluarga dengan pejabat tersebut, sebab setiap hubungan pribadi dalam pengadaan otomatis membuktikan adanya kecurangan dan tidak perlu diperiksa lebih lanjut.","B":"Mengabaikan hubungan tersebut selama dokumen penawaran memenuhi syarat, sebab penilaian pengadaan harus sepenuhnya berfokus pada dokumen teknis dan harga tanpa mempertimbangkan kemungkinan konflik kepentingan.","C":"Meminta pejabat yang memiliki hubungan keluarga tetap memimpin evaluasi, tetapi mewajibkan seluruh anggota tim menandatangani pernyataan bahwa tidak ada intervensi sehingga keputusan dapat dipertanggungjawabkan apabila muncul keberatan dari peserta lain.","D":"Mengumumkan hubungan keluarga tersebut kepada seluruh peserta dan meminta mereka menentukan bersama apakah peserta terkait boleh mengikuti proses, sehingga penyelesaian konflik kepentingan dilakukan melalui kesepakatan pihak-pihak yang berkepentingan.","E":"Mengungkapkan potensi konflik kepentingan melalui mekanisme yang berlaku, meminta penilaian independen atau pengunduran diri pejabat terkait dari bagian proses yang relevan, serta memastikan seluruh peserta dinilai berdasarkan kriteria objektif dan terdokumentasi."},"kunci":"E","poin":null,"pembahasan":"Integritas dalam pengadaan tidak hanya berkaitan dengan tidak adanya kecurangan yang terbukti, tetapi juga dengan pencegahan konflik kepentingan dan perlindungan objektivitas proses. Pilihan E menggunakan mekanisme formal untuk mengelola risiko tersebut.\nPilihan A menghukum tanpa pemeriksaan. Pilihan B mengabaikan potensi konflik, C hanya mengandalkan pernyataan, dan D menyerahkan kewenangan resmi kepada peserta. Proses yang berintegritas harus adil, transparan, dan dapat diaudit."},{"bagian":"TWK","no":9,"soal":"Seorang pegawai menerima tugas menyusun laporan capaian program yang akan menjadi dasar penentuan alokasi anggaran tahun berikutnya. Hasil evaluasi menunjukkan bahwa sebagian target tidak tercapai karena perubahan kondisi lapangan dan keterlambatan koordinasi dengan pihak lain. Atasan meminta laporan difokuskan pada indikator yang berhasil agar instansi tetap memperoleh kepercayaan pimpinan pusat. Ia tidak meminta Anda memalsukan angka secara langsung, tetapi menyarankan agar kegagalan yang terjadi tidak dibahas terlalu terperinci. Anda menyadari bahwa laporan yang terlalu selektif dapat membuat program serupa dirancang berdasarkan gambaran yang tidak lengkap. Sikap terbaik adalah ....","opsi":{"A":"Menyusun laporan yang menonjolkan seluruh keberhasilan dan menempatkan kendala dalam lampiran yang tidak dibahas, sebab tugas pegawai adalah menjaga citra organisasi selama angka yang dicantumkan tetap benar.","B":"Menyajikan capaian dan kekurangan secara proporsional, menjelaskan penyebab berdasarkan bukti, membedakan faktor yang dapat dikendalikan dan yang berada di luar kendali, serta menawarkan langkah perbaikan yang terukur untuk periode berikutnya.","C":"Menolak menyelesaikan laporan sampai atasan secara tertulis menarik seluruh arahannya, sebab setiap permintaan untuk menonjolkan keberhasilan menunjukkan bahwa atasan bermaksud menghilangkan informasi penting dari dokumen resmi.","D":"Menyampaikan seluruh kekurangan program kepada pihak luar sebelum laporan diserahkan kepada pimpinan, agar publik mengetahui kondisi sebenarnya dan mencegah kemungkinan organisasi menutupi informasi yang tidak menguntungkan.","E":"Mengubah target evaluasi setelah program selesai agar capaian yang ada terlihat sesuai dengan indikator baru, dengan alasan bahwa perubahan situasi lapangan membuat ukuran keberhasilan awal tidak lagi relevan untuk menilai kinerja instansi."},"kunci":"B","poin":null,"pembahasan":"Integritas pelaporan membutuhkan informasi yang jujur, lengkap, relevan, dan berimbang. Pilihan B tidak menyembunyikan kegagalan, tetapi menjelaskannya berdasarkan bukti serta mengarahkan evaluasi pada perbaikan.\nPilihan A menghasilkan gambaran yang tidak utuh. Pilihan C tidak proporsional, D mengabaikan jalur pelaporan yang semestinya, dan E mengubah indikator setelah hasil diketahui. Integritas bukan sekadar menghindari kebohongan langsung, tetapi juga mencegah penyajian informasi yang menyesatkan."},{"bagian":"TWK","no":10,"soal":"Dalam sebuah program pelayanan masyarakat, Anda mengetahui bahwa seorang petugas secara rutin mendahulukan permohonan milik kenalannya. Petugas tersebut beralasan bahwa jumlah permohonan sangat banyak dan ia hanya membantu orang yang membutuhkan layanan cepat. Ia tidak menerima uang ataupun hadiah, tetapi tindakannya menyebabkan beberapa pemohon lain menunggu lebih lama meskipun telah melengkapi persyaratan terlebih dahulu. Anda ingin memperbaiki keadaan tanpa menimbulkan konflik pribadi yang tidak diperlukan. Tindakan paling tepat adalah ....","opsi":{"A":"Membiarkan praktik tersebut selama tidak ada keuntungan finansial yang diterima petugas, karena pelanggaran integritas baru dapat dinilai serius apabila disertai korupsi atau kerugian uang negara.","B":"Menegur petugas di hadapan seluruh pemohon agar menjadi pelajaran bagi pegawai lain, kemudian meminta masyarakat mengawasi perilakunya tanpa perlu mengubah prosedur antrean yang selama ini digunakan.","C":"Mengingatkan petugas secara profesional mengenai prinsip pelayanan yang adil, memeriksa penerapan urutan layanan, memperkuat pencatatan antrean yang transparan, dan melaporkan pelanggaran berulang melalui saluran yang sesuai.","D":"Meminta seluruh pemohon yang memiliki hubungan dengan petugas mengajukan permohonan ulang, sehingga urutan pelayanan dapat dimulai kembali dan semua pihak memperoleh kesempatan yang sama tanpa pemeriksaan lebih lanjut.","E":"Mengusulkan agar petugas tersebut dipindahkan dari unit pelayanan secepatnya, meskipun belum ada pemeriksaan terhadap pola pelayanan dan belum diberikan kesempatan untuk memperbaiki perilakunya sesuai ketentuan yang berlaku."},"kunci":"C","poin":null,"pembahasan":"Integritas mencakup keadilan, profesionalitas, dan konsistensi penerapan aturan, bukan hanya tidak menerima suap. Pilihan C memperbaiki perilaku sekaligus membangun sistem antrean yang transparan sehingga masalah tidak sekadar ditangani secara personal.\nPilihan A mengabaikan favoritisme. Pilihan B mempermalukan tanpa membenahi sistem, sedangkan D dan E mengambil tindakan yang tidak proporsional. Penyelesaian yang berintegritas harus berdasarkan fakta, prosedur, dan upaya pencegahan pengulangan."},{"bagian":"TWK","no":11,"soal":"Anda menjadi anggota tim yang bertanggung jawab atas verifikasi hasil pelatihan aparatur. Salah satu peserta merupakan pegawai senior yang memiliki kontribusi besar terhadap instansi, tetapi hasil penilaiannya belum memenuhi standar kelulusan. Pimpinan meminta agar peserta tersebut dinyatakan lulus dengan alasan pengalaman kerjanya sudah cukup membuktikan kompetensi. Pimpinan juga menyampaikan bahwa keputusan itu tidak akan menimbulkan kerugian langsung karena peserta tersebut akan tetap bekerja pada posisi yang sama. Anda memahami bahwa sertifikat pelatihan menjadi bukti formal kompetensi yang dapat digunakan untuk penugasan di masa mendatang. Keputusan yang paling tepat adalah ....","opsi":{"A":"Menetapkan kelulusan berdasarkan pengalaman kerja peserta dan kontribusinya kepada organisasi, sebab penilaian formal dapat disesuaikan untuk menghargai pegawai yang telah memberikan pengabdian panjang kepada instansi.","B":"Menolak memberikan sertifikat dan langsung mengumumkan kasus tersebut kepada seluruh peserta, karena permintaan pimpinan sudah cukup untuk menyimpulkan bahwa seluruh proses penilaian tidak lagi memiliki kredibilitas.","C":"Menunda penerbitan sertifikat tanpa memberikan penjelasan kepada peserta, lalu membiarkan pimpinan memutuskan sendiri apakah hasil evaluasi akan diubah atau tetap digunakan sebagaimana mestinya.","D":"Mempertahankan hasil penilaian sesuai standar yang berlaku, menyampaikan dasar keputusan secara profesional, dan memberikan kesempatan remediasi atau penilaian ulang apabila mekanisme tersebut tersedia dan diterapkan secara setara.","E":"Memberikan sertifikat dengan status kelulusan bersyarat tanpa dasar aturan yang jelas, kemudian meminta peserta mengikuti pelatihan tambahan secara informal agar kesenjangan kompetensinya dapat diperbaiki setelah memperoleh pengakuan resmi."},"kunci":"D","poin":null,"pembahasan":"Integritas menuntut konsistensi antara standar penilaian dan keputusan yang diambil. Pilihan D menghargai kontribusi peserta tanpa mengorbankan objektivitas. Kesempatan remediasi dapat diberikan apabila sesuai ketentuan dan tersedia secara adil bagi peserta lain.\nPilihan A mengubah standar berdasarkan kedudukan. Pilihan B tidak menjaga kerahasiaan dan proporsionalitas, C menghindari tanggung jawab, sedangkan E menerbitkan pengakuan tanpa dasar yang memadai."},{"bagian":"TWK","no":12,"soal":"Dalam pelaksanaan suatu program, Anda melakukan kesalahan memasukkan data yang menyebabkan laporan awal menunjukkan hasil lebih tinggi daripada capaian sebenarnya. Kesalahan tersebut baru diketahui setelah laporan dikirim kepada pimpinan, tetapi belum digunakan sebagai dasar keputusan anggaran. Rekan Anda menyarankan agar data diperbaiki secara diam-diam pada laporan berikutnya karena kesalahan itu tidak disengaja dan pengungkapan kepada pimpinan dikhawatirkan memengaruhi penilaian kinerja Anda. Anda menyadari bahwa data yang keliru dapat tersebar apabila tidak segera diluruskan. Tindakan paling mencerminkan integritas adalah ....","opsi":{"A":"Segera mengakui kesalahan kepada pihak terkait, menyampaikan data yang telah diverifikasi, menjelaskan dampak dan langkah koreksi, serta memperbaiki prosedur pemeriksaan agar kesalahan serupa tidak terulang.","B":"Memperbaiki angka pada laporan berikutnya tanpa menyampaikan perubahan tersebut, sebab tujuan utama pelaporan adalah menyediakan data yang benar dan kesalahan yang tidak disengaja tidak perlu dibahas apabila telah diperbaiki.","C":"Menunggu sampai pimpinan menemukan perbedaan angka secara mandiri, kemudian menjelaskan bahwa kesalahan berasal dari proses pengolahan data yang melibatkan beberapa pegawai sehingga tanggung jawab tidak hanya berada pada diri sendiri.","D":"Meminta rekan kerja mengambil alih tanggung jawab atas kesalahan tersebut karena laporan telah diperiksa bersama, lalu menyusun catatan internal yang menunjukkan bahwa kekeliruan terjadi akibat kurangnya koordinasi antarpelaksana.","E":"Membatalkan seluruh laporan program dan menghentikan kegiatan sampai semua data diperiksa ulang oleh pihak eksternal, meskipun kesalahan hanya terdapat pada satu bagian yang dapat diidentifikasi dan diperbaiki dengan segera."},"kunci":"A","poin":null,"pembahasan":"Integritas tidak berarti seseorang tidak pernah melakukan kesalahan, tetapi berani mengakui, memperbaiki, dan mencegah kesalahan tersebut berulang. Pilihan A menunjukkan tanggung jawab, kejujuran, dan orientasi pada perbaikan sistem.\nPilihan B menyembunyikan koreksi, C menunda tanggung jawab, D mengalihkan kesalahan, dan E tidak proporsional terhadap masalah. Keterbukaan yang tepat waktu memungkinkan pimpinan menggunakan informasi yang akurat dalam mengambil keputusan."},{"bagian":"TWK","no":13,"soal":"Sebuah instansi pemerintah mengalami gangguan layanan digital setelah menerima banyak pesan yang mengarahkan pegawai untuk membuka tautan tertentu dengan alasan memperbarui akun kedinasan. Beberapa pegawai telah memasukkan informasi akses mereka, sementara layanan publik mulai mengalami keterlambatan. Belum ada bukti pasti mengenai pihak yang bertanggung jawab, dan beredar dugaan bahwa gangguan tersebut berkaitan dengan upaya mencuri data pemerintah. Sebagian pegawai mengusulkan agar informasi ini disebarkan melalui media sosial pribadi supaya masyarakat segera waspada. Anda sebagai aparatur yang mengetahui kejadian tersebut harus mengambil tindakan yang mendukung keamanan negara dan keberlangsungan pelayanan publik. Tindakan paling tepat adalah ....","opsi":{"A":"Menyebarkan tangkapan layar seluruh pesan dan informasi teknis gangguan melalui media sosial pribadi, karena keterbukaan informasi merupakan bentuk partisipasi warga dalam melindungi negara dari ancaman digital yang semakin kompleks.","B":"Menghentikan seluruh pelayanan digital untuk waktu yang tidak ditentukan dan meminta masyarakat menggunakan layanan manual, tanpa melakukan pemeriksaan lebih lanjut sampai pihak yang bertanggung jawab berhasil ditemukan.","C":"Menunggu pengumuman resmi dari pimpinan sebelum melakukan tindakan apa pun, sebab pemeriksaan insiden digital merupakan kewenangan unit teknologi informasi dan pegawai lain tidak perlu mengambil langkah awal yang berpotensi menimbulkan kesalahan.","D":"Menghapus seluruh pesan mencurigakan dan mengganti kata sandi pribadi, kemudian kembali bekerja seperti biasa karena tindakan tersebut sudah cukup untuk melindungi akun tanpa perlu mengganggu operasional instansi.","E":"Melaporkan insiden melalui saluran keamanan informasi resmi, mengikuti prosedur pengamanan akun dan perangkat, menghindari penyebaran informasi sensitif, serta membantu menjaga layanan penting tetap berjalan sesuai arahan penanganan insiden."},"kunci":"E","poin":null,"pembahasan":"Bela negara pada era digital mencakup kewaspadaan siber, perlindungan informasi, dan menjaga keberlangsungan pelayanan publik. Pilihan E mengutamakan pelaporan resmi, pengamanan sistem, dan pengendalian penyebaran informasi sensitif.\nPilihan A dapat memperluas paparan informasi yang berisiko. Pilihan B terlalu luas, C pasif, dan D mengabaikan kemungkinan dampak terhadap sistem instansi. Bela negara tidak selalu berbentuk tindakan fisik, tetapi juga dapat dilakukan melalui tanggung jawab profesional di ruang digital."},{"bagian":"TWK","no":14,"soal":"Ketika terjadi bencana alam di beberapa wilayah, pemerintah membuka program bantuan logistik dan mengajak masyarakat berpartisipasi melalui jalur resmi. Di tempat Anda bekerja, sekelompok pegawai ingin mengadakan penggalangan bantuan sendiri karena menilai prosedur pemerintah terlalu lambat. Mereka mengusulkan pengiriman barang secara langsung tanpa berkoordinasi dengan petugas di lokasi. Anda mengetahui bahwa sejumlah jalan masih terputus, kebutuhan korban berbeda antarlokasi, dan penumpukan bantuan di satu titik dapat menghambat distribusi. Sikap yang paling mencerminkan bela negara sekaligus kepedulian kemanusiaan adalah ....","opsi":{"A":"Mendukung pengiriman bantuan secara langsung tanpa koordinasi karena kecepatan bertindak lebih penting daripada prosedur, terutama ketika masyarakat membutuhkan pertolongan dan aparatur harus menunjukkan keberpihakan kepada korban.","B":"Menghentikan seluruh kegiatan penggalangan bantuan sampai pemerintah menyelesaikan setiap tahapan administrasi, karena partisipasi masyarakat yang tidak terintegrasi dapat menimbulkan masalah sehingga lebih baik tidak dilakukan sama sekali.","C":"Mengarahkan penggalangan bantuan melalui koordinasi dengan pihak penanggulangan bencana, memetakan kebutuhan berdasarkan informasi terverifikasi, memastikan keamanan distribusi, dan melibatkan relawan sesuai kapasitas serta ketentuan yang berlaku.","D":"Mengumpulkan barang sebanyak mungkin berdasarkan perkiraan kebutuhan umum, lalu menyalurkannya ke lokasi yang paling mudah dijangkau tanpa melakukan pemeriksaan kebutuhan khusus, sebab jumlah bantuan yang besar dapat meningkatkan peluang korban menerima barang yang dibutuhkan.","E":"Menyerahkan seluruh penggalangan bantuan kepada organisasi besar yang telah dikenal publik dan menghentikan keterlibatan pegawai, karena penanganan bencana seharusnya menjadi tanggung jawab lembaga profesional dan bukan bagian dari tugas masyarakat biasa."},"kunci":"C","poin":null,"pembahasan":"Bela negara mencakup kepedulian terhadap keselamatan masyarakat, solidaritas, dan partisipasi yang bertanggung jawab. Pilihan C menggabungkan semangat menolong dengan koordinasi, verifikasi kebutuhan, dan keamanan distribusi.\nPilihan A berisiko menghambat penanganan bencana. Pilihan B terlalu pasif, D tidak berdasarkan kebutuhan aktual, dan E mengabaikan peran masyarakat. Bantuan yang efektif harus disesuaikan dengan kondisi lapangan dan dikoordinasikan agar tepat sasaran."},{"bagian":"TWK","no":15,"soal":"Dalam sebuah diskusi publik, beredar informasi yang belum terverifikasi mengenai kebijakan pertahanan negara. Informasi tersebut menyebutkan bahwa pemerintah sengaja mengabaikan keselamatan masyarakat di wilayah perbatasan. Sejumlah akun media sosial mengajak masyarakat menyebarkan informasi itu secara luas dengan alasan bahwa kritik keras diperlukan untuk membela negara. Di sisi lain, ada kelompok yang meminta seluruh kritik terhadap kebijakan pertahanan dianggap sebagai tindakan tidak patriotik. Anda sebagai peserta diskusi harus menjelaskan sikap bela negara yang demokratis dan bertanggung jawab. Pendekatan paling tepat adalah ....","opsi":{"A":"Mendukung penyebaran informasi tersebut selama tujuannya membela masyarakat perbatasan, karena dalam situasi yang dianggap mendesak, kecepatan menyampaikan kritik lebih penting daripada memastikan keakuratan seluruh informasi.","B":"Menolak seluruh kritik terhadap kebijakan pertahanan dan meminta masyarakat hanya mengikuti pernyataan resmi pemerintah, sebab perbedaan pendapat mengenai isu keamanan dapat melemahkan persatuan dan mengurangi kepercayaan terhadap negara.","C":"Meminta masyarakat menunda seluruh pembicaraan tentang kebijakan pertahanan sampai pemerintah memberikan penjelasan lengkap, sehingga tidak ada risiko penyebaran informasi yang salah ataupun perdebatan yang dapat menimbulkan perpecahan.","D":"Memeriksa kebenaran informasi melalui sumber yang dapat dipertanggungjawabkan, menyampaikan kritik berbasis bukti melalui saluran yang tepat, dan menghindari penyebaran data sensitif maupun tuduhan yang belum terbukti.","E":"Menyerahkan seluruh persoalan kepada aparat pertahanan dan keamanan tanpa melibatkan masyarakat, sebab urusan pertahanan merupakan kewenangan khusus negara yang tidak perlu mendapat pengawasan atau masukan dari warga."},"kunci":"D","poin":null,"pembahasan":"Bela negara tidak sama dengan menerima seluruh kebijakan tanpa kritik. Warga negara dapat menyampaikan kritik secara bertanggung jawab untuk memperbaiki kebijakan, sekaligus menjaga keamanan dan persatuan.\nPilihan D menyeimbangkan verifikasi informasi, partisipasi demokratis, dan perlindungan informasi sensitif. Pilihan A mengabaikan akurasi, B meniadakan kritik, C terlalu membatasi diskusi, dan E mengabaikan partisipasi masyarakat dalam kehidupan demokratis."},{"bagian":"TWK","no":16,"soal":"Pemerintah daerah mengembangkan program peningkatan kesiapsiagaan masyarakat terhadap bencana dan gangguan pelayanan dasar. Namun, sebagian warga menilai program tersebut tidak penting karena tidak berkaitan langsung dengan ancaman militer. Pada saat yang sama, daerah tersebut menghadapi risiko bencana, gangguan distribusi pangan, penyebaran informasi palsu, dan kerentanan infrastruktur komunikasi. Sebagai aparatur yang bertugas menyosialisasikan program, Anda harus menjelaskan bela negara secara luas tanpa mengaburkan peran pertahanan militer. Pendekatan yang paling tepat adalah ....","opsi":{"A":"Memusatkan seluruh sosialisasi pada latihan fisik dan kemampuan menghadapi ancaman militer, karena kegiatan kesiapsiagaan bencana, literasi informasi, dan pelayanan dasar merupakan urusan pembangunan yang tidak berkaitan dengan bela negara.","B":"Menjelaskan bahwa bela negara mencakup kesadaran berbangsa, kepatuhan terhadap hukum, kesiapsiagaan menghadapi ancaman nonmiliter, solidaritas sosial, dan kontribusi sesuai profesi, sementara pertahanan militer tetap memiliki fungsi khusus sesuai ketentuan.","C":"Menyatakan bahwa seluruh kegiatan pembangunan dapat langsung dikategorikan sebagai bela negara tanpa perlu menjelaskan tujuan dan tanggung jawabnya, karena setiap aktivitas yang bermanfaat bagi masyarakat otomatis memperkuat pertahanan nasional.","D":"Mengutamakan kegiatan penyuluhan yang menekankan ancaman dari kelompok luar, sehingga masyarakat lebih waspada terhadap pihak asing, sedangkan risiko bencana dan gangguan pelayanan dapat ditangani oleh lembaga teknis masing-masing.","E":"Mengalihkan program kesiapsiagaan menjadi kegiatan seremonial tahunan yang wajib diikuti seluruh warga, kemudian menilai keberhasilannya berdasarkan jumlah peserta tanpa perlu mengevaluasi kesiapan nyata masyarakat ketika menghadapi keadaan darurat."},"kunci":"B","poin":null,"pembahasan":"Bela negara mencakup kontribusi sesuai kemampuan dan profesi, termasuk kesiapsiagaan terhadap ancaman nonmiliter. Pilihan B menjelaskan cakupan bela negara secara proporsional sekaligus mempertahankan pembedaan antara peran masyarakat dan fungsi khusus pertahanan militer.\nPilihan A terlalu sempit. Pilihan C terlalu luas tanpa kriteria, D hanya berfokus pada ancaman eksternal, dan E mengutamakan formalitas dibanding kesiapan nyata."},{"bagian":"TWK","no":17,"soal":"Sebuah daerah perbatasan mengalami kekurangan tenaga pendidik, tenaga kesehatan, dan petugas administrasi pelayanan publik. Banyak tenaga profesional enggan ditempatkan di sana karena keterbatasan fasilitas dan akses transportasi. Pemerintah menawarkan insentif penugasan, tetapi sebagian pegawai berpendapat bahwa mereka cukup menunjukkan bela negara melalui kegiatan seremonial di daerah asal. Anda sebagai peserta forum kebijakan diminta memberikan rekomendasi agar kebutuhan masyarakat perbatasan terpenuhi tanpa mengabaikan keselamatan dan hak tenaga profesional. Rekomendasi paling tepat adalah ....","opsi":{"A":"Mewajibkan seluruh tenaga profesional bertugas di perbatasan dalam jangka panjang tanpa insentif tambahan, sebab pengabdian kepada negara seharusnya dilakukan tanpa mempertimbangkan kondisi kerja, fasilitas, dan kepentingan pribadi.","B":"Menyerahkan penyediaan tenaga profesional kepada mekanisme pasar, sehingga pemerintah tidak perlu memberikan insentif atau dukungan khusus karena kesediaan bertugas di wilayah terpencil sepenuhnya merupakan keputusan masing-masing individu.","C":"Memprioritaskan pegawai yang memiliki hubungan keluarga dengan wilayah perbatasan dan mengabaikan pelamar lain, karena kedekatan emosional dengan daerah dianggap sebagai jaminan bahwa mereka akan bertahan lebih lama dan memberikan pelayanan yang lebih baik.","D":"Mengganti tenaga profesional dengan relawan tanpa kualifikasi khusus sampai fasilitas memadai tersedia, karena kehadiran seseorang yang bersedia membantu masyarakat lebih penting daripada kesesuaian kompetensi terhadap kebutuhan pelayanan dasar.","E":"Mengembangkan penugasan berbasis kebutuhan dengan insentif yang layak, dukungan fasilitas, perlindungan keselamatan, pelatihan, dan mekanisme rotasi yang jelas agar tenaga profesional dapat berkontribusi secara berkelanjutan di wilayah perbatasan."},"kunci":"E","poin":null,"pembahasan":"Pengabdian kepada negara perlu didukung kebijakan yang realistis dan berkelanjutan. Pilihan E menempatkan kebutuhan masyarakat sebagai prioritas sekaligus memperhatikan keselamatan, kompetensi, dan kesejahteraan tenaga profesional.\nPilihan A mengartikan pengabdian sebagai pengorbanan tanpa batas. Pilihan B mengabaikan tanggung jawab pemerintah, C berpotensi diskriminatif, dan D mengabaikan standar kompetensi. Bela negara melalui profesi membutuhkan sistem pendukung yang memungkinkan pengabdian berlangsung secara efektif."},{"bagian":"TWK","no":18,"soal":"Di sebuah instansi, Anda menemukan bahwa sebagian pegawai menggunakan perangkat dan jaringan kantor untuk menyebarkan dokumen internal kepada pihak yang tidak memiliki kewenangan akses. Mereka beralasan bahwa informasi tersebut hanya berisi rencana kegiatan rutin dan tidak berkaitan dengan rahasia pertahanan negara. Namun, dokumen itu memuat data pribadi masyarakat, jadwal pelayanan, dan informasi operasional yang dapat disalahgunakan. Anda ingin menjaga keamanan informasi tanpa menimbulkan kepanikan yang tidak perlu. Tindakan yang paling tepat adalah ....","opsi":{"A":"Melaporkan kejadian melalui mekanisme keamanan informasi, memastikan akses dan penyebaran dokumen ditangani sesuai kewenangan, mengamankan bukti yang relevan, serta mengikuti prosedur perlindungan data dan pemberitahuan kepada pihak terdampak apabila diperlukan.","B":"Mengumumkan nama seluruh pegawai yang terlibat melalui grup komunikasi instansi, lalu meminta mereka menjelaskan tindakan masing-masing di hadapan seluruh staf agar kejadian tersebut menjadi peringatan bagi pegawai lain.","C":"Mengabaikan kejadian selama dokumen tidak berkaitan langsung dengan pertahanan militer, sebab kebocoran informasi administratif tidak dapat memengaruhi keamanan negara dan tidak termasuk tanggung jawab bela negara setiap aparatur.","D":"Menghapus seluruh dokumen dari jaringan bersama tanpa mencatat sumber, riwayat akses, atau pihak penerima, sehingga informasi tidak lagi tersedia bagi pihak yang tidak berwenang meskipun pemeriksaan lebih lanjut menjadi sulit dilakukan.","E":"Melarang seluruh pegawai menggunakan perangkat digital untuk bekerja sampai waktu yang tidak ditentukan, karena risiko kebocoran informasi menunjukkan bahwa sistem elektronik tidak dapat dipercaya untuk menyelenggarakan pelayanan publik secara aman."},"kunci":"A","poin":null,"pembahasan":"Perlindungan data dan informasi merupakan bagian dari tanggung jawab aparatur serta ketahanan nasional. Pilihan A menggabungkan pelaporan, pengamanan bukti, pembatasan akses sesuai kewenangan, dan perlindungan pihak terdampak.\nPilihan B berpotensi melanggar privasi dan prosedur pemeriksaan. Pilihan C meremehkan risiko, D menghilangkan bukti, dan E terlalu ekstrem. Respons yang tepat harus proporsional, terdokumentasi, dan mengikuti mekanisme keamanan yang berlaku."},{"bagian":"TWK","no":19,"soal":"Dalam rapat penyusunan kebijakan pelayanan publik, seorang pejabat mengusulkan agar aspirasi kelompok masyarakat yang jumlahnya sedikit tidak perlu dipertimbangkan apabila usulan kelompok mayoritas sudah disetujui melalui musyawarah. Ia berpendapat bahwa demokrasi berarti keputusan terbanyak harus selalu diterima tanpa pengecualian. Beberapa anggota rapat menyetujui pandangan tersebut karena dianggap mempercepat pengambilan keputusan. Namun, Anda mengetahui bahwa usulan kelompok minoritas menyangkut aksesibilitas layanan bagi warga yang memiliki kebutuhan khusus. Kebijakan yang paling sesuai dengan nilai Pancasila dan prinsip konstitusional adalah ....","opsi":{"A":"Mengikuti keputusan mayoritas secara penuh dan menunda usulan kelompok minoritas sampai kelompok tersebut dapat menunjukkan dukungan yang lebih luas, karena keputusan yang memperoleh suara terbanyak merupakan hasil demokrasi yang harus dipatuhi semua pihak.","B":"Memberikan hak veto kepada setiap kelompok minoritas terhadap seluruh kebijakan yang dibahas, sehingga tidak ada keputusan yang dapat dilaksanakan sebelum semua pihak menyetujui seluruh aspek program tanpa pengecualian.","C":"Menggunakan musyawarah untuk mencari solusi yang mengakomodasi kebutuhan kelompok terdampak, memastikan perlindungan hak warga, dan menetapkan keputusan melalui prosedur yang sah tanpa menjadikan jumlah suara sebagai satu-satunya ukuran keadilan.","D":"Menyerahkan keputusan sepenuhnya kepada pejabat yang paling memahami persoalan teknis, sebab pertimbangan profesional lebih penting daripada proses musyawarah apabila kebijakan menyangkut pelayanan publik dan keterbatasan anggaran.","E":"Memisahkan pelayanan bagi kelompok minoritas ke dalam program tersendiri yang tidak berkaitan dengan kebijakan umum, sehingga mayoritas dapat melaksanakan programnya tanpa perlu menyesuaikan prosedur yang sudah direncanakan."},"kunci":"C","poin":null,"pembahasan":"Sila keempat Pancasila menekankan kerakyatan yang dipimpin oleh hikmat kebijaksanaan dalam permusyawaratan/perwakilan. Demokrasi Pancasila tidak hanya menghitung suara, tetapi juga mempertimbangkan keadilan, hak warga negara, dan kepentingan bersama.\nPilihan C menghormati musyawarah sekaligus melindungi kelompok yang terdampak. Pilihan A mengabaikan hak minoritas, B memberikan veto tanpa batas, D menghilangkan partisipasi, dan E berpotensi menciptakan pelayanan yang terpisah dan tidak setara."},{"bagian":"TWK","no":20,"soal":"Sebuah pemerintah daerah menghadapi persoalan pencemaran lingkungan yang melibatkan beberapa perusahaan dan berdampak pada kesehatan masyarakat. Sebagian warga meminta pemerintah segera mencabut semua izin usaha yang diduga terlibat. Di sisi lain, perusahaan menyatakan bahwa keputusan tersebut harus menunggu pemeriksaan yang lengkap karena penghentian kegiatan dapat memengaruhi pekerja dan perekonomian lokal. Pemerintah wajib melindungi masyarakat, tetapi juga harus bertindak sesuai hukum dan kewenangannya. Keputusan yang paling mencerminkan negara hukum berdasarkan UUD 1945 adalah ....","opsi":{"A":"Segera mencabut seluruh izin perusahaan yang mendapat keluhan masyarakat, sebab kepentingan kesehatan harus selalu didahulukan dan keberatan perusahaan tidak perlu dipertimbangkan dalam keadaan yang menyangkut keselamatan publik.","B":"Membiarkan seluruh perusahaan tetap beroperasi sampai proses hukum selesai sepenuhnya, tanpa tindakan pencegahan sementara, karena setiap pembatasan sebelum adanya keputusan akhir dapat dianggap bertentangan dengan prinsip praduga tidak bersalah.","C":"Menyerahkan penyelesaian kepada perundingan antara warga dan perusahaan, lalu menerima hasil kesepakatan tersebut sebagai dasar keputusan pemerintah agar konflik tidak berkembang menjadi proses hukum yang memerlukan waktu dan biaya.","D":"Melakukan pemeriksaan berdasarkan bukti, menerapkan tindakan pencegahan atau pembatasan yang dibenarkan hukum sesuai tingkat risiko, memberikan kesempatan kepada pihak terkait untuk didengar, dan menindak pelanggaran melalui prosedur yang sah.","E":"Mengutamakan kepentingan ekonomi daerah dengan memberikan waktu perbaikan tanpa pemeriksaan independen, karena menjaga lapangan kerja dan penerimaan daerah merupakan pertimbangan yang lebih penting daripada mengambil keputusan cepat berdasarkan keluhan warga."},"kunci":"D","poin":null,"pembahasan":"Prinsip negara hukum menuntut tindakan pemerintah berdasarkan kewenangan, bukti, prosedur, dan perlindungan hak. Pilihan D tidak mengabaikan keselamatan masyarakat, tetapi juga tidak menjatuhkan sanksi secara sewenang-wenang.\nPilihan A mengabaikan proses yang sah. Pilihan B mengabaikan kemungkinan tindakan pencegahan yang diperbolehkan hukum, C menyerahkan kewenangan pemerintah kepada pihak lain, dan E mengutamakan kepentingan ekonomi tanpa memastikan perlindungan masyarakat."},{"bagian":"TWK","no":21,"soal":"Dalam suatu rapat evaluasi pembangunan, muncul usulan untuk memindahkan sebagian anggaran pelayanan dasar dari daerah terpencil ke kawasan perkotaan yang memiliki jumlah penduduk lebih besar. Pendukung usulan berpendapat bahwa pelayanan di perkotaan dapat menjangkau lebih banyak orang dengan biaya lebih rendah. Namun, daerah terpencil yang akan mengalami pengurangan anggaran belum memiliki akses memadai terhadap pendidikan, kesehatan, dan transportasi. Sebagai anggota tim perencanaan, Anda harus memberikan rekomendasi yang sesuai dengan Pancasila, terutama nilai kemanusiaan dan keadilan sosial. Rekomendasi paling tepat adalah ....","opsi":{"A":"Mengalokasikan anggaran berdasarkan jumlah penduduk semata, karena semakin banyak warga yang memperoleh manfaat dari suatu program, semakin besar pula tingkat keadilan yang berhasil diwujudkan pemerintah.","B":"Menetapkan prioritas berdasarkan kebutuhan, kesenjangan pelayanan, jumlah penduduk, biaya penyediaan, dan dampak sosial, kemudian memastikan bahwa efisiensi anggaran tidak menghilangkan akses dasar bagi masyarakat di daerah terpencil.","C":"Mempertahankan seluruh alokasi anggaran yang telah ditetapkan tanpa evaluasi, karena perubahan pembiayaan dapat menimbulkan ketidakpuasan daerah dan bertentangan dengan prinsip keadilan apabila dilakukan setelah program berjalan.","D":"Membagi anggaran dalam jumlah yang sama kepada setiap daerah tanpa mempertimbangkan kondisi geografis maupun jumlah penerima manfaat, sehingga seluruh wilayah mendapatkan perlakuan identik dalam proses pembangunan.","E":"Memusatkan investasi pada kawasan perkotaan sampai pertumbuhan ekonomi meningkat, kemudian menggunakan tambahan penerimaan daerah untuk membiayai pelayanan dasar di wilayah terpencil apabila target pertumbuhan telah tercapai."},"kunci":"B","poin":null,"pembahasan":"Sila kelima Pancasila menekankan keadilan sosial bagi seluruh rakyat Indonesia. Keadilan tidak selalu berarti pembagian anggaran yang sama, tetapi pembagian berdasarkan kebutuhan, kesenjangan, dan tujuan pelayanan.\nPilihan B menggabungkan efisiensi dengan pemerataan. Pilihan A mengabaikan ketertinggalan, C menolak evaluasi, D menyamakan kebutuhan yang berbeda, dan E menunda pemenuhan hak dasar masyarakat. Pembangunan harus memastikan bahwa efisiensi tidak memperlebar ketimpangan."},{"bagian":"TWK","no":22,"soal":"Dalam sebuah lembaga publik, pimpinan berencana menetapkan aturan internal yang membatasi kesempatan pegawai untuk menyampaikan pendapat mengenai kebijakan organisasi. Aturan itu dibuat dengan alasan menjaga disiplin dan mencegah perbedaan pendapat menghambat pelaksanaan tugas. Namun, rancangan aturan tidak menjelaskan batasan yang terukur, mekanisme keberatan, ataupun perbedaan antara kritik profesional dan tindakan yang melanggar kewajiban pegawai. Anda diminta menilai rancangan tersebut berdasarkan prinsip konstitusional. Penilaian paling tepat adalah ....","opsi":{"A":"Menyetujui rancangan tersebut karena pimpinan memiliki kewenangan mengatur organisasi, sehingga pembatasan pendapat pegawai sepenuhnya menjadi urusan internal yang tidak perlu mempertimbangkan prinsip hak konstitusional.","B":"Menolak seluruh aturan disiplin yang mengatur komunikasi pegawai, sebab kebebasan berpendapat harus dijalankan tanpa batas dalam setiap situasi, termasuk ketika seseorang menggunakan informasi kedinasan yang tidak boleh dibuka kepada publik.","C":"Mengusulkan agar seluruh perbedaan pendapat diselesaikan melalui pemungutan suara, lalu menjadikan hasil suara mayoritas sebagai dasar penjatuhan sanksi terhadap pegawai yang pandangannya tidak sesuai dengan keputusan pimpinan.","D":"Memberikan kewenangan kepada pimpinan untuk menentukan sendiri pendapat yang dianggap pantas, tanpa perlu menyediakan mekanisme keberatan, karena pengambilan keputusan yang cepat lebih penting daripada adanya prosedur untuk menguji keputusan tersebut.","E":"Meninjau rancangan agar kewenangan disiplin tetap sah dan proporsional, membedakan kritik profesional dari pelanggaran kewajiban, serta menyediakan batasan yang jelas dan mekanisme keberatan sesuai peraturan perundang-undangan."},"kunci":"E","poin":null,"pembahasan":"UUD 1945 menjamin hak konstitusional, termasuk kebebasan menyatakan pendapat, dengan pelaksanaan yang tunduk pada ketentuan hukum dan penghormatan terhadap hak orang lain. Dalam organisasi publik, disiplin dapat ditegakkan, tetapi pembatasannya harus memiliki dasar, tujuan yang sah, dan penerapan yang proporsional.\nPilihan E menjaga keseimbangan antara kewenangan organisasi, kebebasan yang bertanggung jawab, dan kepastian prosedur. Pilihan A dan D memberi kewenangan terlalu luas, B mengabaikan kewajiban hukum, sedangkan C menjadikan perbedaan pendapat sebagai persoalan popularitas."},{"bagian":"TWK","no":23,"soal":"Dalam sebuah kegiatan pelayanan masyarakat, pemerintah daerah mengusulkan penggunaan satu pola kegiatan keagamaan dan budaya untuk seluruh warga dengan alasan memudahkan koordinasi. Kelompok masyarakat yang memiliki tradisi berbeda menyatakan bahwa kegiatan tersebut tidak sesuai dengan kebutuhan mereka, tetapi tetap mendukung tujuan bersama untuk meningkatkan kepedulian sosial. Sebagian panitia menganggap perbedaan tersebut sebagai hambatan persatuan dan meminta seluruh kelompok mengikuti satu bentuk kegiatan. Anda sebagai anggota panitia perlu merancang kegiatan yang mencerminkan Bhinneka Tunggal Ika. Keputusan yang paling tepat adalah ....","opsi":{"A":"Menyelenggarakan kegiatan bersama dengan tujuan sosial yang disepakati, memberi ruang bagi ekspresi budaya yang beragam secara sukarela, dan memastikan tidak ada kelompok yang dipaksa menjalankan tradisi atau keyakinan yang tidak dianutnya.","B":"Mempertahankan satu bentuk kegiatan untuk seluruh warga karena keseragaman dapat memperkuat identitas bersama, sedangkan kelompok yang berbeda dapat menyesuaikan diri demi kepentingan persatuan dan kelancaran pelaksanaan program.","C":"Membagi kegiatan menjadi acara terpisah untuk setiap kelompok dan menghindari interaksi antarkelompok, sebab perbedaan tradisi berpotensi menimbulkan kesalahpahaman jika seluruh masyarakat dilibatkan dalam kegiatan yang sama.","D":"Menyerahkan penentuan bentuk kegiatan kepada kelompok dengan peserta terbanyak, kemudian meminta kelompok lainnya mengikuti keputusan tersebut sebagai bentuk penghormatan terhadap mekanisme demokrasi dan kesepakatan bersama.","E":"Menghapus seluruh unsur budaya dan tradisi dari kegiatan sosial, sehingga program hanya berisi kegiatan administratif yang netral dan tidak menimbulkan perbedaan penafsiran di antara kelompok masyarakat."},"kunci":"A","poin":null,"pembahasan":"Bhinneka Tunggal Ika mengajarkan persatuan tanpa menghapus keberagaman. Pilihan A mempertahankan tujuan bersama, membuka ruang partisipasi yang setara, dan menghormati kebebasan setiap kelompok.\nPilihan B dan D memaksakan kehendak kelompok tertentu. Pilihan C memisahkan masyarakat, sedangkan E menganggap keragaman harus dihilangkan demi netralitas. Persatuan dapat dibangun melalui kerja sama dan penghormatan terhadap perbedaan."},{"bagian":"TWK","no":24,"soal":"Sebuah kabupaten merencanakan program digitalisasi administrasi kependudukan. Program ini diharapkan meningkatkan efisiensi, tetapi sebagian warga lanjut usia, penyandang disabilitas, dan masyarakat di wilayah dengan akses internet terbatas berisiko mengalami kesulitan. Tim pelaksana mengusulkan agar layanan manual dihentikan segera setelah aplikasi diluncurkan karena mempertahankan dua jalur pelayanan dianggap meningkatkan biaya operasional. Anda diminta mengevaluasi kebijakan tersebut berdasarkan nilai Pancasila, prinsip NKRI, dan tanggung jawab negara terhadap warga. Rekomendasi terbaik adalah ....","opsi":{"A":"Menghentikan layanan manual sesuai jadwal peluncuran aplikasi, kemudian memberikan pelatihan digital hanya kepada warga yang mengajukan keluhan agar anggaran transisi tidak digunakan untuk kebutuhan yang belum tentu muncul.","B":"Menunda seluruh digitalisasi sampai setiap warga memiliki akses internet dan perangkat yang sama, karena penerapan teknologi sebelum kondisi masyarakat seragam berpotensi bertentangan dengan prinsip persamaan hak dalam pelayanan publik.","C":"Menjalankan digitalisasi secara bertahap dengan menyediakan bantuan akses, pendampingan, kanal alternatif yang diperlukan, dan evaluasi keterjangkauan layanan, sambil mempertahankan standar pelayanan yang setara bagi warga di berbagai wilayah.","D":"Mengutamakan pelayanan digital di kawasan perkotaan dan menunda penyediaannya di wilayah terpencil tanpa rencana transisi, karena perbedaan infrastruktur membuat penerapan standar pelayanan yang sama tidak mungkin dilaksanakan secara efektif.","E":"Memberikan bantuan perangkat hanya kepada warga yang paling aktif menggunakan aplikasi, kemudian mengalihkan anggaran pendampingan bagi kelompok rentan untuk meningkatkan kapasitas server agar target efisiensi dapat tercapai dalam waktu singkat."},"kunci":"C","poin":null,"pembahasan":"Nilai Pancasila dan prinsip persatuan dalam NKRI menuntut pelayanan publik yang memperhatikan kebutuhan seluruh warga. Pilihan C mengembangkan teknologi sekaligus menjaga aksesibilitas dan kesetaraan layanan.\nPilihan A berisiko mengecualikan warga yang kesulitan mengakses teknologi. Pilihan B menghambat inovasi tanpa batas waktu, D berpotensi memperlebar kesenjangan, dan E mengutamakan pengguna tertentu. Transformasi digital harus meningkatkan kualitas pelayanan, bukan menciptakan hambatan baru."},{"bagian":"TWK","no":25,"soal":"Sebuah instansi pemerintah menyelenggarakan konferensi pelayanan publik yang dihadiri oleh perwakilan kementerian, pemerintah daerah, akademisi, dan delegasi dari sejumlah negara. Panitia mengusulkan agar seluruh dokumen utama, paparan, dan diskusi menggunakan bahasa Inggris karena sebagian besar peserta internasional terbiasa menggunakan bahasa tersebut. Beberapa pejabat berpendapat bahwa penggunaan bahasa Inggris secara dominan akan meningkatkan citra profesional Indonesia, sedangkan peserta lainnya khawatir masyarakat dan pegawai yang tidak menguasai bahasa tersebut akan kesulitan memahami kebijakan yang dibahas. Anda sebagai koordinator komunikasi harus menentukan kebijakan bahasa yang menghormati kedudukan Bahasa Indonesia sekaligus mendukung komunikasi internasional. Kebijakan terbaik adalah ....","opsi":{"A":"Menggunakan bahasa Inggris untuk seluruh dokumen dan kegiatan utama, sedangkan Bahasa Indonesia hanya digunakan dalam sambutan pembukaan dan penutupan agar identitas nasional tetap ditampilkan tanpa mengurangi efisiensi komunikasi dengan delegasi internasional.","B":"Menggunakan Bahasa Indonesia dalam seluruh kegiatan tanpa menyediakan penerjemahan, karena kedudukan bahasa negara mengharuskan semua peserta asing menyesuaikan diri dan menjadikan penguasaan Bahasa Indonesia sebagai syarat utama untuk berpartisipasi.","C":"Menggunakan Bahasa Indonesia sebagai bahasa utama kegiatan dan dokumen resmi nasional, menyediakan penerjemahan atau versi bahasa asing sesuai kebutuhan, serta memastikan informasi yang diperlukan masyarakat dan peserta dapat diakses secara setara.","D":"Membebaskan setiap pembicara memilih bahasa masing-masing tanpa pengaturan penerjemahan atau penyusunan dokumen dalam bahasa yang konsisten, sebab kebebasan menggunakan bahasa merupakan bagian dari penghormatan terhadap keragaman peserta konferensi.","E":"Menggunakan bahasa Inggris untuk dokumen kebijakan dan hasil keputusan, tetapi menyediakan ringkasan Bahasa Indonesia setelah konferensi selesai, sehingga proses diskusi tetap praktis dan masyarakat dapat memperoleh penjelasan dalam bahasa negara pada tahap berikutnya."},"kunci":"C","poin":null,"pembahasan":"Bahasa Indonesia berkedudukan sebagai bahasa negara sebagaimana diatur dalam Pasal 36 UUD 1945. Bahasa Indonesia juga berfungsi sebagai bahasa persatuan yang memperkuat identitas nasional dan memudahkan komunikasi antarkelompok masyarakat.\nPilihan C menempatkan Bahasa Indonesia sebagai bahasa utama dalam kegiatan resmi nasional, tanpa menutup penggunaan bahasa asing untuk kepentingan komunikasi internasional.\nPilihan A dan E berisiko menempatkan Bahasa Indonesia sebagai pelengkap. Pilihan B mengabaikan kebutuhan komunikasi internasional, sedangkan D tidak menjamin keseragaman dan keterpahaman dokumen resmi."},{"bagian":"TWK","no":26,"soal":"Sebuah lembaga pemerintah menerima pengaduan dari masyarakat yang berasal dari berbagai daerah. Untuk meningkatkan kecepatan pelayanan, tim teknologi mengembangkan sistem pengaduan digital yang menggunakan istilah teknis dan singkatan berbahasa asing. Sistem tersebut dinilai praktis oleh pengembang, tetapi hasil uji coba menunjukkan bahwa sebagian masyarakat mengalami kesulitan memahami petunjuk, status pengaduan, dan persyaratan dokumen. Tim pengembang berpendapat bahwa masyarakat seharusnya membiasakan diri dengan istilah internasional karena sistem digital membutuhkan bahasa yang ringkas. Sebagai pejabat yang bertanggung jawab terhadap mutu pelayanan, keputusan yang paling tepat adalah ....","opsi":{"A":"Mempertahankan seluruh istilah asing karena penggunaan terminologi internasional akan meningkatkan kemampuan digital masyarakat, kemudian menyediakan petugas khusus untuk membantu warga yang belum memahami cara menggunakan sistem.","B":"Menghapus seluruh istilah teknis, termasuk istilah yang memang diperlukan dalam proses administrasi, dan menggantinya dengan ungkapan sehari-hari tanpa memperhatikan kemungkinan timbulnya ketidakjelasan makna atau perbedaan penafsiran.","C":"Meminta masyarakat mengikuti pelatihan penggunaan aplikasi sebelum dapat mengajukan pengaduan, sebab kemampuan memahami istilah digital merupakan bagian dari penyesuaian terhadap perkembangan teknologi dan tidak harus menjadi tanggung jawab pengembang.","D":"Menyediakan dua versi aplikasi dengan fungsi yang berbeda, yaitu versi berbahasa Indonesia untuk masyarakat umum dan versi berbahasa asing untuk pengguna yang memiliki kemampuan lebih tinggi, tanpa menyamakan kejelasan informasi pada kedua versi tersebut.","E":"Menggunakan Bahasa Indonesia yang baku, jelas, dan mudah dipahami pada petunjuk serta informasi utama, mempertahankan istilah teknis yang diperlukan dengan penjelasan yang memadai, dan menguji keterpahaman sistem kepada pengguna yang beragam."},"kunci":"E","poin":null,"pembahasan":"Penggunaan Bahasa Indonesia dalam pelayanan publik tidak cukup hanya dengan mengganti kata asing. Bahasa yang digunakan harus jelas, tepat, dan dapat dipahami oleh masyarakat yang menjadi sasaran pelayanan.\nPilihan E menggabungkan ketepatan bahasa, aksesibilitas, dan pengujian kepada pengguna. Istilah teknis yang benar-benar diperlukan tetap dapat digunakan dengan penjelasan yang sesuai.\nPilihan A membebankan masalah kepada masyarakat. Pilihan B berpotensi menghilangkan ketepatan istilah, C menciptakan hambatan akses, dan D berisiko menimbulkan ketimpangan mutu informasi."},{"bagian":"TWK","no":27,"soal":"Dalam sebuah forum konsultasi publik, seorang pejabat menyampaikan paparan kebijakan menggunakan Bahasa Indonesia yang penuh istilah birokrasi, kalimat panjang, dan struktur yang sulit dipahami. Ketika warga meminta penjelasan, pejabat tersebut menyatakan bahwa penggunaan bahasa resmi memang harus terdengar formal dan rumit agar mencerminkan kewibawaan pemerintah. Akibatnya, masyarakat kesulitan memahami hak, kewajiban, dan prosedur yang harus mereka ikuti. Sebagian peserta forum kemudian mengusulkan agar seluruh dokumen diubah menjadi bahasa percakapan tanpa memperhatikan kaidah kebahasaan. Anda diminta menyusun rekomendasi yang tepat mengenai penggunaan Bahasa Indonesia dalam komunikasi pemerintahan. Rekomendasi terbaik adalah ....","opsi":{"A":"Mempertahankan gaya bahasa birokrasi karena masyarakat perlu membiasakan diri dengan istilah resmi, sementara penyederhanaan bahasa dikhawatirkan mengurangi wibawa pemerintah dan menimbulkan penafsiran yang terlalu bebas terhadap peraturan.","B":"Menggunakan Bahasa Indonesia yang sesuai kaidah, efektif, dan mudah dipahami, menjelaskan istilah hukum atau teknis yang diperlukan, serta menyesuaikan bentuk penyampaian dengan kebutuhan pembaca tanpa mengubah substansi kebijakan.","C":"Mengganti seluruh dokumen resmi dengan bahasa percakapan sehari-hari dan menghilangkan istilah hukum yang sulit, sebab komunikasi pemerintahan harus selalu sederhana meskipun terdapat konsekuensi terhadap ketepatan makna atau kekuatan rumusan administratif.","D":"Membatasi penjelasan kebijakan hanya kepada warga yang memiliki latar belakang pendidikan memadai, kemudian meminta kelompok masyarakat lainnya memperoleh informasi melalui perantara agar isi dokumen resmi tidak perlu disederhanakan.","E":"Menyerahkan penyusunan seluruh komunikasi pemerintahan kepada ahli bahasa tanpa melibatkan unit teknis penyusun kebijakan, sehingga ketepatan Bahasa Indonesia dapat dipastikan meskipun konteks administratif dan substansi program tidak selalu dipahami secara lengkap oleh penyunting."},"kunci":"B","poin":null,"pembahasan":"Bahasa Indonesia yang baik dalam komunikasi pemerintahan harus memenuhi ketepatan kaidah sekaligus mempertimbangkan situasi, tujuan, dan sasaran komunikasi. Bahasa resmi tidak harus rumit agar terlihat berwibawa.\nPilihan B menjaga ketepatan substansi, keterbacaan, dan profesionalitas. Pilihan A menyamakan kerumitan dengan kewibawaan. Pilihan C berisiko menghilangkan makna hukum, D membatasi akses informasi, dan E memisahkan penyuntingan bahasa dari pemahaman substansi kebijakan."},{"bagian":"TWK","no":28,"soal":"Sebuah universitas negeri bekerja sama dengan perguruan tinggi luar negeri dalam program penelitian. Dalam dokumen kerja sama, tim peneliti menggunakan Bahasa Inggris untuk berkomunikasi dengan mitra internasional. Namun, laporan akhir juga akan digunakan oleh kementerian, pemerintah daerah, mahasiswa, dan masyarakat Indonesia. Salah seorang peneliti mengusulkan agar laporan akhir hanya disusun dalam Bahasa Inggris karena hasil penelitian akan dipublikasikan di jurnal internasional. Peneliti lain menganggap semua bagian laporan harus diterjemahkan secara harfiah ke Bahasa Indonesia tanpa memperhatikan istilah ilmiah yang telah lazim digunakan. Sebagai ketua tim, keputusan paling tepat adalah ....","opsi":{"A":"Menetapkan Bahasa Indonesia sebagai satu-satunya bahasa dalam seluruh proses penelitian, termasuk komunikasi dengan mitra internasional, karena penggunaan bahasa asing dapat mengurangi konsistensi kedudukan bahasa negara dalam kegiatan akademik.","B":"Menggunakan Bahasa Inggris untuk seluruh dokumen dan laporan, lalu menyerahkan kepada pembaca Indonesia untuk menerjemahkannya secara mandiri apabila diperlukan, sebab publikasi internasional merupakan tujuan utama kerja sama penelitian.","C":"Menerjemahkan setiap istilah ilmiah ke dalam padanan Bahasa Indonesia yang baru meskipun istilah tersebut belum lazim digunakan, kemudian menghindari istilah asing dalam semua bagian laporan agar tidak terjadi ketergantungan terhadap bahasa internasional.","D":"Menggunakan bahasa sesuai kebutuhan komunikasi internasional, menyusun laporan Bahasa Indonesia yang akurat untuk kepentingan nasional, dan menyediakan versi bahasa asing apabila diperlukan dengan menjaga konsistensi istilah serta kesetaraan substansi kedua versi.","E":"Menyusun laporan utama dalam Bahasa Indonesia, tetapi membatasi penjelasan metodologi dan hasil penelitian yang rumit pada lampiran berbahasa Inggris, sehingga pembaca umum dapat memahami ringkasan tanpa harus mengakses seluruh informasi teknis."},"kunci":"D","poin":null,"pembahasan":"Bahasa Indonesia sebagai bahasa negara tidak menghalangi penggunaan bahasa asing dalam komunikasi ilmiah internasional. Yang penting, hasil kegiatan yang ditujukan bagi kepentingan nasional tetap dapat diakses secara akurat dalam Bahasa Indonesia.\nPilihan D menjaga fungsi Bahasa Indonesia dalam penyebaran pengetahuan sekaligus mendukung kerja sama internasional. Pilihan A terlalu membatasi, B mengabaikan akses pembaca nasional, C dapat menciptakan istilah yang tidak tepat, dan E membatasi akses terhadap informasi metodologi yang penting."},{"bagian":"TWK","no":29,"soal":"Sebuah pemerintah daerah mengembangkan kampanye nasionalisme bagi generasi muda melalui media sosial. Tim komunikasi mengusulkan penggunaan campuran Bahasa Indonesia dan istilah asing yang sedang populer agar konten lebih menarik. Dalam uji coba, konten tersebut memperoleh banyak interaksi, tetapi sebagian pesan kebangsaan menjadi sulit dipahami oleh masyarakat yang tidak akrab dengan istilah tersebut. Sebagian anggota tim menganggap jumlah interaksi sebagai ukuran utama keberhasilan, sedangkan anggota lain ingin menghapus seluruh unsur bahasa populer dan menggunakan kalimat formal dalam semua unggahan. Anda sebagai koordinator kampanye harus menjaga kedudukan Bahasa Indonesia sekaligus memastikan pesan menjangkau generasi muda secara efektif. Strategi paling tepat adalah ....","opsi":{"A":"Menggunakan Bahasa Indonesia yang komunikatif dan sesuai kaidah sebagai dasar pesan, menyesuaikan gaya penyampaian dengan karakter media sosial, serta menggunakan istilah asing atau populer secara selektif apabila diperlukan dan tetap mudah dipahami oleh sasaran kampanye.","B":"Mempertahankan seluruh istilah asing yang memperoleh interaksi tinggi, karena keberhasilan kampanye diukur berdasarkan jangkauan dan jumlah tanggapan pengguna, sedangkan ketepatan bahasa dapat diperbaiki pada publikasi resmi berikutnya.","C":"Menggunakan bahasa resmi yang sangat formal pada semua unggahan tanpa mempertimbangkan karakter media sosial, karena kampanye kebangsaan harus selalu menggunakan ragam bahasa yang sama seperti dokumen pemerintahan.","D":"Mengizinkan setiap pengelola akun menggunakan gaya bahasa masing-masing tanpa pedoman kebahasaan, karena kreativitas individu lebih penting daripada konsistensi pesan dan standar komunikasi dalam kampanye nasional.","E":"Menghapus seluruh istilah populer dan membatasi konten pada kutipan peraturan serta definisi resmi, sehingga pesan kebangsaan terhindar dari perubahan makna yang mungkin timbul akibat penggunaan gaya bahasa yang dekat dengan generasi muda."},"kunci":"A","poin":null,"pembahasan":"Penggunaan Bahasa Indonesia sebagai bahasa persatuan dapat disesuaikan dengan perkembangan media dan karakteristik audiens tanpa menghilangkan ketepatan makna.
