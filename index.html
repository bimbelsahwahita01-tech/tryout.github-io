Bahasa yang komunikatif justru membantu pesan kebangsaan menjangkau masyarakat lebih luas.\nPilihan A memadukan kedudukan Bahasa Indonesia, kreativitas, dan efektivitas komunikasi. Pilihan B terlalu mengutamakan popularitas, C tidak menyesuaikan ragam bahasa, D mengabaikan konsistensi, dan E membuat komunikasi berpotensi kaku serta kurang efektif."},{"bagian":"TWK","no":30,"soal":"Sebuah instansi menyusun peraturan internal baru yang akan menjadi pedoman bagi seluruh unit kerja di berbagai daerah. Dalam proses penyusunan, tim menemukan bahwa beberapa istilah yang digunakan dalam rancangan peraturan memiliki makna berbeda antara bahasa sehari-hari, istilah teknis, dan penggunaan dalam dokumen hukum. Sebagian anggota tim ingin segera mengesahkan rancangan karena jadwal pelaksanaan sudah dekat. Anggota lain mengusulkan pemeriksaan kebahasaan, tetapi khawatir proses tersebut akan memperlambat pekerjaan. Anda sebagai koordinator penyusunan peraturan harus menjaga ketepatan Bahasa Indonesia dan kepastian pelaksanaan kebijakan. Keputusan paling tepat adalah ....","opsi":{"A":"Mengesahkan rancangan sesuai jadwal dan meminta setiap unit kerja menafsirkan istilah yang belum jelas berdasarkan kondisi setempat, sebab penyesuaian di lapangan lebih fleksibel daripada menunda kebijakan untuk pemeriksaan bahasa.","B":"Mengganti seluruh istilah teknis dengan istilah sehari-hari yang lebih singkat tanpa meminta masukan ahli substansi, karena dokumen yang mudah dibaca selalu lebih baik daripada dokumen yang mempertahankan istilah administratif yang kompleks.","C":"Melakukan penyelarasan substansi dan pemeriksaan kebahasaan sebelum pengesahan, memastikan istilah digunakan secara konsisten, memperjelas rumusan yang berpotensi menimbulkan tafsir berbeda, serta menyelesaikan proses sesuai prosedur dan jadwal yang realistis.","D":"Meminta setiap unit kerja menyusun versi peraturannya sendiri berdasarkan rancangan awal, kemudian menggabungkan hasilnya setelah diterapkan beberapa bulan agar istilah yang paling sesuai dapat dipilih berdasarkan pengalaman nyata di lapangan.","E":"Mempertahankan seluruh istilah dalam rancangan karena telah dibahas oleh tim teknis, lalu mengatasi perbedaan penafsiran melalui surat edaran tambahan setelah ditemukan masalah dalam pelaksanaan di berbagai unit kerja."},"kunci":"C","poin":null,"pembahasan":"Bahasa Indonesia dalam dokumen resmi harus digunakan secara cermat, konsisten, dan sesuai dengan tujuan komunikasi hukum atau administratif. Ketidakjelasan istilah dapat menimbulkan perbedaan penafsiran, ketidaksamaan pelaksanaan, dan persoalan akuntabilitas.\nPilihan C mengintegrasikan pemeriksaan bahasa dan substansi sebelum peraturan disahkan. Pilihan A membiarkan ketidakjelasan, B berisiko menghilangkan makna teknis, D menghasilkan aturan yang tidak seragam, dan E menunda penyelesaian masalah sampai setelah kebijakan diterapkan."},{"bagian":"TIU","no":1,"soal":"ANEMOMETER : KECEPATAN ANGIN = ...","opsi":{"A":"Termostat : suhu ruangan yang dijaga agar tetap konstan","B":"Katup pengaman : tekanan uap yang berlebih di dalam ketel","C":"Seismograf : getaran gempa","D":"Mikroskop : sel-sel renik yang tidak terlihat oleh mata","E":"Saklar : aliran arus listrik pada rangkaian yang tertutup"},"kunci":"C","poin":null,"pembahasan":"Anemometer adalah alat pengukur kecepatan angin, sehingga hubungannya adalah alat dengan besaran yang diukurnya. Seismograf mengukur dan merekam getaran gempa. Termostat bertugas mengatur suhu, katup pengaman mengamankan tekanan, mikroskop memperbesar objek, dan saklar memutus atau menyambung arus. Semuanya bukan alat ukur."},{"bagian":"TIU","no":2,"soal":"DEFORESTASI : BANJIR BANDANG = ...","opsi":{"A":"Polusi udara : gangguan pernapasan","B":"Gagal panen : kemarau yang berkepanjangan di lahan pertanian","C":"Waduk : air hujan yang ditampung di daerah lembah","D":"Perkebunan : hasil kayu yang diperdagangkan secara luas","E":"Longsor : penebangan pohon di lereng perbukitan"},"kunci":"A","poin":null,"pembahasan":"Hubungannya adalah sebab dengan akibat, dengan urutan penyebab lalu akibat. Polusi udara menyebabkan gangguan pernapasan. Pilihan B dan E memakai urutan terbalik (akibat : sebab). Pilihan C dan D bukan hubungan sebab-akibat."},{"bagian":"TIU","no":3,"soal":"DENAH : RUMAH = ...","opsi":{"A":"Arsitek : perancang gedung bertingkat tinggi","B":"Batu bata : tembok pembatas halaman rumah","C":"Kontraktor : pelaksana pembangunan proyek gedung","D":"Tukang kayu : pembuat perabot rumah tangga","E":"Partitur : komposisi lagu"},"kunci":"E","poin":null,"pembahasan":"Denah adalah rancangan tertulis atau gambar yang menjadi acuan wujud rumah. Partitur adalah rancangan tertulis yang menjadi acuan wujud lagu. Pilihan A, C, dan D adalah pelaku, sedangkan B adalah bahan."},{"bagian":"TIU","no":4,"soal":"Semua peserta lomba karya ilmiah yang menyertakan data primer akan memperoleh nilai tambahan. Sebagian peserta lomba karya ilmiah tidak memperoleh nilai tambahan. Kesimpulan yang pasti benar adalah ...","opsi":{"A":"Semua peserta lomba karya ilmiah menyertakan data primer dalam karya yang mereka kumpulkan","B":"Sebagian peserta lomba karya ilmiah tidak menyertakan data primer","C":"Semua peserta lomba karya ilmiah yang memperoleh nilai tambahan pasti menyertakan data primer","D":"Sebagian peserta lomba karya ilmiah yang menyertakan data primer tidak memperoleh nilai tambahan","E":"Tidak ada peserta lomba karya ilmiah yang menyertakan data primer dan memperoleh nilai tambahan"},"kunci":"B","poin":null,"pembahasan":"Misalkan D = menyertakan data primer dan N = mendapat nilai tambahan. Premis 1 berbunyi D → N. Premis 2 menyebut sebagian peserta bukan N. Menurut kontraposisi, bukan N berarti bukan D, sehingga sebagian peserta tidak menyertakan data primer. A salah karena bertentangan dengan premis 2. C adalah kebalikan premis 1 dan tidak sah. D dan E bertentangan dengan premis 1."},{"bagian":"TIU","no":5,"soal":"Jika anggaran riset disetujui, maka laboratorium akan direnovasi. Jika laboratorium direnovasi, maka praktikum dipindahkan ke gedung B. Praktikum tidak dipindahkan ke gedung B. Kesimpulan yang sah adalah ...","opsi":{"A":"Laboratorium tetap direnovasi, tetapi anggaran riset ternyata tidak disetujui oleh pimpinan","B":"Anggaran riset disetujui sehingga laboratorium direnovasi, dan praktikum tetap berjalan di gedung semula","C":"Anggaran riset disetujui, tetapi laboratorium belum direnovasi karena praktikum tidak dipindahkan","D":"Anggaran riset tidak disetujui dan laboratorium tidak direnovasi","E":"Laboratorium tidak direnovasi, namun anggaran riset masih mungkin disetujui pada waktu lain"},"kunci":"D","poin":null,"pembahasan":"Praktikum tidak dipindahkan, sehingga dengan modus tollens pada premis 2 laboratorium tidak direnovasi. Laboratorium tidak direnovasi, sehingga dengan modus tollens pada premis 1 anggaran riset tidak disetujui. Jadi keduanya pasti terjadi. A, B, dan C bertentangan dengan rantai implikasi. E salah karena anggaran pasti tidak disetujui, bukan “mungkin disetujui”."},{"bagian":"TIU","no":6,"soal":"Semua auditor internal adalah pegawai yang memahami standar akuntansi. Tidak ada pegawai yang memahami standar akuntansi yang menerima gratifikasi. Kesimpulan yang pasti benar adalah ...","opsi":{"A":"Tidak ada auditor internal yang menerima gratifikasi","B":"Semua pegawai yang tidak menerima gratifikasi adalah auditor internal dalam perusahaan itu","C":"Sebagian pegawai penerima gratifikasi adalah auditor internal yang memahami standar akuntansi","D":"Sebagian auditor internal tidak memahami standar akuntansi sehingga menerima gratifikasi","E":"Semua pegawai yang memahami standar akuntansi adalah auditor internal yang tidak menerima gratifikasi"},"kunci":"A","poin":null,"pembahasan":"Auditor internal termasuk dalam kelompok pegawai yang memahami standar akuntansi. Kelompok itu tidak ada yang menerima gratifikasi, sehingga auditor internal juga tidak ada yang menerimanya. B dan E menukar arah himpunan. C dan D bertentangan dengan premis."},{"bagian":"TIU","no":7,"soal":"Sebagian dosen adalah peneliti. Semua peneliti adalah penulis jurnal. Tidak ada penulis jurnal yang malas membaca. Kesimpulan yang pasti benar adalah ...","opsi":{"A":"Semua dosen adalah penulis jurnal yang rajin membaca","B":"Sebagian peneliti adalah dosen yang malas membaca buku referensi","C":"Sebagian penulis jurnal adalah dosen yang malas membaca literatur","D":"Sebagian dosen tidak malas membaca","E":"Semua dosen yang malas membaca adalah peneliti yang menulis jurnal"},"kunci":"D","poin":null,"pembahasan":"Sebagian dosen adalah peneliti, peneliti adalah penulis jurnal, dan penulis jurnal tidak malas membaca. Jadi sebagian dosen (yang peneliti) tidak malas membaca. A salah karena baru “sebagian” dosen yang peneliti. B dan C bertentangan dengan premis 3. E bertentangan karena peneliti tidak mungkin malas membaca."},{"bagian":"TIU","no":8,"soal":"Lima rapat (P, Q, R, S, T) dilaksanakan pada hari Senin sampai Jumat, masing-masing satu rapat per hari. Ketentuan: (1) Rapat T dilaksanakan lebih awal daripada P, dan P lebih awal daripada Q. (2) Rapat S dilaksanakan tepat satu hari setelah rapat Q. (3) Rapat R tidak dilaksanakan pada hari Senin maupun Jumat. (4) Rapat P tidak dilaksanakan pada hari Selasa. Pernyataan yang pasti benar adalah ...","opsi":{"A":"Rapat R dilaksanakan setelah rapat P dan sebelum rapat Q pada minggu yang sama","B":"Rapat T dilaksanakan tepat satu hari sebelum rapat S dan sesudah rapat R","C":"Rapat P dilaksanakan tepat satu hari sebelum rapat Q","D":"Rapat S dilaksanakan pada hari Kamis, yaitu satu hari setelah rapat Q selesai","E":"Rapat R dilaksanakan pada hari Rabu, yaitu tepat di antara rapat T dan rapat P"},"kunci":"C","poin":null,"pembahasan":"Urutan T < P < Q dengan S tepat setelah Q berarti Senin pasti diisi T, karena R tidak boleh Senin dan P, Q, S tidak mungkin yang pertama. R tidak boleh Jumat dan tidak boleh diselipkan di antara Q dan S, sehingga R berada di antara T dan P atau di antara P dan Q. Dua kemungkinannya adalah T-R-P-Q-S atau T-P-R-Q-S. Syarat 4 (P bukan Selasa) menggugurkan kemungkinan kedua. Jadi urutannya Senin T, Selasa R, Rabu P, Kamis Q, Jumat S. P (Rabu) tepat satu hari sebelum Q (Kamis), maka C benar. A, B, D, dan E tidak sesuai urutan itu."},{"bagian":"TIU","no":9,"soal":"Empat staf (Arga, Bayu, Cantika, Dimas) diduga menghilangkan satu berkas, dan hanya satu orang pelakunya. Pernyataan mereka: Arga: “Bayu yang menghilangkan berkas itu.” Bayu: “Dimas yang menghilangkannya.” Cantika: “Saya tidak menghilangkannya.” Dimas: “Bayu berbohong ketika mengatakan bahwa saya pelakunya.” Jika hanya satu pernyataan yang benar, pelakunya adalah ...","opsi":{"A":"Arga, karena pernyataannya yang menuduh Bayu terbukti salah dan hanya pernyataan Cantika yang benar","B":"Bayu, karena pernyataannya bertentangan dengan pernyataan Dimas sehingga ia pasti berbohong","C":"Dimas, karena Bayu telah menuduhnya dan pernyataan Bayu dibenarkan oleh Cantika","D":"Tidak dapat ditentukan, sebab masing-masing staf memiliki kemungkinan yang sama untuk berbohong","E":"Cantika, karena pernyataannya salah"},"kunci":"E","poin":null,"pembahasan":"Pernyataan Dimas adalah negasi dari pernyataan Bayu, sehingga tepat satu di antara keduanya benar. Karena total hanya satu pernyataan yang benar, pernyataan Arga dan Cantika pasti salah. Pernyataan Cantika salah berarti ia pelakunya. Cek: pernyataan Arga salah (Bayu bukan pelaku), pernyataan Bayu salah (Dimas bukan pelaku), dan pernyataan Dimas benar, jadi tepat satu yang benar. Jika Arga pelaku, benar ada dua (Cantika dan Dimas). Jika Bayu pelaku, benar ada dua (Arga dan Dimas). Jika Dimas pelaku, benar ada dua (Bayu dan Cantika). Semuanya menyalahi syarat."},{"bagian":"TIU","no":10,"soal":"Enam pegawai (K, L, M, N, O, P) dibagi ke dalam dua tim, Alfa dan Beta, masing-masing tiga orang. Ketentuan: (1) K dan L tidak satu tim. (2) M dan N harus satu tim. (3) O tidak satu tim dengan M. (4) P satu tim dengan K. Dua orang yang pasti satu tim dengan L adalah ...","opsi":{"A":"K dan P, sebab keduanya wajib dipisahkan dari L dan M","B":"M dan N","C":"O dan P, sebab O tidak boleh bergabung dengan M","D":"K dan O, sebab K tidak boleh bergabung dengan P","E":"N dan O, sebab N dapat dipisahkan dari M"},"kunci":"B","poin":null,"pembahasan":"K dan P satu tim, sedangkan L berada di tim lain. Tim K-P hanya punya satu kursi kosong, padahal M dan N harus bersama (butuh dua kursi). Maka M dan N masuk ke tim L, dan O mengisi kursi kosong tim K-P (sesuai syarat 3). Susunannya: {K, P, O} dan {L, M, N}."},{"bagian":"TIU","no":11,"soal":"Hasil dari (2/3 + 3/4) ÷ (5/6 − 1/4) × 1,4 adalah ...","opsi":{"A":"3,6","B":"2,9","C":"3,2","D":"3,0","E":"3,4"},"kunci":"E","poin":null,"pembahasan":"2/3 + 3/4 = 8/12 + 9/12 = 17/12. 5/6 − 1/4 = 10/12 − 3/12 = 7/12. Maka (17/12) ÷ (7/12) = 17/7, dan 17/7 × 1,4 = 17/7 × 7/5 = 17/5 = 3,4."},{"bagian":"TIU","no":12,"soal":"Hasil dari 15% dari 2.400 ditambah 2/5 dari 1.250, dikurangi 0,4% dari 25.000 adalah ...","opsi":{"A":"740","B":"760","C":"780","D":"820","E":"860"},"kunci":"B","poin":null,"pembahasan":"15% × 2.400 = 360. 2/5 × 1.250 = 500. 0,4% × 25.000 = 100. Maka 360 + 500 − 100 = 760."},{"bagian":"TIU","no":13,"soal":"Hasil dari √14.400 ÷ 4 + 3⁴ − 2⁵ × 1,5 adalah ...","opsi":{"A":"63","B":"111","C":"78","D":"159","E":"96"},"kunci":"A","poin":null,"pembahasan":"√14.400 = 120, lalu 120 ÷ 4 = 30. 3⁴ = 81. 2⁵ × 1,5 = 32 × 1,5 = 48. Maka 30 + 81 − 48 = 63."},{"bagian":"TIU","no":14,"soal":"5, 2, 9, 4, 17, 8, 33, 16, ..., ... Dua suku berikutnya adalah ...","opsi":{"A":"65 dan 24","B":"63 dan 32","C":"65 dan 32","D":"64 dan 32","E":"69 dan 32"},"kunci":"C","poin":null,"pembahasan":"Deret ini terdiri dari dua pola yang berselang-seling. Suku ganjil (5, 9, 17, 33, ...) naik +4, +8, +16, jadi berikutnya +32 sehingga 33 + 32 = 65. Suku genap (2, 4, 8, 16, ...) dikali 2 sehingga berikutnya 32."},{"bagian":"TIU","no":15,"soal":"1, 2, 6, 15, 31, 56, ... Suku ke-7 adalah ...","opsi":{"A":"82","B":"87","C":"90","D":"92","E":"97"},"kunci":"D","poin":null,"pembahasan":"Selisih antarsuku adalah 1, 4, 9, 16, 25, yaitu bilangan kuadrat 1², 2², 3², 4², 5². Selisih berikutnya 6² = 36, sehingga 56 + 36 = 92."},{"bagian":"TIU","no":16,"soal":"B, D, G, K, P, ..., ... Dua huruf berikutnya adalah ...","opsi":{"A":"U dan B","B":"V dan C","C":"V dan B","D":"W dan D","E":"V dan D"},"kunci":"B","poin":null,"pembahasan":"Urutan alfabetnya B(2), D(4), G(7), K(11), P(16), dengan selisih +2, +3, +4, +5. Selisih berikutnya +6 dan +7. 16 + 6 = 22 = V. 22 + 7 = 29, lalu 29 − 26 = 3 = C. Jadi V dan C."},{"bagian":"TIU","no":17,"soal":"3, 6, 18, 72, 360, ... Suku ke-7 adalah ...","opsi":{"A":"12.960","B":"14.400","C":"15.000","D":"15.120","E":"17.280"},"kunci":"D","poin":null,"pembahasan":"Pengalinya naik berurutan: ×2, ×3, ×4, ×5. Suku ke-6 = 360 × 6 = 2.160. Suku ke-7 = 2.160 × 7 = 15.120."},{"bagian":"TIU","no":18,"soal":"4, 9, 25, 49, 121, ... Suku berikutnya adalah ...","opsi":{"A":"169","B":"196","C":"225","D":"256","E":"289"},"kunci":"A","poin":null,"pembahasan":"Deret ini adalah kuadrat bilangan prima berurutan: 2², 3², 5², 7², 11². Bilangan prima setelah 11 adalah 13, sehingga 13² = 169."},{"bagian":"TIU","no":19,"soal":"Penjualan (unit) dua toko selama tiga bulan: Toko A: 120, 150, 180. Toko B: 100, 140, 210. P = rata-rata penjualan per bulan Toko A, Q = rata-rata penjualan per bulan Toko B. Hubungan P dan Q yang benar adalah ...","opsi":{"A":"P lebih besar daripada Q karena penjualan Toko A naik lebih stabil setiap bulannya","B":"Q lebih besar daripada P karena penjualan Toko B pada bulan terakhir lebih tinggi","C":"P dan Q tidak dapat dibandingkan karena pola kenaikan kedua toko berbeda","D":"Q lebih besar daripada P karena persentase kenaikan Toko B lebih tinggi","E":"P sama dengan Q"},"kunci":"E","poin":null,"pembahasan":"Rata-rata Toko A = (120 + 150 + 180) ÷ 3 = 450 ÷ 3 = 150. Rata-rata Toko B = (100 + 140 + 210) ÷ 3 = 450 ÷ 3 = 150. Jadi P = Q. Pilihan lain menggunakan alasan (kestabilan, bulan terakhir, persentase kenaikan) yang tidak relevan untuk membandingkan rata-rata."},{"bagian":"TIU","no":20,"soal":"Diketahui a > b > 0. P = a/b dan Q = (a+1)/(b+1). Hubungan P dan Q yang benar adalah ...","opsi":{"A":"P < Q, sebab penambahan 1 pada pembilang dan penyebut selalu memperbesar nilai pecahan","B":"P = Q, sebab penambahan bilangan yang sama pada pembilang dan penyebut tidak mengubah nilai pecahan","C":"P > Q","D":"Hubungan P dan Q tidak dapat ditentukan karena nilai a dan b tidak diketahui secara pasti","E":"P < Q apabila a dan b merupakan bilangan genap, sedangkan untuk lainnya P > Q"},"kunci":"C","poin":null,"pembahasan":"a/b > (a+1)/(b+1) ekuivalen dengan a(b+1) > b(a+1), yaitu ab + a > ab + b, yaitu a > b. Syarat ini terpenuhi, jadi P > Q untuk semua a > b > 0. Contoh: a = 3, b = 2 memberi P = 1,5 dan Q = 4/3 ≈ 1,33."},{"bagian":"TIU","no":21,"soal":"Pipa A dapat mengisi bak kosong hingga penuh dalam 6 jam, pipa B dalam 4 jam. P = waktu (jam) yang diperlukan jika kedua pipa dibuka bersamaan, Q = 2,5 jam. Hubungan P dan Q yang benar adalah ...","opsi":{"A":"P lebih besar daripada Q karena dua pipa harus berbagi debit air yang sama","B":"P sama dengan Q karena rata-rata 6 dan 4 adalah 5, dan setengahnya adalah 2,5","C":"P lebih besar daripada Q karena waktu gabungan lebih lama daripada pipa tercepat","D":"Hubungan P dan Q tidak dapat ditentukan karena kapasitas bak tidak diketahui","E":"P lebih kecil daripada Q, sebab P = 2,4 jam"},"kunci":"E","poin":null,"pembahasan":"Debit gabungan = 1/6 + 1/4 = 2/12 + 3/12 = 5/12 bak per jam. Waktu = 12/5 = 2,4 jam. Jadi P = 2,4 < 2,5 = Q. Pilihan B adalah jebakan karena rata-rata aritmetika tidak berlaku untuk laju kerja. Pilihan D salah karena kapasitas bak tidak memengaruhi hasil, cukup memakai bagian pekerjaan per jam."},{"bagian":"TIU","no":22,"soal":"Perbandingan umur Ayah dan Ibu sekarang adalah 7 : 6. Enam tahun lagi perbandingannya menjadi 8 : 7. Ibu melahirkan anak pertama pada usia 26 tahun. Jumlah umur Ayah, Ibu, dan anak pertama 8 tahun yang lalu adalah ... tahun.","opsi":{"A":"56","B":"60","C":"64","D":"72","E":"76"},"kunci":"C","poin":null,"pembahasan":"Misalkan umur sekarang Ayah 7k dan Ibu 6k. (7k + 6)/(6k + 6) = 8/7, maka 49k + 42 = 48k + 48 sehingga k = 6. Ayah 42 tahun dan Ibu 36 tahun. Anak berumur 36 − 26 = 10 tahun. Jumlah umur sekarang = 42 + 36 + 10 = 88. Delapan tahun lalu jumlahnya 88 − (3 × 8) = 64."},{"bagian":"TIU","no":23,"soal":"Kereta A berangkat dari kota P menuju kota Q pukul 07.00 dengan kecepatan 60 km/jam. Kereta B berangkat dari kota Q menuju kota P pukul 08.00 dengan kecepatan 90 km/jam. Jarak P-Q adalah 330 km. Kedua kereta bertemu pada ...","opsi":{"A":"Pukul 09.30 pada jarak 150 km dari kota P","B":"Pukul 09.48 pada jarak 168 km dari kota P","C":"Pukul 10.00 pada jarak 180 km dari kota P","D":"Pukul 09.48 pada jarak 162 km dari kota P","E":"Pukul 09.45 pada jarak 165 km dari kota P"},"kunci":"B","poin":null,"pembahasan":"Pukul 08.00 kereta A sudah menempuh 60 km, sehingga sisa jarak 330 − 60 = 270 km. Kecepatan gabungan = 60 + 90 = 150 km/jam, sehingga waktu bertemu = 270 ÷ 150 = 1,8 jam = 1 jam 48 menit setelah 08.00, yaitu pukul 09.48. Jarak dari P = 60 × 2,8 = 168 km. Pilihan D memuat jebakan karena 162 km adalah jarak dari Q (90 × 1,8), bukan dari P. Cek: 168 + 162 = 330 km."},{"bagian":"TIU","no":24,"soal":"Seorang pedagang membeli 40 kg beras seharga Rp12.000/kg dan 60 kg beras seharga Rp14.000/kg, lalu mencampurnya. Karena susut, hanya 90 kg beras yang bisa dijual. Agar pedagang memperoleh keuntungan 20% dari total modal, harga jual beras campuran per kg adalah ...","opsi":{"A":"Rp15.840","B":"Rp16.500","C":"Rp17.160","D":"Rp17.600","E":"Rp18.480"},"kunci":"D","poin":null,"pembahasan":"Total modal = (40 × 12.000) + (60 × 14.000) = 480.000 + 840.000 = Rp1.320.000. Hasil penjualan yang diinginkan = 120% × 1.320.000 = Rp1.584.000. Harga jual per kg = 1.584.000 ÷ 90 = Rp17.600. Pilihan A adalah jebakan karena memakai harga rata-rata modal Rp13.200 × 1,2 tanpa memperhitungkan susut."},{"bagian":"TIU","no":25,"soal":"Pekerja A dapat menyelesaikan suatu pekerjaan dalam 12 hari, B dalam 18 hari, dan C dalam 36 hari. A dan B bekerja bersama selama 4 hari, kemudian A berhenti dan pekerjaan dilanjutkan oleh B dan C bersama-sama sampai selesai. Total waktu pengerjaan sejak awal adalah ... hari.","opsi":{"A":"9 1/3","B":"9 2/3","C":"10","D":"10 1/3","E":"11"},"kunci":"A","poin":null,"pembahasan":"Laju A + B = 1/12 + 1/18 = 3/36 + 2/36 = 5/36 per hari. Dalam 4 hari terselesaikan 4 × 5/36 = 5/9, sisa 4/9. Laju B + C = 1/18 + 1/36 = 3/36 = 1/12 per hari. Waktu sisa = (4/9) ÷ (1/12) = 48/9 = 5 1/3 hari. Total = 4 + 5 1/3 = 9 1/3 hari."},{"bagian":"TIU","no":26,"soal":"Gambar 1 adalah segitiga sama kaki (puncak di atas) berisi kosong, hanya garis tepi. Gambar 2 adalah segitiga yang sama dan sama besar, tetapi terisi penuh warna biru. Gambar 3 adalah lingkaran besar kosong (garis tepi saja). Gambar 1 : Gambar 2 = Gambar 3 : ?","opsi":{"A":"Lingkaran besar kosong (garis tepi saja).","B":"Persegi terisi penuh.","C":"Lingkaran besar terisi penuh.","D":"Belah ketupat terisi penuh.","E":"Setengah lingkaran (kubah di atas) terisi penuh."},"kunci":"C","poin":null,"pembahasan":"Hubungan 1 → 2: bentuk, ukuran, dan posisi tetap; yang berubah hanya isi, dari kosong menjadi terisi penuh. Terapkan ke lingkaran: lingkaran terisi penuh."},{"bagian":"TIU","no":27,"soal":"Gambar 1 adalah panah tebal menunjuk ke atas. Gambar 2 adalah panah yang sama menunjuk ke kanan. Gambar 3 adalah huruf “L” dengan batang tegak di kiri dan kaki pendek mengarah ke kanan di bagian bawah (posisi normal). Gambar 1 : Gambar 2 = Gambar 3 : ?","opsi":{"A":"Batang horizontal di atas, kaki pendek menggantung ke bawah di ujung kiri.","B":"Posisi normal: batang tegak di kiri, kaki ke kanan di bawah.","C":"Batang tegak di kanan, kaki pendek mengarah ke kiri di bagian atas.","D":"Batang horizontal di bawah, kaki pendek mengarah ke atas di ujung kanan.","E":"Huruf L miring 45° (batang diagonal)."},"kunci":"A","poin":null,"pembahasan":"Panah berputar 90° SJJ (atas → kanan). Huruf L diputar 90° SJJ: batang tegak menjadi horizontal di atas, dan kaki menggantung ke bawah di sisi kiri."},{"bagian":"TIU","no":28,"soal":"Gambar 1 adalah lingkaran besar kosong (ukuran penuh). Gambar 2 adalah lingkaran kosong yang diperkecil menjadi setengah ukuran, tetap di tengah. Gambar 3 adalah belah ketupat besar kosong (ukuran penuh). Gambar 1 : Gambar 2 = Gambar 3 : ?","opsi":{"A":"Belah ketupat ukuran penuh.","B":"Belah ketupat berukuran sekitar tiga perempat.","C":"Lingkaran kecil kosong.","D":"Persegi kecil kosong.","E":"Belah ketupat kecil kosong, setengah ukuran awal."},"kunci":"E","poin":null,"pembahasan":"Aturan: bentuk tetap, ukuran mengecil menjadi ½ kali. Jadi jawabannya belah ketupat setengah ukuran (E). Pilihan B hanya mengecil ¾, sedangkan C dan D berganti bentuk."},{"bagian":"TIU","no":29,"soal":"Gambar 1 adalah persegi kosong besar. Gambar 2 adalah persegi kosong yang sama dengan sebuah lingkaran kecil terisi penuh tepat di tengahnya. Gambar 3 adalah segitiga sama kaki kosong (puncak di atas). Gambar 1 : Gambar 2 = Gambar 3 : ?","opsi":{"A":"Segitiga kosong berisi persegi kecil terisi penuh di tengah.","B":"Segitiga kosong berisi lingkaran kecil terisi penuh di tengah.","C":"Segitiga terisi penuh tanpa bangun di dalam.","D":"Lingkaran besar kosong berisi lingkaran kecil terisi penuh.","E":"Segitiga kosong berisi lingkaran kecil kosong (garis tepi) di tengah."},"kunci":"B","poin":null,"pembahasan":"Aturan: bangun luar tetap, lalu ditambahkan lingkaran kecil terisi penuh di tengahnya. Pilihan A salah bentuk dalam, C tanpa bangun dalam, D mengubah bangun luar, E lingkaran dalamnya tidak terisi."},{"bagian":"TIU","no":30,"soal":"Lima gambar masing-masing berupa persegi kosong besar dengan satu bangun kecil terisi penuh tepat di tengahnya. Pada gambar A, B, C, dan E bangun kecilnya lingkaran. Pada satu gambar lain bangun kecilnya berbeda. Pilih gambar yang berbeda dari yang lain.","opsi":{"A":"Persegi berisi lingkaran kecil penuh.","B":"Persegi berisi lingkaran kecil penuh.","C":"Persegi berisi lingkaran kecil penuh.","D":"Persegi berisi persegi kecil penuh.","E":"Persegi berisi lingkaran kecil penuh."},"kunci":"D","poin":null,"pembahasan":"Empat gambar (A, B, C, E) memiliki bangun dalam berupa lingkaran. Hanya D yang bangun dalamnya persegi, sehingga D adalah gambar yang berbeda."},{"bagian":"TIU","no":31,"soal":"Lima huruf “L” biru terisi penuh dengan arah berbeda. A: posisi normal (batang tegak kiri, kaki ke kanan bawah). B: diputar 90° SJJ. C: huruf L dicerminkan lalu diputar 180°. D: diputar 270° SJJ. E: diputar 135° SJJ. Pilih gambar yang berbeda.","opsi":{"A":"L normal (0°).","B":"L diputar 90° SJJ.","C":"L bayangan cermin, diputar 180°.","D":"L diputar 270° SJJ.","E":"L diputar 135° SJJ."},"kunci":"C","poin":null,"pembahasan":"A, B, D, dan E adalah bentuk L yang sama, hanya dirotasi berbeda. Gambar C adalah bayangan cermin L, dan pencerminan tidak bisa didapat hanya dengan memutar. Jadi C berbeda."},{"bagian":"TIU","no":32,"soal":"Lima panah tebal menunjuk ke arah berbeda. A: ke atas, B: ke kanan, C: ke bawah, D: ke kiri; semuanya kosong (garis tepi saja). E: menunjuk ke kanan-bawah (diputar 135° SJJ) dan terisi penuh warna biru. Pilih gambar yang berbeda.","opsi":{"A":"Panah ke atas, kosong.","B":"Panah ke kanan, kosong.","C":"Panah ke bawah, kosong.","D":"Panah ke kiri, kosong.","E":"Panah ke kanan-bawah, terisi penuh."},"kunci":"E","poin":null,"pembahasan":"Arah panah berbeda-beda di semua gambar, jadi arah bukan pembeda. Pembeda sebenarnya adalah isi: A–D kosong, hanya E yang terisi penuh."},{"bagian":"TIU","no":33,"soal":"Panah tebal berputar dan isinya berganti. Kotak 1: panah ke atas, kosong. Kotak 2: panah ke kanan, terisi penuh. Kotak 3: panah ke bawah, kosong. Kotak 4: panah ke kiri, terisi penuh. Kotak 5: “?”.","opsi":{"A":"Panah ke atas, terisi penuh.","B":"Panah ke atas, kosong.","C":"Panah ke kanan, kosong.","D":"Panah ke bawah, terisi penuh.","E":"Panah ke kiri, kosong."},"kunci":"B","poin":null,"pembahasan":"Dua pola: arah berputar 90° SJJ tiap langkah (atas → kanan → bawah → kiri → atas), dan isi bergantian kosong–penuh–kosong–penuh–kosong. Jawaban: panah ke atas, kosong."},{"bagian":"TIU","no":34,"soal":"Bentuk berganti dalam siklus tiga bentuk dan isinya bergantian. Kotak 1: persegi terisi penuh. Kotak 2: lingkaran kosong. Kotak 3: segitiga terisi penuh. Kotak 4: persegi kosong. Kotak 5: “?”.","opsi":{"A":"Lingkaran terisi penuh.","B":"Lingkaran kosong.","C":"Segitiga terisi penuh.","D":"Persegi terisi penuh.","E":"Segitiga kosong."},"kunci":"A","poin":null,"pembahasan":"Bentuk berulang tiap 3 langkah: persegi → lingkaran → segitiga → persegi → lingkaran. Isi bergantian penuh–kosong–penuh–kosong–penuh. Jawaban: lingkaran terisi penuh."},{"bagian":"TIU","no":35,"soal":"Huruf “L” berputar sambil mengecil. Kotak 1: L normal ukuran penuh. Kotak 2: diputar 90° SJJ, ukuran ±85%. Kotak 3: diputar 180°, ukuran ±70%. Kotak 4: diputar 270°, ukuran ±55%. Kotak 5: “?”.","opsi":{"A":"L normal, ukuran ±70%.","B":"L normal, ukuran ±55%.","C":"L diputar 90° SJJ, ukuran ±40%.","D":"L normal (0°), ukuran paling kecil ±40%.","E":"L diputar 180°, ukuran ±40%."},"kunci":"D","poin":null,"pembahasan":"Rotasi 90° SJJ tiap langkah dan ukuran mengecil sekitar 15% tiap langkah. Langkah ke-5: 360° (kembali normal) dengan ukuran ±40%. Jawaban D."},{"bagian":"TKP","no":1,"soal":"Anda bertugas di unit pelayanan administrasi yang sedang mengalami peningkatan jumlah pemohon menjelang batas akhir pengumpulan dokumen. Sistem antrean berjalan, tetapi beberapa warga lanjut usia kesulitan memahami persyaratan digital. Pada saat yang sama, rekan kerja Anda meminta agar seluruh pemohon tetap mengikuti prosedur biasa karena petugas sedang kekurangan waktu. Anda ingin menjaga kecepatan layanan tanpa mengurangi keadilan, ketepatan prosedur, dan aksesibilitas bagi seluruh warga. Tindakan yang paling tepat adalah ....","opsi":{"A":"Memetakan kebutuhan pemohon, memberikan pendampingan singkat kepada warga yang kesulitan, serta menjaga urutan antrean dan persyaratan yang berlaku.","B":"Meminta warga lanjut usia kembali pada hari berikutnya agar petugas dapat menyelesaikan antrean utama tanpa menambah waktu pelayanan.","C":"Mengizinkan warga yang kesulitan digital menyerahkan dokumen melalui petugas tanpa pemeriksaan awal, kemudian melakukan verifikasi setelah antrean selesai.","D":"Memusatkan pelayanan pada pemohon yang paling cepat melengkapi persyaratan agar jumlah berkas yang selesai setiap hari meningkat secara signifikan.","E":"Mengusulkan penghentian sementara layanan digital dan mengalihkan seluruh pemohon ke pelayanan manual meskipun fasilitas dan petugas belum mencukupi."},"kunci":"A","poin":{"A":5,"B":2,"C":3,"D":1,"E":4},"pembahasan":"A (5 poin): Paling tepat karena menggabungkan pelayanan inklusif, efisiensi, keadilan antrean, dan kepatuhan prosedur.\nB (2 poin): Mengurangi beban petugas, tetapi menunda hak warga memperoleh pelayanan tanpa mencoba memberikan bantuan.\nC (3 poin): Menawarkan solusi praktis, tetapi verifikasi yang ditunda dapat menimbulkan kesalahan administrasi.\nD (1 poin): Mengutamakan jumlah berkas selesai daripada kesetaraan akses dan kebutuhan masyarakat.\nE (4 poin): Menunjukkan inisiatif alternatif, tetapi perubahan sistem secara menyeluruh belum didukung analisis kapasitas dan kebutuhan."},{"bagian":"TKP","no":2,"soal":"Seorang warga menyampaikan keluhan dengan nada tinggi karena permohonannya belum selesai, padahal ia telah datang dua kali. Setelah diperiksa, keterlambatan terjadi akibat dokumen pendukung yang belum lengkap, tetapi informasi tentang kekurangan dokumen sebelumnya tidak disampaikan secara jelas oleh petugas. Warga tersebut menganggap instansi sengaja mempersulit masyarakat. Anda menjadi petugas yang harus menanganinya, sementara antrean lain terus bertambah. Apa tindakan terbaik?","opsi":{"A":"Menjelaskan bahwa pemohon tetap bertanggung jawab atas kelengkapan dokumen, kemudian meminta warga membaca kembali persyaratan yang telah ditempelkan di ruang pelayanan.","B":"Mendengarkan keluhan, mengakui kekurangan komunikasi petugas, menjelaskan dokumen yang dibutuhkan, dan membantu memastikan langkah penyelesaian berikutnya.","C":"Meminta warga menenangkan diri terlebih dahulu dan melanjutkan pelayanan kepada pemohon lain sebelum kembali membahas permasalahannya.","D":"Segera meminta atasan mengambil alih karena keluhan dengan nada tinggi berpotensi berkembang menjadi konflik yang mengganggu pelayanan.","E":"Menyelesaikan permohonan berdasarkan dokumen yang tersedia agar warga tidak perlu datang kembali, kemudian menyampaikan kekurangan administrasi melalui catatan internal."},"kunci":"B","poin":{"A":2,"B":5,"C":3,"D":4,"E":1},"pembahasan":"A (2 poin): Persyaratan memang harus dipenuhi, tetapi pendekatan ini kurang menunjukkan empati dan mengabaikan kekurangan komunikasi petugas.\nB (5 poin): Menangani akar masalah, menjaga ketenangan, memberi informasi akurat, dan berorientasi pada penyelesaian.\nC (3 poin): Dapat menjaga antrean sementara, tetapi berisiko membuat warga merasa diabaikan apabila tidak disertai tindak lanjut yang jelas.\nD (4 poin): Eskalasi dapat diperlukan, tetapi petugas sebaiknya mencoba menangani keluhan sesuai kewenangannya terlebih dahulu.\nE (1 poin): Berusaha mempercepat layanan, tetapi berpotensi mengabaikan ketentuan administrasi."},{"bagian":"TKP","no":3,"soal":"Instansi Anda meluncurkan program pelayanan keliling untuk masyarakat di wilayah yang jauh dari kantor utama. Setelah satu bulan, laporan menunjukkan bahwa jumlah warga yang dilayani meningkat, tetapi banyak pemohon harus kembali karena informasi persyaratan berbeda antara petugas keliling dan petugas kantor. Pimpinan meminta Anda menyusun langkah perbaikan yang tidak sekadar meningkatkan jumlah layanan, tetapi juga menjamin kualitas hasilnya. Tindakan paling efektif adalah ....","opsi":{"A":"Menambah frekuensi pelayanan keliling dan menetapkan target jumlah pemohon harian yang lebih tinggi agar akses masyarakat semakin luas.","B":"Meminta petugas keliling menggunakan pengalaman masing-masing dalam menjelaskan persyaratan, kemudian membandingkan hasil layanan pada akhir bulan.","C":"Menyamakan panduan persyaratan, menyediakan daftar periksa, melakukan koordinasi rutin, dan mengevaluasi ketepatan informasi serta tingkat penyelesaian layanan.","D":"Mengarahkan seluruh pemohon dengan kasus rumit ke kantor utama supaya petugas keliling dapat mempertahankan produktivitas pelayanan.","E":"Meminta masyarakat membaca pengumuman resmi sebelum datang dan menjadikan ketidaklengkapan berkas sebagai tanggung jawab pemohon sepenuhnya."},"kunci":"C","poin":{"A":2,"B":3,"C":5,"D":4,"E":1},"pembahasan":"A (2 poin): Memperluas akses, tetapi memperbesar volume masalah apabila ketidakkonsistenan belum diperbaiki.\nB (3 poin): Menghasilkan pembelajaran dari pengalaman, tetapi belum menjamin standar informasi yang seragam.\nC (5 poin): Mengatasi penyebab utama melalui standardisasi, koordinasi, dan evaluasi mutu layanan.\nD (4 poin): Membantu menangani kasus kompleks, tetapi dapat membebani kantor utama dan memindahkan masalah kepada warga.\nE (1 poin): Mengalihkan tanggung jawab kepada masyarakat tanpa memperbaiki kualitas informasi internal."},{"bagian":"TKP","no":4,"soal":"Anda bertugas dalam pelayanan bantuan administrasi bagi masyarakat. Seorang pemohon mengaku memiliki hubungan dekat dengan pejabat daerah dan meminta agar berkasnya diproses lebih dahulu karena ia harus menghadiri acara penting. Berkas tersebut sebenarnya lengkap, tetapi masih ada beberapa pemohon lain yang datang lebih awal. Rekan Anda menyarankan agar permintaan tersebut dipenuhi demi menjaga hubungan baik dengan pihak yang berpengaruh. Bagaimana Anda sebaiknya bertindak?","opsi":{"A":"Memproses berkas tersebut lebih dahulu karena kelengkapannya sudah terjamin dan percepatan dapat meningkatkan citra pelayanan instansi.","B":"Menjelaskan bahwa antrean harus dijaga, tetapi memberikan pengecualian apabila pemohon dapat menunjukkan bukti hubungan kedinasan dengan pejabat terkait.","C":"Meminta persetujuan atasan sebelum mengambil keputusan, lalu mengikuti arahan pimpinan untuk menghindari risiko konflik dengan pihak berpengaruh.","D":"Menolak permintaan perlakuan khusus, menjelaskan urutan pelayanan secara sopan, dan tetap memproses berkas sesuai mekanisme yang berlaku.","E":"Menunda keputusan terhadap pemohon tersebut sampai antrean berkurang agar tidak menimbulkan kesan bahwa petugas memberikan perlakuan istimewa."},"kunci":"D","poin":{"A":2,"B":3,"C":4,"D":5,"E":1},"pembahasan":"A (2 poin): Kelengkapan berkas tidak otomatis menjadi alasan untuk mengabaikan urutan pelayanan.\nB (3 poin): Menjaga komunikasi, tetapi menjadikan hubungan dengan pejabat sebagai dasar pengecualian tidak adil.\nC (4 poin): Konsultasi dapat membantu, tetapi prinsip pelayanan yang adil seharusnya tetap menjadi pegangan.\nD (5 poin): Menjaga integritas, keadilan, kepastian prosedur, dan komunikasi yang profesional.\nE (1 poin): Menghindari konfrontasi sementara, tetapi tidak memberikan kejelasan dan dapat menimbulkan ketidakpastian."},{"bagian":"TKP","no":5,"soal":"Hasil survei kepuasan masyarakat menunjukkan bahwa petugas di unit Anda dinilai ramah, tetapi banyak warga mengeluhkan proses yang berulang dan ketidakjelasan waktu penyelesaian. Sebagian rekan berpendapat bahwa keramahan sudah cukup karena keterlambatan disebabkan oleh sistem yang bukan menjadi tanggung jawab petugas. Anda diminta menyampaikan usulan perbaikan dalam rapat evaluasi. Usulan yang paling tepat adalah ....","opsi":{"A":"Mempertahankan pendekatan ramah dan menambah petugas pada jam sibuk agar masyarakat merasakan pelayanan yang lebih nyaman.","B":"Menyampaikan bahwa kendala waktu berasal dari sistem, kemudian meminta pimpinan pusat menyelesaikannya sebelum unit melakukan perubahan.","C":"Menyusun survei kepuasan lanjutan untuk mengetahui apakah keluhan masyarakat benar-benar mewakili mayoritas pengguna layanan.","D":"Memperketat pemeriksaan dokumen sejak awal dan menolak berkas yang tidak sesuai agar proses di tahap akhir tidak mengalami keterlambatan.","E":"Memetakan tahapan yang berulang, menetapkan informasi waktu layanan yang realistis, dan mengusulkan perbaikan alur berdasarkan data keluhan."},"kunci":"E","poin":{"A":3,"B":2,"C":4,"D":1,"E":5},"pembahasan":"A (3 poin): Dapat meningkatkan kenyamanan, tetapi belum mengatasi proses yang berulang dan ketidakjelasan waktu.\nB (2 poin): Mengakui kendala sistem, tetapi terlalu pasif dan menunda perbaikan yang mungkin dapat dilakukan unit.\nC (4 poin): Menguatkan dasar pengambilan keputusan, tetapi belum memberikan langkah perbaikan langsung.\nD (1 poin): Pemeriksaan awal memang penting, tetapi penolakan tanpa perbaikan alur tidak menyelesaikan seluruh keluhan.\nE (5 poin): Menggunakan data, mencari akar masalah, meningkatkan transparansi, dan menyusun solusi yang terukur."},{"bagian":"TKP","no":6,"soal":"Dalam pelayanan perizinan, Anda menemukan bahwa sejumlah warga kurang memahami istilah teknis yang tercantum dalam formulir. Ketika petugas menjelaskan dengan bahasa sederhana, proses konsultasi menjadi lebih lama, sementara rekan kerja menganggap penjelasan rinci dapat menurunkan produktivitas. Anda perlu menentukan pendekatan yang mampu menjaga akurasi informasi sekaligus mempercepat pelayanan. Apa yang sebaiknya dilakukan?","opsi":{"A":"Menyusun penjelasan sederhana dan daftar periksa persyaratan, lalu menggunakannya secara konsisten sambil memberikan bantuan sesuai kebutuhan pemohon.","B":"Mengarahkan seluruh pemohon untuk membaca petunjuk tertulis secara mandiri agar petugas tidak perlu mengulang penjelasan yang sama.","C":"Memberikan penjelasan lengkap hanya kepada pemohon yang bertanya secara aktif, sedangkan pemohon lain dianggap telah memahami informasi tertulis.","D":"Meminta satu petugas khusus menjelaskan seluruh formulir, meskipun pembagian tugas tersebut belum disepakati dan dapat mengurangi jumlah petugas loket.","E":"Menyederhanakan formulir dengan menghapus beberapa istilah dan persyaratan teknis yang dianggap membingungkan oleh sebagian besar masyarakat."},"kunci":"A","poin":{"A":5,"B":3,"C":2,"D":4,"E":1},"pembahasan":"A (5 poin): Menggabungkan komunikasi yang mudah dipahami, konsistensi informasi, efisiensi, dan pelayanan sesuai kebutuhan.\nB (3 poin): Mengurangi pengulangan, tetapi tidak memastikan pemohon benar-benar memahami petunjuk.\nC (2 poin): Menghemat waktu, tetapi berisiko menimbulkan kesalahan akibat asumsi bahwa semua pemohon telah memahami informasi.\nD (4 poin): Spesialisasi tugas berpotensi membantu, tetapi perlu pengaturan sumber daya dan koordinasi terlebih dahulu.\nE (1 poin): Menyederhanakan bahasa dapat membantu, tetapi menghapus persyaratan teknis tanpa kewenangan dapat melanggar ketentuan."},{"bagian":"TKP","no":7,"soal":"Pada hari pertama penerapan kebijakan pelayanan baru, masyarakat menerima informasi yang berbeda dari media sosial, pengumuman kantor, dan penjelasan petugas. Antrean meningkat dan beberapa warga mulai menyampaikan protes. Anda mengetahui bahwa kebijakan tersebut baru saja diperbarui oleh instansi pusat, sementara sebagian petugas belum menerima penjelasan lengkap. Sebagai petugas pelayanan, langkah yang paling tepat adalah ....","opsi":{"A":"Mengikuti pengumuman kantor yang sudah tersedia karena informasi tertulis dianggap lebih aman daripada penjelasan yang belum seragam.","B":"Memastikan ketentuan terbaru melalui sumber resmi, mengoordinasikan informasi dengan atasan, dan menyampaikan penjelasan yang seragam kepada masyarakat.","C":"Menghentikan seluruh pelayanan yang berkaitan dengan kebijakan baru sampai semua petugas memperoleh pelatihan formal dari instansi pusat.","D":"Meminta masyarakat menunggu pengumuman berikutnya karena petugas tidak seharusnya menjelaskan kebijakan yang masih menimbulkan perbedaan informasi.","E":"Memberikan penjelasan berdasarkan informasi yang paling banyak beredar, kemudian mengoreksinya apabila instansi mengeluarkan klarifikasi resmi."},"kunci":"B","poin":{"A":3,"B":5,"C":4,"D":2,"E":1},"pembahasan":"A (3 poin): Mengutamakan informasi tertulis, tetapi belum memastikan bahwa pengumuman tersebut masih sesuai ketentuan terbaru.\nB (5 poin): Memastikan akurasi, membangun koordinasi, dan menjaga konsistensi komunikasi publik.\nC (4 poin): Menghindari kesalahan, tetapi penghentian seluruh layanan mungkin tidak diperlukan jika masih ada layanan yang dapat berjalan.\nD (2 poin): Berhati-hati, tetapi tidak proaktif mencari klarifikasi yang dibutuhkan masyarakat.\nE (1 poin): Mengandalkan informasi yang belum terverifikasi dapat memperluas kesalahan dan menurunkan kepercayaan publik."},{"bagian":"TKP","no":8,"soal":"Anda menjadi anggota tim lintas bidang yang bertugas menyusun laporan kinerja tahunan. Bidang pelayanan memiliki data jumlah pemohon, bidang keuangan memiliki data penggunaan anggaran, sedangkan bidang pengawasan mempunyai catatan kendala dan tindak lanjut. Setiap bidang menggunakan format berbeda dan sebagian anggota enggan membagikan data sebelum laporan bidangnya selesai. Tenggat penyusunan laporan tinggal lima hari. Tindakan yang paling efektif adalah ....","opsi":{"A":"Menyusun laporan berdasarkan data bidang sendiri terlebih dahulu, lalu menambahkan informasi dari bidang lain apabila mereka menyerahkannya sebelum tenggat.","B":"Meminta pimpinan menetapkan sanksi kepada bidang yang terlambat mengirim data agar semua anggota lebih disiplin dalam menyelesaikan laporan.","C":"Menetapkan format dan tenggat bersama, menyepakati definisi data, membagi tanggung jawab, serta melakukan pemeriksaan silang secara berkala.","D":"Menggabungkan seluruh dokumen yang tersedia tanpa mengubah format asli agar proses pengumpulan lebih cepat dan perbedaan dapat dibahas kemudian.","E":"Mengambil alih pengumpulan data seluruh bidang secara langsung supaya anggota tim tidak perlu menghabiskan waktu untuk berkoordinasi."},"kunci":"C","poin":{"A":2,"B":3,"C":5,"D":4,"E":1},"pembahasan":"A (2 poin): Menjaga pekerjaan sendiri tetap berjalan, tetapi berisiko menghasilkan laporan yang tidak terintegrasi.\nB (3 poin): Menegaskan tanggung jawab, tetapi pendekatan sanksi tidak menyelesaikan persoalan format dan kesepakatan data.\nC (5 poin): Menyatukan standar, tanggung jawab, dan pengawasan sehingga kolaborasi lebih terarah.\nD (4 poin): Mempercepat pengumpulan awal, tetapi perbedaan format dapat menyulitkan validasi.\nE (1 poin): Menunjukkan inisiatif, tetapi menciptakan ketergantungan dan mengurangi keterlibatan anggota tim."},{"bagian":"TKP","no":9,"soal":"Anda memperoleh informasi penting mengenai perubahan jadwal kegiatan dari unit lain. Informasi tersebut berpengaruh terhadap pekerjaan tim Anda, tetapi pengirim pesan meminta agar informasi itu tidak diteruskan sebelum ada pengumuman resmi. Sementara itu, beberapa anggota tim sedang menyusun jadwal lama yang berpotensi membuat pekerjaan mereka sia-sia. Anda harus menjaga kepercayaan sumber informasi sekaligus menghindari kesalahan kerja. Apa yang paling tepat dilakukan?","opsi":{"A":"Meneruskan pesan tersebut ke seluruh anggota tim dengan catatan bahwa informasi masih sementara agar mereka dapat segera mengubah rencana.","B":"Menyimpan informasi sampai pengumuman resmi diterbitkan, sekalipun tim tetap bekerja menggunakan jadwal yang mungkin sudah tidak berlaku.","C":"Menyampaikan informasi hanya kepada anggota yang pekerjaannya paling terdampak, tanpa menjelaskan bahwa informasi tersebut belum dapat dikonfirmasi.","D":"Menghubungi pengirim untuk meminta izin menyampaikan peringatan terbatas, sekaligus mengonfirmasi kepada pihak berwenang tentang perubahan yang berpotensi memengaruhi pekerjaan.","E":"Mengubah jadwal kerja tim berdasarkan perkiraan pribadi dan baru memberi tahu anggota lain setelah perubahan tersebut terbukti benar."},"kunci":"D","poin":{"A":3,"B":2,"C":4,"D":5,"E":1},"pembahasan":"A (3 poin): Mencegah anggota tim terus menggunakan rencana lama, tetapi berisiko menyebarkan informasi yang belum diizinkan.\nB (2 poin): Menjaga kerahasiaan, tetapi mengabaikan risiko pekerjaan yang sedang berjalan.\nC (4 poin): Membatasi penyebaran, tetapi kurang transparan mengenai status informasi dan dasar penggunaannya.\nD (5 poin): Menghormati kepercayaan, mencari izin, melakukan verifikasi, dan mencegah dampak kesalahan.\nE (1 poin): Mengambil keputusan tanpa dasar yang cukup dan tidak melibatkan anggota yang terdampak."},{"bagian":"TKP","no":10,"soal":"Dalam sebuah proyek peningkatan layanan, tim Anda terdiri atas pegawai administrasi, petugas lapangan, analis data, dan staf komunikasi. Masing-masing memiliki pandangan berbeda mengenai prioritas perbaikan. Petugas lapangan mengutamakan kemudahan masyarakat, analis data mengutamakan ketepatan indikator, sedangkan staf komunikasi ingin hasil proyek cepat dipublikasikan. Rapat telah berlangsung berulang kali tanpa keputusan karena setiap anggota mempertahankan sudut pandangnya. Langkah terbaik adalah ....","opsi":{"A":"Meminta pimpinan memilih satu usulan yang paling realistis agar rapat segera berakhir dan pelaksanaan proyek tidak semakin tertunda.","B":"Mengikuti usulan analis data karena keputusan berbasis angka lebih objektif dibandingkan pendapat anggota yang berhadapan langsung dengan masyarakat.","C":"Menjalankan seluruh usulan secara bersamaan dalam skala kecil sehingga setiap anggota merasa pendapatnya diakomodasi tanpa perlu menentukan prioritas.","D":"Menyerahkan perbedaan pendapat kepada koordinator proyek dan menunggu keputusan final sebelum anggota melanjutkan pekerjaan masing-masing.","E":"Menyepakati tujuan bersama, membandingkan usulan berdasarkan dampak, biaya, risiko, dan kebutuhan pengguna, lalu menetapkan prioritas serta indikator keberhasilan."},"kunci":"E","poin":{"A":3,"B":2,"C":4,"D":1,"E":5},"pembahasan":"A (3 poin): Mempercepat keputusan, tetapi berpotensi mengabaikan analisis dan komitmen anggota.\nB (2 poin): Memanfaatkan data, tetapi mengabaikan pengalaman lapangan dan kebutuhan komunikasi.\nC (4 poin): Mengakomodasi ide, tetapi berpotensi menyebarkan sumber daya terlalu tipis.\nD (1 poin): Menjaga kewenangan koordinator, tetapi memperpanjang ketergantungan dan menunda kontribusi anggota.\nE (5 poin): Mengubah perbedaan menjadi analisis terstruktur dan keputusan kolaboratif yang terukur."},{"bagian":"TKP","no":11,"soal":"Seorang rekan dari unit lain meminta bantuan memahami data yang diperlukan untuk menyelesaikan pekerjaannya. Anda memiliki pengalaman menggunakan data tersebut, tetapi sedang menyelesaikan tugas yang juga memiliki tenggat dekat. Jika Anda membantu terlalu lama, pekerjaan sendiri dapat tertunda. Jika menolak, pekerjaan rekan tersebut mungkin tidak selesai tepat waktu dan berdampak pada tim yang lebih besar. Tindakan yang paling tepat adalah ....","opsi":{"A":"Menilai urgensi kedua pekerjaan, memberikan panduan inti yang dibutuhkan, dan menyepakati bantuan lanjutan yang realistis tanpa mengabaikan tanggung jawab sendiri.","B":"Menyelesaikan pekerjaan sendiri terlebih dahulu, kemudian membantu rekan apabila masih tersedia waktu sebelum tenggatnya berakhir.","C":"Mengambil alih seluruh pekerjaan rekan agar hasilnya terjamin, meskipun pekerjaan utama Anda harus diselesaikan setelah jam kerja.","D":"Mengarahkan rekan membaca dokumentasi yang tersedia dan meminta ia mencoba kembali sendiri agar kemampuan mandirinya berkembang.","E":"Meminta atasan memutuskan pembagian pekerjaan karena membantu unit lain tanpa penugasan formal berpotensi mengganggu target unit Anda."},"kunci":"A","poin":{"A":5,"B":3,"C":2,"D":4,"E":1},"pembahasan":"A (5 poin): Menyeimbangkan kolaborasi, prioritas, pengelolaan waktu, dan akuntabilitas.\nB (3 poin): Melindungi tugas utama, tetapi tidak mempertimbangkan urgensi dampak pekerjaan rekan.\nC (2 poin): Membantu rekan secara maksimal, tetapi mengorbankan tanggung jawab sendiri dan berisiko menimbulkan beban berlebihan.\nD (4 poin): Mendorong kemandirian, tetapi belum tentu cukup untuk mengatasi kebutuhan yang mendesak.\nE (1 poin): Konsultasi dapat diperlukan, tetapi terlalu cepat mengalihkan persoalan yang masih dapat dikoordinasikan langsung."},{"bagian":"TKP","no":12,"soal":"Anda menjadi penghubung antara instansi dan organisasi masyarakat dalam kegiatan edukasi publik. Pada tahap persiapan, organisasi tersebut menawarkan tenaga sukarelawan dan fasilitas yang dapat menekan biaya kegiatan. Namun, mereka meminta agar logo organisasinya ditempatkan paling menonjol dan materi kegiatan memuat promosi produk tertentu. Permintaan tersebut belum tentu sesuai dengan tujuan kegiatan dan aturan instansi. Apa langkah terbaik?","opsi":{"A":"Menerima seluruh dukungan karena penghematan anggaran dan tambahan tenaga akan membantu kegiatan terlaksana tepat waktu.","B":"Menjelaskan batas kerja sama, memeriksa kesesuaian dukungan dengan aturan, dan merundingkan bentuk pengakuan yang wajar tanpa mengganggu independensi kegiatan.","C":"Menolak seluruh tawaran agar instansi terhindar dari potensi konflik kepentingan, meskipun fasilitas dan tenaga yang ditawarkan sebenarnya bermanfaat.","D":"Menyetujui pencantuman logo, tetapi menghapus promosi produk setelah kegiatan berlangsung agar kerja sama tetap terjaga.","E":"Meminta organisasi masyarakat membuat proposal baru tanpa memberi penjelasan mengenai bagian permintaan yang perlu disesuaikan dengan aturan instansi."},"kunci":"B","poin":{"A":2,"B":5,"C":3,"D":1,"E":4},"pembahasan":"A (2 poin): Menghemat sumber daya, tetapi mengabaikan potensi konflik kepentingan dan independensi kegiatan.\nB (5 poin): Menjaga kemitraan secara transparan, mematuhi aturan, dan mencari solusi yang saling menguntungkan.\nC (3 poin): Menghindari risiko, tetapi terlalu cepat menutup peluang kolaborasi yang sebenarnya dapat dikelola.\nD (1 poin): Menunda penyelesaian masalah dan berpotensi menimbulkan pelanggaran komitmen kepada mitra.\nE (4 poin): Meminta revisi merupakan langkah yang masuk akal, tetapi alasan dan batasannya perlu dijelaskan agar mitra dapat memperbaiki proposal secara tepat."},{"bagian":"TKP","no":13,"soal":"Tim Anda mengembangkan sistem pendataan yang membutuhkan masukan dari beberapa unit. Setelah prototipe selesai, satu unit menyampaikan bahwa sistem tersebut tidak sesuai dengan alur kerja mereka. Unit lain menganggap perubahan sudah terlambat karena jadwal peluncuran tinggal dua minggu. Anda mengetahui bahwa masalah tersebut muncul karena unit terkait tidak dilibatkan secara memadai sejak awal. Apa tindakan yang paling tepat?","opsi":{"A":"Mempertahankan prototipe dan memberikan pelatihan tambahan agar unit yang keberatan dapat menyesuaikan diri dengan sistem baru.","B":"Menunda seluruh peluncuran sampai semua unit mencapai kesepakatan menyeluruh, tanpa menetapkan batas waktu baru untuk proses penyempurnaan.","C":"Mengadakan pembahasan terfokus dengan unit terdampak, memetakan kebutuhan kritis, menilai dampak perubahan, dan menyepakati revisi yang layak sebelum peluncuran.","D":"Meminta unit yang keberatan menyusun sistem alternatif sendiri agar tim pengembang dapat fokus menyelesaikan peluncuran sesuai jadwal awal.","E":"Meluncurkan sistem sesuai rencana dan menampung kritik setelah digunakan agar keputusan perbaikan didasarkan pada pengalaman nyata."},"kunci":"C","poin":{"A":3,"B":2,"C":5,"D":1,"E":4},"pembahasan":"A (3 poin): Mendukung adaptasi, tetapi menganggap masalah hanya berasal dari pengguna, bukan dari desain sistem.\nB (2 poin): Mengutamakan kesepakatan, tetapi tidak mengelola waktu dan prioritas perubahan secara efektif.\nC (5 poin): Memperbaiki keterlibatan pemangku kepentingan dengan tetap mengendalikan risiko dan jadwal.\nD (1 poin): Memisahkan pekerjaan, tetapi melemahkan kolaborasi dan dapat menghasilkan sistem yang tidak terintegrasi.\nE (4 poin): Pengujian nyata bermanfaat, tetapi meluncurkan sistem dengan masalah kritis yang belum ditangani dapat merugikan pengguna."},{"bagian":"TKP","no":14,"soal":"Dalam penyusunan program lintas instansi, Anda mengetahui bahwa data dari salah satu mitra belum diperbarui. Data tersebut akan memengaruhi penentuan sasaran program dan pembagian anggaran. Mitra beralasan bahwa pembaruan belum selesai karena pergantian petugas, sedangkan pimpinan Anda meminta rancangan program segera diselesaikan. Bagaimana Anda sebaiknya bertindak?","opsi":{"A":"Menggunakan data lama karena masih merupakan data resmi, kemudian menyesuaikan sasaran apabila mitra telah mengirimkan data baru.","B":"Menghapus komponen program yang bergantung pada data mitra agar rancangan dapat diselesaikan tanpa menunggu informasi tambahan.","C":"Menetapkan sasaran berdasarkan perkiraan tim sendiri dan mencatat bahwa angka tersebut dapat diperbarui ketika data mitra tersedia.","D":"Menyepakati tenggat pembaruan dengan mitra, mengidentifikasi data minimum yang dibutuhkan, dan menyusun rancangan sementara dengan penandaan ketidakpastian yang jelas.","E":"Menunda seluruh rancangan program sampai mitra menyelesaikan pembaruan agar tidak ada keputusan yang dibuat berdasarkan data yang belum lengkap."},"kunci":"D","poin":{"A":3,"B":2,"C":4,"D":5,"E":1},"pembahasan":"A (3 poin): Menggunakan sumber resmi, tetapi data lama dapat menghasilkan sasaran yang tidak lagi relevan.\nB (2 poin): Mempercepat penyusunan, tetapi dapat menghilangkan komponen program yang penting.\nC (4 poin): Menjaga pekerjaan tetap berjalan, tetapi perkiraan internal harus memiliki dasar dan batas penggunaan yang jelas.\nD (5 poin): Menjaga kolaborasi dan ketepatan keputusan sekaligus memungkinkan pekerjaan berlanjut secara terkendali.\nE (1 poin): Menghindari risiko data, tetapi tidak mencari cara untuk memajukan pekerjaan sambil menunggu."},{"bagian":"TKP","no":15,"soal":"Anda bekerja dalam tim yang memiliki anggota berpengalaman dan anggota baru. Seorang anggota senior sering memberikan informasi penting hanya kepada rekan yang dianggap dekat dengannya. Akibatnya, anggota lain terlambat mengetahui perubahan prosedur dan beberapa pekerjaan harus diulang. Ketika ditegur secara informal, ia menyatakan bahwa informasi tersebut sebenarnya bisa dicari sendiri oleh setiap pegawai. Tindakan terbaik adalah ....","opsi":{"A":"Meminta anggota yang tertinggal meningkatkan inisiatif membaca dokumen agar tidak terlalu bergantung pada informasi dari rekan senior.","B":"Melaporkan perilaku senior kepada pimpinan dan meminta agar seluruh komunikasi pekerjaan selanjutnya dilakukan melalui jalur formal.","C":"Membuat kelompok komunikasi terpisah bagi anggota baru sehingga mereka dapat saling membantu memahami informasi yang tidak dibagikan oleh senior.","D":"Mengambil alih penyebaran informasi sendiri agar seluruh anggota memperoleh pembaruan tanpa perlu membahas perilaku senior tersebut.","E":"Mengusulkan saluran informasi bersama, aturan pencatatan perubahan, dan kebiasaan berbagi pengetahuan yang dapat dipantau oleh seluruh tim."},"kunci":"E","poin":{"A":2,"B":4,"C":1,"D":3,"E":5},"pembahasan":"A (2 poin): Mendorong kemandirian, tetapi mengabaikan tanggung jawab bersama untuk berbagi informasi kerja.\nB (4 poin): Eskalasi dapat diperlukan jika masalah berlanjut, tetapi perubahan sistem komunikasi perlu dirancang secara proporsional.\nC (1 poin): Membantu anggota baru, tetapi menciptakan kelompok terpisah dan berpotensi memperbesar fragmentasi informasi.\nD (3 poin): Menutup kesenjangan informasi sementara, tetapi terlalu bergantung pada satu orang dan tidak memperbaiki budaya tim.\nE (5 poin): Membangun sistem berbagi informasi yang transparan, konsisten, dan berkelanjutan."},{"bagian":"TKP","no":16,"soal":"Anda ditugaskan menjadi koordinator kegiatan pelayanan masyarakat di wilayah yang dihuni oleh penduduk dengan latar belakang bahasa, adat, agama, dan tingkat pendidikan yang beragam. Dalam rapat persiapan, beberapa anggota tim mengusulkan agar seluruh kegiatan menggunakan satu pola komunikasi yang sama demi efisiensi. Namun, hasil observasi menunjukkan bahwa sebagian warga kurang memahami istilah resmi, sedangkan sebagian lainnya memiliki kebiasaan sosial yang berbeda dalam menyampaikan pendapat. Anda harus memastikan seluruh warga dapat berpartisipasi tanpa mengurangi standar pelayanan. Apa tindakan terbaik?","opsi":{"A":"Menyesuaikan cara komunikasi dengan kebutuhan warga, menggunakan bahasa yang mudah dipahami, dan memastikan informasi inti tetap sama bagi seluruh kelompok.","B":"Menggunakan format komunikasi resmi secara seragam karena perlakuan yang sama kepada semua warga merupakan bentuk keadilan pelayanan.","C":"Menyerahkan penyampaian informasi kepada tokoh masyarakat setempat sepenuhnya agar petugas tidak melakukan kesalahan dalam memahami adat dan kebiasaan warga.","D":"Mengutamakan kelompok yang paling mudah memahami informasi terlebih dahulu, kemudian memberikan penjelasan tambahan kepada kelompok lain jika waktu masih tersedia.","E":"Membagi kegiatan berdasarkan kelompok sosial dan budaya agar setiap kelompok memperoleh penjelasan sesuai kebiasaan masing-masing tanpa perlu berinteraksi langsung dengan kelompok lain."},"kunci":"A","poin":{"A":5,"B":3,"C":4,"D":2,"E":1},"pembahasan":"A (5 poin): Menjamin kesetaraan akses melalui komunikasi adaptif tanpa mengubah substansi informasi resmi.\nB (3 poin): Menjaga konsistensi, tetapi perlakuan seragam belum tentu menghasilkan akses yang setara.\nC (4 poin): Melibatkan tokoh masyarakat bermanfaat, tetapi tanggung jawab pelayanan tidak boleh dialihkan sepenuhnya.\nD (2 poin): Mempertimbangkan keterbatasan waktu, tetapi dapat mengurangi kesempatan kelompok tertentu memperoleh layanan.\nE (1 poin): Mengakomodasi perbedaan, tetapi berpotensi memperkuat pemisahan antarkelompok."},{"bagian":"TKP","no":17,"soal":"Dalam sebuah forum pelayanan publik, seorang warga menyampaikan kritik dengan gaya bicara yang dianggap kurang sopan oleh sebagian peserta. Setelah ditelusuri, cara penyampaian tersebut dipengaruhi oleh kebiasaan komunikasi di lingkungan asalnya, bukan dimaksudkan untuk merendahkan petugas. Beberapa rekan meminta Anda menghentikan pembicaraan warga tersebut agar forum tetap tertib. Anda perlu menjaga suasana diskusi sekaligus menghormati keberagaman. Apa tindakan paling tepat?","opsi":{"A":"Mengingatkan warga di hadapan peserta lain bahwa forum resmi memiliki tata krama yang harus dipatuhi semua pihak tanpa pengecualian.","B":"Mengarahkan diskusi dengan tenang, menetapkan aturan komunikasi yang berlaku bagi semua peserta, dan memastikan kritik tetap memperoleh ruang untuk dibahas.","C":"Membiarkan cara komunikasi tersebut selama warga menyampaikan masalah yang benar-benar penting bagi pelayanan masyarakat.","D":"Meminta tokoh masyarakat yang mendampingi warga untuk menegur orang tersebut secara pribadi agar petugas tidak terlibat dalam persoalan budaya.","E":"Menghentikan sementara forum dan meminta warga menyampaikan kritik secara tertulis agar tidak terjadi perbedaan penafsiran dalam komunikasi langsung."},"kunci":"B","poin":{"A":3,"B":5,"C":4,"D":2,"E":1},"pembahasan":"A (3 poin): Menegaskan tata tertib, tetapi teguran di depan umum dapat mempermalukan warga dan memperburuk situasi.\nB (5 poin): Menjaga ketertiban, menghormati keberagaman, dan memastikan substansi kritik tetap ditangani.\nC (4 poin): Memberikan ruang partisipasi, tetapi berisiko membiarkan komunikasi yang mengganggu peserta lain.\nD (2 poin): Memanfaatkan dukungan tokoh masyarakat, tetapi mengalihkan tanggung jawab fasilitasi kepada pihak lain.\nE (1 poin): Mengurangi risiko konflik sesaat, tetapi membatasi dialog dan tidak menyelesaikan masalah komunikasi."},{"bagian":"TKP","no":18,"soal":"Anda menjadi bagian dari tim yang menyelenggarakan program pemberdayaan ekonomi bagi masyarakat majemuk. Dalam proses penentuan peserta, muncul usulan untuk memprioritaskan kelompok yang selama ini paling aktif menghadiri kegiatan pemerintah karena dianggap lebih mudah diajak bekerja sama. Namun, Anda menemukan bahwa beberapa kelompok lain justru memiliki keterbatasan akses informasi dan transportasi sehingga jarang hadir dalam kegiatan sebelumnya. Program memiliki kuota terbatas dan harus menggunakan kriteria yang dapat dipertanggungjawabkan. Tindakan yang paling tepat adalah ....","opsi":{"A":"Mengutamakan warga yang paling aktif karena rekam jejak partisipasi dapat menjadi indikator kesiapan mengikuti program pemberdayaan.","B":"Membagi kuota secara sama rata untuk setiap kelompok sosial agar tidak ada kelompok yang merasa diperlakukan berbeda.","C":"Menetapkan kriteria berdasarkan kebutuhan, manfaat program, dan persyaratan yang relevan, kemudian membuka proses seleksi secara transparan bagi seluruh kelompok.","D":"Meminta masing-masing tokoh kelompok memilih peserta yang dianggap paling layak, kemudian menerima hasilnya untuk menjaga hubungan sosial.","E":"Memprioritaskan kelompok yang belum pernah mengikuti program pemerintah tanpa menilai kembali kebutuhan individu agar kesempatan pemerataan dapat segera tercapai."},"kunci":"C","poin":{"A":2,"B":4,"C":5,"D":3,"E":1},"pembahasan":"A (2 poin): Mempertimbangkan partisipasi, tetapi dapat menguntungkan kelompok yang sejak awal memiliki akses lebih baik.\nB (4 poin): Mengurangi dominasi kelompok tertentu, tetapi pembagian sama rata belum tentu sesuai dengan perbedaan kebutuhan.\nC (5 poin): Menggabungkan keadilan, inklusivitas, relevansi kebutuhan, dan akuntabilitas seleksi.\nD (3 poin): Memperkuat hubungan lokal, tetapi berisiko menimbulkan konflik kepentingan dan kriteria yang tidak seragam.\nE (1 poin): Mendorong pemerataan, tetapi mengabaikan penilaian kebutuhan dan kelayakan peserta."},{"bagian":"TKP","no":19,"soal":"Pada kegiatan pelayanan terpadu, Anda mendengar komentar seorang rekan yang menggeneralisasi bahwa warga dari kelompok budaya tertentu cenderung sulit mematuhi prosedur. Komentar itu muncul setelah beberapa pemohon dari wilayah tersebut datang dengan dokumen tidak lengkap. Anda mengetahui bahwa informasi persyaratan di wilayah itu memang belum tersosialisasi dengan baik. Anda ingin menjaga profesionalisme tim tanpa membiarkan prasangka memengaruhi keputusan pelayanan. Bagaimana sebaiknya Anda bertindak?","opsi":{"A":"Menegur rekan secara keras di hadapan tim agar komentar serupa tidak terulang dan seluruh petugas memahami pentingnya menghormati perbedaan.","B":"Mengabaikan komentar tersebut karena hanya berupa percakapan informal dan tidak secara langsung mengubah keputusan administrasi.","C":"Meminta warga dari wilayah tersebut melengkapi seluruh dokumen sebelum memperoleh penjelasan lebih lanjut agar petugas tidak dianggap memberikan perlakuan khusus.","D":"Mengingatkan rekan secara profesional agar penilaian didasarkan pada perilaku dan fakta individual, sekaligus memperbaiki sosialisasi persyaratan di wilayah tersebut.","E":"Meminta pimpinan memindahkan rekan ke unit lain agar potensi prasangka tidak memengaruhi pelayanan terhadap kelompok masyarakat tersebut."},"kunci":"D","poin":{"A":3,"B":1,"C":2,"D":5,"E":4},"pembahasan":"A (3 poin): Menunjukkan penolakan terhadap prasangka, tetapi cara konfrontatif dapat memicu konflik dan menghambat dialog.\nB (1 poin): Membiarkan generalisasi yang dapat berkembang menjadi bias dalam keputusan pelayanan.\nC (2 poin): Menegakkan kelengkapan dokumen, tetapi tidak mengatasi kesenjangan informasi yang telah diketahui.\nD (5 poin): Mengoreksi bias berdasarkan fakta sekaligus memperbaiki penyebab masalah secara sistematis.\nE (4 poin): Dapat dipertimbangkan jika terdapat pelanggaran berulang, tetapi pemindahan bukan langkah awal yang paling proporsional."},{"bagian":"TKP","no":20,"soal":"Instansi Anda mengadakan kegiatan konsultasi publik mengenai pembangunan fasilitas umum. Dalam forum tersebut, kelompok masyarakat yang memiliki kemampuan berbicara lebih baik mendominasi diskusi, sedangkan warga lanjut usia, penyandang disabilitas, dan warga yang kurang terbiasa mengikuti rapat formal jarang menyampaikan pendapat. Beberapa anggota panitia menganggap situasi itu wajar karena semua peserta sebenarnya memiliki kesempatan berbicara. Anda diminta mengevaluasi kualitas partisipasi masyarakat. Tindakan terbaik adalah ....","opsi":{"A":"Memberikan waktu berbicara tambahan kepada kelompok yang belum menyampaikan pendapat tanpa mengubah format forum yang telah direncanakan.","B":"Membuka sesi tanya jawab lebih lama agar peserta yang belum berbicara memiliki kesempatan mengajukan pertanyaan ketika merasa siap.","C":"Menunjuk perwakilan dari setiap kelompok sosial untuk berbicara sehingga forum tetap singkat dan semua kelompok dapat dianggap terwakili.","D":"Mengumpulkan masukan tertulis setelah forum dan menjadikan hasilnya sebagai bahan evaluasi, tanpa mengubah pelaksanaan konsultasi yang telah berlangsung.","E":"Menyediakan beberapa cara partisipasi yang aksesibel, memfasilitasi giliran bicara secara adil, dan memastikan setiap masukan dipertimbangkan dalam keputusan."},"kunci":"E","poin":{"A":3,"B":2,"C":4,"D":1,"E":5},"pembahasan":"A (3 poin): Memberikan kesempatan tambahan, tetapi belum tentu mengatasi hambatan komunikasi atau aksesibilitas.\nB (2 poin): Memperpanjang waktu, tetapi dominasi peserta tertentu masih mungkin terjadi.\nC (4 poin): Memperluas keterwakilan, tetapi pemilihan perwakilan harus memastikan mereka benar-benar membawa aspirasi kelompok.\nD (1 poin): Mengumpulkan informasi tambahan, tetapi tidak memperbaiki ketimpangan partisipasi dalam forum.\nE (5 poin): Menciptakan partisipasi yang substantif, aksesibel, dan berpengaruh terhadap keputusan."},{"bagian":"TKP","no":21,"soal":"Anda ditugaskan membantu menyelesaikan perbedaan pendapat antara dua kelompok warga mengenai penggunaan fasilitas umum. Kelompok pertama ingin menggunakan fasilitas pada waktu tertentu untuk kegiatan adat, sedangkan kelompok kedua memerlukan fasilitas yang sama untuk kegiatan sosial rutin. Kedua pihak menganggap kebutuhannya lebih penting dan mulai menyampaikan keberatan melalui saluran komunikasi masing-masing. Pemerintah setempat meminta Anda membantu menemukan penyelesaian yang adil tanpa memihak salah satu kelompok. Apa langkah terbaik?","opsi":{"A":"Memfasilitasi dialog berdasarkan kebutuhan, aturan penggunaan fasilitas, dan alternatif jadwal, kemudian menyepakati pengaturan yang adil serta dapat dievaluasi.","B":"Memberikan prioritas kepada kegiatan adat karena memiliki nilai budaya yang perlu dijaga oleh pemerintah dalam kehidupan masyarakat.","C":"Mempertahankan jadwal penggunaan yang sudah berlaku agar petugas tidak dianggap mengubah aturan akibat tekanan dari kelompok masyarakat.","D":"Meminta kedua kelompok menggunakan fasilitas secara bergantian berdasarkan urutan pengajuan permohonan, tanpa membahas kebutuhan khusus yang mereka sampaikan.","E":"Menyerahkan keputusan kepada tokoh masyarakat yang paling dihormati agar hasilnya lebih mudah diterima oleh seluruh warga."},"kunci":"A","poin":{"A":5,"B":3,"C":2,"D":4,"E":1},"pembahasan":"A (5 poin): Mengutamakan dialog, keadilan prosedural, kebutuhan nyata, dan kesepakatan yang dapat ditinjau kembali.\nB (3 poin): Menghormati nilai budaya, tetapi dapat mengabaikan kebutuhan sah kelompok lain.\nC (2 poin): Menjaga konsistensi, tetapi aturan yang ada mungkin belum menyelesaikan benturan kebutuhan.\nD (4 poin): Memberikan mekanisme yang objektif, tetapi kurang mempertimbangkan karakteristik kebutuhan masing-masing pihak.\nE (1 poin): Memanfaatkan pengaruh sosial, tetapi berisiko menghasilkan keputusan yang tidak transparan atau tidak mewakili semua pihak."},{"bagian":"TKP","no":22,"soal":"Anda menjadi anggota tim yang mengadakan pelatihan pelayanan bagi masyarakat dengan latar belakang pendidikan yang beragam. Evaluasi menunjukkan bahwa materi presentasi dipahami oleh peserta yang terbiasa menggunakan istilah teknis, tetapi kurang dipahami peserta lain. Sebagian panitia mengusulkan agar materi tetap dipertahankan karena standar informasi harus sama, sedangkan sebagian lain ingin mengurangi isi materi secara drastis agar lebih mudah dimengerti. Anda harus memilih langkah yang menjaga ketepatan isi sekaligus meningkatkan pemahaman. Apa tindakan paling tepat?","opsi":{"A":"Mempertahankan seluruh materi dan memberikan waktu membaca lebih lama agar peserta dapat memahami istilah teknis secara mandiri.","B":"Menyajikan materi dengan bahasa sederhana, contoh yang dekat dengan pengalaman peserta, dan pemeriksaan pemahaman tanpa mengubah substansi penting.","C":"Menghapus bagian materi yang paling sulit dipahami dan hanya menyampaikan informasi praktis yang dapat langsung digunakan peserta.","D":"Membagi peserta berdasarkan tingkat pendidikan agar setiap kelompok memperoleh penjelasan yang sesuai dengan kemampuan masing-masing.","E":"Meminta peserta yang lebih memahami materi membantu peserta lain, sehingga pelatih dapat menyelesaikan seluruh agenda sesuai jadwal."},"kunci":"B","poin":{"A":3,"B":5,"C":2,"D":4,"E":1},"pembahasan":"A (3 poin): Menjaga materi tetap utuh, tetapi tidak menyesuaikan metode dengan kebutuhan peserta.\nB (5 poin): Meningkatkan aksesibilitas dan pemahaman dengan tetap menjaga akurasi informasi.\nC (2 poin): Memudahkan penyampaian, tetapi berisiko menghilangkan informasi penting.\nD (4 poin): Memungkinkan diferensiasi, tetapi dapat menimbulkan pengelompokan yang tidak perlu jika metode alternatif cukup.\nE (1 poin): Memanfaatkan dukungan sesama peserta, tetapi dapat menambah beban peserta tertentu dan tidak menjamin pemahaman yang benar."},{"bagian":"TKP","no":23,"soal":"Instansi Anda menggunakan aplikasi bersama untuk mencatat perkembangan pekerjaan. Dalam evaluasi bulanan, ditemukan bahwa sebagian pegawai mengisi data mendekati tenggat, beberapa menggunakan format berbeda, dan sebagian lainnya masih menyimpan informasi utama di perangkat pribadi. Akibatnya, pimpinan sulit memperoleh gambaran kinerja yang akurat. Anda diminta membantu memperbaiki penggunaan aplikasi tanpa menghambat pekerjaan rutin. Langkah yang paling efektif adalah ....","opsi":{"A":"Mewajibkan semua pegawai memasukkan data setiap hari dan memberikan teguran kepada pegawai yang tidak mematuhi jadwal pengisian.","B":"Mengadakan pelatihan penggunaan aplikasi satu kali, kemudian menyerahkan tanggung jawab konsistensi data kepada masing-masing pegawai.","C":"Mengganti aplikasi dengan perangkat lunak lain yang lebih modern agar pegawai terdorong meninggalkan kebiasaan pencatatan manual.","D":"Menetapkan standar pengisian, jadwal pembaruan, hak akses, dan pemeriksaan kualitas data, disertai pendampingan bagi pengguna yang membutuhkan.","E":"Memusatkan pengisian data pada satu administrator agar format tetap seragam dan pegawai lain dapat berfokus pada tugas utama."},"kunci":"D","poin":{"A":3,"B":2,"C":1,"D":5,"E":4},"pembahasan":"A (3 poin): Meningkatkan disiplin, tetapi belum memperbaiki perbedaan format dan hambatan penggunaan.\nB (2 poin): Memberikan keterampilan dasar, tetapi tidak menyediakan pemantauan dan dukungan berkelanjutan.\nC (1 poin): Mengganti teknologi tanpa analisis akar masalah dapat menambah biaya dan masa adaptasi.\nD (5 poin): Mengintegrasikan standar, tata kelola, pengawasan, dan pengembangan kompetensi pengguna.\nE (4 poin): Menjaga konsistensi, tetapi menciptakan ketergantungan pada satu administrator dan memperlambat pembaruan."},{"bagian":"TKP","no":24,"soal":"Anda menerima surel yang mengatasnamakan pimpinan instansi dan meminta daftar data pegawai dikirimkan segera ke alamat surel yang belum pernah digunakan sebelumnya. Pesan tersebut menyebutkan bahwa permintaan bersifat rahasia dan keterlambatan akan memengaruhi penilaian kinerja Anda. Nama pengirim tampak benar, tetapi alamat surel memiliki perbedaan kecil dari alamat resmi. Rekan kerja menyarankan agar data segera dikirim karena permintaan datang dari pimpinan. Apa tindakan paling tepat?","opsi":{"A":"Membalas surel untuk meminta konfirmasi tambahan dan mengirimkan data setelah pengirim memberikan penjelasan mengenai urgensi permintaan.","B":"Mengirimkan sebagian data yang dianggap tidak terlalu sensitif terlebih dahulu agar pimpinan memperoleh informasi awal tanpa menunggu lama.","C":"Memeriksa identitas pengirim melalui saluran resmi, tidak membuka lampiran atau tautan mencurigakan, dan melaporkan indikasi penipuan sesuai prosedur.","D":"Meneruskan surel kepada rekan yang memahami teknologi agar ia menilai apakah pesan tersebut aman sebelum Anda mengambil keputusan.","E":"Menghapus surel tanpa melaporkannya karena mengabaikan pesan yang mencurigakan merupakan cara tercepat menghindari risiko keamanan."},"kunci":"C","poin":{"A":3,"B":2,"C":5,"D":4,"E":1},"pembahasan":"A (3 poin): Meminta konfirmasi, tetapi membalas ke alamat mencurigakan dapat menimbulkan risiko tambahan dan belum memverifikasi identitas secara independen.\nB (2 poin): Membatasi jumlah data, tetapi tetap berisiko mengungkapkan informasi kepada pihak yang tidak berwenang.\nC (5 poin): Melindungi data, memverifikasi melalui saluran tepercaya, dan mengikuti prosedur pelaporan insiden.\nD (4 poin): Memanfaatkan keahlian rekan, tetapi verifikasi perlu dilakukan melalui jalur resmi dan penanganan keamanan yang ditetapkan.\nE (1 poin): Menghindari interaksi dengan pesan, tetapi menghilangkan kesempatan pelaporan ancaman kepada pihak terkait."},{"bagian":"TKP","no":25,"soal":"Anda bertanggung jawab membantu digitalisasi arsip pelayanan. Beberapa pegawai ingin memindai semua dokumen sekaligus agar target digitalisasi cepat tercapai, sedangkan dokumen tersebut memuat data pribadi dan sebagian masih diperlukan dalam proses administrasi aktif. Kapasitas penyimpanan terbatas dan belum semua pegawai memahami aturan akses dokumen. Anda diminta mengusulkan strategi yang efektif, aman, dan dapat dipertanggungjawabkan. Pilihan terbaik adalah ....","opsi":{"A":"Memindai seluruh arsip berdasarkan urutan rak dan menyimpannya pada folder bersama agar semua pegawai dapat mencari dokumen dengan cepat.","B":"Memprioritaskan dokumen yang paling sering digunakan dan memberikan akses kepada seluruh pegawai supaya proses kerja tidak terhambat oleh permintaan izin.","C":"Menghentikan digitalisasi sampai instansi membeli kapasitas penyimpanan tambahan dan seluruh pegawai mengikuti pelatihan keamanan data.","D":"Menugaskan pegawai senior memilih dokumen yang akan dipindai dan menyimpan salinannya di perangkat masing-masing untuk mengurangi beban server.","E":"Memetakan prioritas arsip, menetapkan hak akses sesuai kebutuhan tugas, membuat cadangan terkelola, dan menjaga ketentuan retensi serta perlindungan data."},"kunci":"E","poin":{"A":2,"B":3,"C":4,"D":1,"E":5},"pembahasan":"A (2 poin): Mempercepat pemindaian, tetapi akses terlalu luas meningkatkan risiko kebocoran data.\nB (3 poin): Mengutamakan dokumen penting, tetapi pemberian akses tanpa pembatasan tidak sesuai prinsip keamanan.\nC (4 poin): Mengakui kebutuhan infrastruktur dan kompetensi, tetapi penghentian total belum tentu diperlukan jika tahapan aman dapat dimulai.\nD (1 poin): Mengurangi beban server, tetapi penyimpanan pada perangkat pribadi meningkatkan risiko kehilangan dan kebocoran.\nE (5 poin): Menyeimbangkan efisiensi digitalisasi, keamanan, ketersediaan, dan tata kelola arsip."},{"bagian":"TKP","no":26,"soal":"Dalam pelaksanaan pelayanan daring, beberapa masyarakat mengeluhkan bahwa formulir elektronik sulit diakses melalui telepon genggam dengan koneksi internet terbatas. Tim teknis berpendapat bahwa aplikasi telah berfungsi sesuai spesifikasi, sehingga masalah dianggap berasal dari perangkat pengguna. Anda mengetahui bahwa sebagian besar masyarakat memang mengakses layanan melalui telepon genggam dan tidak memiliki alternatif koneksi yang stabil. Apa tindakan paling tepat?","opsi":{"A":"Mengumpulkan bukti kendala pengguna, menguji akses pada berbagai perangkat dan kondisi jaringan, lalu mengusulkan perbaikan yang mempertahankan keamanan serta kemudahan penggunaan.","B":"Menyarankan masyarakat mengakses aplikasi dari komputer dengan koneksi stabil karena aplikasi dirancang untuk memenuhi standar teknis yang telah ditetapkan.","C":"Mengurangi seluruh fitur formulir agar ukuran halaman menjadi lebih kecil tanpa menguji apakah fungsi penting tetap berjalan dengan benar.","D":"Menyediakan layanan bantuan melalui pesan pribadi petugas sehingga masyarakat dapat mengirimkan informasi yang dibutuhkan tanpa menggunakan formulir elektronik.","E":"Meminta pengembang mengganti aplikasi dengan sistem lain yang lebih sederhana sebelum melakukan evaluasi terhadap aplikasi yang sedang digunakan."},"kunci":"A","poin":{"A":5,"B":2,"C":3,"D":4,"E":1},"pembahasan":"A (5 poin): Menggunakan bukti pengalaman pengguna untuk memperbaiki aksesibilitas tanpa mengabaikan keamanan dan fungsi.\nB (2 poin): Memberikan solusi sementara, tetapi tidak sesuai dengan kondisi akses sebagian besar pengguna.\nC (3 poin): Berpotensi meningkatkan kecepatan, tetapi pengurangan fitur tanpa pengujian dapat mengganggu fungsi.\nD (4 poin): Menyediakan jalur bantuan, tetapi pengiriman data melalui pesan pribadi harus diatur agar tidak menimbulkan risiko privasi.\nE (1 poin): Terlalu cepat mengganti sistem tanpa mengidentifikasi penyebab masalah secara sistematis."},{"bagian":"TKP","no":27,"soal":"Anda mengelola grup komunikasi digital yang digunakan pegawai untuk koordinasi pekerjaan. Seorang anggota mengirimkan tangkapan layar percakapan internal yang berisi data pemohon layanan, kemudian meminta pendapat anggota lain mengenai kasus tersebut. Beberapa pegawai mulai membahas informasi itu di luar konteks pekerjaan. Anda harus menghentikan risiko penyebaran tanpa mengganggu koordinasi yang sedang berlangsung. Apa langkah terbaik?","opsi":{"A":"Mengingatkan anggota agar tidak membagikan informasi serupa lagi, tetapi membiarkan unggahan lama karena sudah terlanjur dilihat oleh anggota grup.","B":"Menghentikan penyebaran, meminta penghapusan sesuai prosedur, mengamankan bukti seperlunya, dan melaporkan insiden melalui jalur yang berwenang.","C":"Menghapus seluruh riwayat percakapan grup agar informasi tidak dapat diakses lagi, tanpa perlu membedakan data yang sensitif dan komunikasi kerja yang sah.","D":"Memindahkan pembahasan kasus ke grup kecil yang beranggotakan pegawai terkait agar pekerjaan dapat dilanjutkan tanpa menarik perhatian anggota lain.","E":"Menyampaikan teguran pribadi kepada pengirim dan meminta anggota lain berhenti membicarakan kasus tersebut tanpa melakukan tindak lanjut lebih jauh."},"kunci":"B","poin":{"A":2,"B":5,"C":1,"D":4,"E":3},"pembahasan":"A (2 poin): Memberikan peringatan, tetapi tidak mengatasi paparan informasi yang sudah terjadi.\nB (5 poin): Mengendalikan penyebaran, mempertahankan bukti yang relevan, dan mengikuti prosedur penanganan insiden.\nC (1 poin): Berusaha menghapus paparan, tetapi penghapusan menyeluruh dapat merusak catatan kerja dan bukti yang dibutuhkan.\nD (4 poin): Membatasi pembahasan kepada pihak terkait, tetapi perlu memastikan pemindahan komunikasi menggunakan saluran resmi yang aman.\nE (3 poin): Menangani perilaku pengirim secara langsung, tetapi belum menjamin pengamanan data dan pelaporan insiden."},{"bagian":"TKP","no":28,"soal":"Instansi Anda menggunakan dasbor digital untuk memantau capaian program. Pada suatu hari, angka capaian meningkat tajam setelah seorang pegawai memperbaiki rumus penghitungan. Pimpinan ingin segera menggunakan angka tersebut dalam presentasi kepada pemangku kepentingan. Namun, Anda menemukan bahwa definisi indikator yang digunakan mungkin berubah dan belum dibandingkan dengan laporan periode sebelumnya. Apa tindakan yang paling tepat?","opsi":{"A":"Menggunakan angka terbaru karena dasbor telah menjadi sumber informasi resmi dan perubahan rumus merupakan bagian dari penyempurnaan sistem.","B":"Menunda seluruh presentasi sampai audit menyeluruh terhadap sistem selesai agar tidak ada kemungkinan kesalahan angka yang disampaikan kepada publik.","C":"Memvalidasi rumus dan definisi indikator, membandingkan hasil dengan data sumber, serta me
